function dibujarLogo(ctx, w, h) {

    zonaLogo = null;

    if (
        !logoListo ||
        !logoImagen
    ) {
        return;
    }

    const maxW =
        w * .18;

            maxH / logoImagen.height
        );

    const lw =
        logoImagen.width * s;

    const lh =
        logoImagen.height * s;

    const m =
        Math.max(

        );

    const x =
        w - lw - m;

    const y =
        m;

    const b =
        Math.max(

        );

    zonaLogo = {
        x: x - b,
        y: y - b,
        width: lw + b * 2,
        height: lh + b * 2
    };

    ctx.save();

    ctx.fillStyle =
        'rgba(0,0,0,.2)';

        lh + 10
    );

    ctx.drawImage(
        logoImagen,
        x,
        y,
        lw,
        lh
    );

}

/* =========================================================
   ESTAMPADO

function dibujarEstampado(
    ctx,
    w,
    h,
    extra = []
) {

    const s =
        Math.max(w, h) / 1200;

    const pad =
        Math.round(16 * s);

    const font =
        Math.max(
            16,
            Math.round(20 * s)
        );

    const line =
        27 * s;

    const pos =
        gpsActual;

    const d =
        fechaFoto || new Date();

    const base = [
        `PROYECTO: ${proyecto || 'SIN PROYECTO'}`,
        `TIPO PROYECTO: ${tipoProyecto || 'SIN TIPO'}`,
        `HUB: ${hub || '-'}  RAMA: ${rama || '-'}`,
        `TIPO FOTO: ${nombreTipo(tipo)}`,
        `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
        pos
            ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
            : 'GPS: SIN UBICACIÓN',
        ...extra
    ];

    ctx.font =
        `bold ${font}px Arial`;

    let tw = 0;

    base.forEach(text => {

        tw = Math.max(
            tw,
            ctx.measureText(text).width
        );
    });

    const bw =
        tw + pad * 2;

    const bh =
        base.length * line +
        pad * 2;

    const x =
        pad;

    const y =
        h - bh - pad;

    zonaEstampado = {
        x: x - 18,
        y: y - 18,
        width: bw + 36,
        height: bh + 36
    };

    ctx.fillStyle =
        'rgba(0,0,0,.48)';

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        bw,
        bh,
        10 * s
    );

    ctx.fill();

    ctx.fillStyle =
        'rgba(255,255,255,.96)';

    ctx.textBaseline =
        'top';

    base.forEach((text, i) => {

        ctx.fillText(
            text,
            x + pad,
            y + pad + i * line
        );
    });

    dibujarLogo(
        ctx,
        w,
        h
    );

/* =========================================================
   ORIENTACIÓN DE PANTALLA
   ========================================================= */

function obtenerOrientacionPantalla() {

    let angulo = 0;

    if (
        screen.orientation &&
        Number.isFinite(
            screen.orientation.angle
        )
    ) {

        angulo =
            screen.orientation.angle;

    } else if (
        Number.isFinite(
            window.orientation
        )
    ) {

        angulo =
            window.orientation;
    }

    angulo =
        ((angulo % 360) + 360) % 360;

    /*
     * Solo utilizamos los cuatro estados
     * físicos de la pantalla.
     */

    if (angulo === 90) return 90;
    if (angulo === 180) return 180;
    if (angulo === 270) return 270;

    return 0;
}

/* =========================================================
   SENSORES
   ========================================================= */

async function iniciarSensores() {

    try {

        /*
         * iPhone / iPad requieren permiso explícito.
         */

        if (
            typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission ===
            'function'
        ) {

            const p =
                await DeviceMotionEvent
                    .requestPermission();

            if (p !== 'granted') {

                throw new Error(
                    'Permiso de movimiento no concedido'
                );
            }
        }

        motionHandler = e => {

            const a =
                e.accelerationIncludingGravity ||
                e.acceleration;

            if (!a) {
                return;
            }

            if (
                Number.isFinite(a.x) &&
                Number.isFinite(a.y)
            ) {

                gravity = {
                    x: Number(a.x),
                    y: Number(a.y),
                    z: Number(a.z || 0)
                };

                gravityReady = true;

                actualizarPlomado();
            }
        };

        window.addEventListener(
            'devicemotion',
            motionHandler,
            {
                passive: true
            }
        );

        /*
         * Orientación.
         */

        if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission ===
            'function'
        ) {

            const p =
                await DeviceOrientationEvent
                    .requestPermission();

            if (p !== 'granted') {

                throw new Error(
                    'Permiso de orientación no concedido'
                );
            }
        }

        orientationHandler = e => {

            if (
                Number.isFinite(e.alpha) ||
                Number.isFinite(e.beta) ||
                Number.isFinite(e.gamma)
            ) {

                orientationData = {
                    alpha:
                        Number(e.alpha || 0),

                    beta:
                        Number(e.beta || 0),

                    gamma:
                        Number(e.gamma || 0)
                };

                orientationReady = true;

                /*
                 * El cálculo principal continúa usando
                 * gravedad porque es más apropiado para
                 * determinar la vertical física.
                 */

                actualizarPlomado();
            }
        };

        window.addEventListener(
            'deviceorientation',
            orientationHandler,
            {
                passive: true
            }
        );

        sensorHud.textContent =
            'Sensores: ACTIVOS';

    } catch (e) {

        sensorHud.textContent =
            'Sensores: no disponibles';

        console.warn(e);
    }

/* =========================================================
   GRAVEDAD EN COORDENADAS DE LA PANTALLA
   =========================================================

   Esta es la parte importante.

   Queremos que:

       Y positivo = ABAJO de la pantalla
       X positivo = DERECHA de la pantalla

   Así:

       atan2(X,Y)

   da directamente:

       0°   = vertical hacia abajo
       +°   = derecha
       -°   = izquierda

   La transformación cambia cuando el teléfono
   gira 90 / 180 / 270 grados.
   ========================================================= */

function gravedadEnPantalla() {

    let x =
        gravity.x;

    let y =
        gravity.y;

    const orientacion =
        obtenerOrientacionPantalla();

    let sx;
    let sy;

    /*
     * Transformación para mantener los ejes
     * relacionados con la pantalla.
     */

    switch (orientacion) {

        case 90:

            /*
             * Landscape derecha.
             */

            sx = y;
            sy = -x;

            break;

        case 180:

            sx = -x;
            sy = -y;

            break;

        case 270:

            sx = -y;
            sy = x;

            break;

        case 0:
        default:

            sx = x;
            sy = y;

            break;
    }

    return {
        x: sx,
        y: sy
    };
}

/* =========================================================
   CÁLCULO DEL ÁNGULO
   ========================================================= */

function calcularAnguloPendulo() {

    if (!gravityReady) {
        return 0;
    }

    const g =
        gravedadEnPantalla();

    const magnitud =
        Math.hypot(
            g.x,
            g.y
        );

    if (
        !Number.isFinite(magnitud) ||
        magnitud < 0.5
    ) {

        return 0;
    }

    /*
     * MUY IMPORTANTE:
     *
     * Y positivo significa ABAJO.
     *
     * Por eso NO utilizamos atan2(x,-y).
     *
     * Utilizamos:
     *
     * atan2(x,y)
     */

    let angulo =
        Math.atan2(
            g.x,
            g.y
        ) *
        180 /
        Math.PI;

    /*
     * Normalizar.
     */

    while (angulo > 180) {
        angulo -= 360;
    }

    while (angulo < -180) {
        angulo += 360;
    }

    /*
     * El péndulo visual se limita a ±90.
     */

    if (angulo > 90) {
        angulo = 90;
    }

    if (angulo < -90) {
        angulo = -90;
    }

    return angulo;
}

/* =========================================================
   DIBUJAR TRANSPORTADOR
   =========================================================

   DISEÑO:

                 PARTE PLANA
        -180 ---------------- 180
                  |
             CENTRO
               \ |
                \|
                 \

   En realidad solamente se muestran:

          -90       0       +90
             \     |     /
              \    |    /
               \   |   /
                \  |  /
                 \ | /
                  \|/

   El arco queda ABAJO.

   No se dibuja círculo completo.
   ========================================================= */

function dibujarTransportador() {

    if (
        !plomadoCanvas ||
        !plomadoOverlay
    ) {
        return;
    }

    const w =
        plomadoOverlay.clientWidth;

    const h =
        plomadoOverlay.clientHeight;

    if (!w || !h) {
        return;
    }

    const dpr =
        window.devicePixelRatio || 1;

    const realW =
        Math.round(w * dpr);

    const realH =
        Math.round(h * dpr);

    if (
        plomadoCanvas.width !== realW ||
        plomadoCanvas.height !== realH
    ) {

        plomadoCanvas.width =
            realW;

        plomadoCanvas.height =
            realH;
    }

    const c =
        plomadoCanvas.getContext('2d');

    c.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    c.clearRect(
        0,
        0,
        w,
        h
    );

    /*
     * =====================================================
     * POSICIÓN DEL TRANSPORTADOR
     * =====================================================
     *
     * El centro SIEMPRE está arriba.
     *
     * El arco baja desde ese centro.
     */

    const cx =
        w / 2;

    /*
     * En vertical lo colocamos un poco más abajo
     * para que no choque con el HUD.
     *
     * En horizontal queda también en la zona superior.
     */

    const cy =
        Math.max(
            105,
            h * 0.15
        );

    /*
     * Radio adaptativo.
     */

    const radius =
        Math.min(
            w * 0.43,
            h * 0.32
        );

    /* =====================================================
       ARCO DEL SEMICÍRCULO
       ===================================================== */

    c.save();

    c.lineCap =
        'round';

    c.lineJoin =
        'round';

    /*
     * Dibujamos solamente de -90° a +90°.
     *
     * El centro es ARRIBA.
     *
     * El arco va hacia ABAJO.
     */

    c.beginPath();

    let primerPunto =
        true;

    for (
        let deg = -90;
        deg <= 90;
        deg += 1
    ) {

        const rad =
            deg *
            Math.PI /
            180;

        /*
         * -90 = izquierda
         *   0 = abajo
         * +90 = derecha
         */

        const x =
            cx +
            radius *
            Math.sin(rad);

        const y =
            cy +
            radius *
            Math.cos(rad);

        if (primerPunto) {

            c.moveTo(
                x,
                y
            );

            primerPunto =
                false;

        } else {

            c.lineTo(
                x,
                y
            );
        }
    }

    c.strokeStyle =
        'rgba(255,255,255,.95)';

    c.lineWidth =
        3;

    c.stroke();

    /* =====================================================
       MARCAS
       ===================================================== */

    for (
        let deg = -90;
        deg <= 90;
        deg++
    ) {

        const rad =
            deg *
            Math.PI /
            180;

        const x1 =
            cx +
            radius *
            Math.sin(rad);

        const y1 =
            cy +
            radius *
            Math.cos(rad);

        let largo =
            9;

        if (
            deg % 10 === 0
        ) {

            largo =
                25;

        } else if (
            deg % 5 === 0
        ) {

            largo =
                17;
        }

        const x2 =
            cx +
            (radius - largo) *
            Math.sin(rad);

        const y2 =
            cy +
            (radius - largo) *
            Math.cos(rad);

        c.beginPath();

        c.moveTo(
            x1,
            y1
        );

        c.lineTo(
            x2,
            y2
        );

        c.strokeStyle =
            deg === 0
                ? '#00ff00'
                : 'rgba(255,255,255,.9)';

        c.lineWidth =
            deg === 0
                ? 4
                : deg % 10 === 0
                    ? 3
                    : 1.5;

        c.stroke();
    }

    /* =====================================================
       NÚMEROS
       ===================================================== */

    c.textAlign =
        'center';

    c.textBaseline =
        'middle';

    c.font =
        'bold 13px Arial';

    for (
        let deg = -90;
        deg <= 90;
        deg += 10
    ) {

        const rad =
            deg *
            Math.PI /
            180;

        /*
         * Los números quedan dentro del arco.
         */

        const textRadius =
            radius - 43;

        const tx =
            cx +
            textRadius *
            Math.sin(rad);

        const ty =
            cy +
            textRadius *
            Math.cos(rad);

        c.fillStyle =
            deg === 0
                ? '#00ff00'
                : '#ffffff';

        c.fillText(
            `${deg}°`,
            tx,
            ty
        );
    }

    /* =====================================================
       LÍNEA PLANA SUPERIOR
       ===================================================== */

    /*
     * Esta es la parte plana del transportador.
     *
     * Se dibuja arriba del centro.
     */

    c.beginPath();

    c.moveTo(
        cx - radius,
        cy
    );

    c.lineTo(
        cx + radius,
        cy
    );

    c.strokeStyle =
        'rgba(255,255,255,.92)';

    c.lineWidth =
        3;

    c.stroke();

    /* =====================================================
       CENTRO / PUNTO DE GIRO
       ===================================================== */

    c.beginPath();

    c.arc(
        cx,
        cy,
        8,
        0,
        Math.PI * 2
    );

    c.fillStyle =
        '#ffffff';

    c.fill();

    c.strokeStyle =
        '#ff3030';

    c.lineWidth =
        3;

    c.stroke();

    /* =====================================================
       PÉNDULO
       ===================================================== */

    const ang =
        plomadoGrados *
        Math.PI /
        180;

    /*
     * El péndulo sale del centro y baja.
     */

    const longitud =
        Math.min(
            h * 0.50,
            w * 0.50
        );

    const px =
        cx +
        longitud *
        Math.sin(ang);

    const py =
        cy +
        longitud *
        Math.cos(ang);

    /*
     * CONTORNO.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle =
        'rgba(0,0,0,.85)';

    c.lineWidth =
        9;

    c.lineCap =
        'round';

    c.stroke();

    /*
     * PÉNDULO ROJO.
     *
     * Más delgado.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle =
        '#ff3030';

    c.lineWidth =
        4;

    c.lineCap =
        'round';

    c.stroke();

    /*
     * PESO.
     */

    c.beginPath();

    c.arc(
        px,
        py,
        9,
        0,
        Math.PI * 2
    );

    c.fillStyle =
        '#ff3030';

    c.fill();

    c.strokeStyle =
        '#ffffff';

    c.lineWidth =
        2;

    c.stroke();

    /*
     * Línea vertical de referencia.
     *
     * AZUL.
     *
     * Esta NO se utiliza para calcular el ángulo.
     * Es únicamente referencia visual.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        cx,
        Math.min(
            h,
            cy + longitud
        )
    );

    c.strokeStyle =
        'rgba(0,160,255,.72)';

    c.lineWidth =
        2;

    c.setLineDash([
        8,
        8
    ]);

    c.stroke();

    c.setLineDash([]);

    c.restore();

    /* =====================================================
       LECTURA
       ===================================================== */

    const grados =
        Math.abs(
            plomadoGrados
        );

    plomadoReading.textContent =
        `PLOMADO: ${grados.toFixed(2)}°`;

    const sentido =
        grados < 0.005
            ? 'CENTRADO'
            : plomadoGrados > 0
                ? 'DERECHA'
                : 'IZQUIERDA';

    plomadoHelp.textContent =
        `Péndulo: ${grados.toFixed(2)}° ${sentido}`;
}

/* =========================================================
   ACTUALIZAR PLOMADO
   ========================================================= */

function actualizarPlomado() {

    if (
        modo !== 'plomado'
    ) {
        return;
    }

    plomadoGrados =
        calcularAnguloPendulo();

    sensorHud.textContent =
        gravityReady
            ? `Sensores: ACTIVOS | péndulo ${plomadoGrados.toFixed(2)}°`
            : 'Sensores: esperando…';

    if (plomadoActivo) {

        dibujarTransportador();
    }
}

/* =========================================================
   ACTIVAR PLOMADO
   ========================================================= */

function activarPlomadoVisual() {

    if (
        modo !== 'plomado'
    ) {
        return;
    }

    plomadoActivo =
        true;

    plomadoOverlay.style.display =
        'block';

    dibujarTransportador();
}

/* =========================================================
   CÁMARA
   ========================================================= */

async function iniciarCamara() {

    try {

        if (cameraStream) {
            detenerCamara();
        }

        setStatus(
            'Solicitando permiso de cámara…'
        );

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: 'environment'
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }
                    },

                    audio: false
                });

        video.srcObject =
            cameraStream;

        await video.play();

        takeButton.disabled =
            false;

        cargarLogo();

        await iniciarSensores();

        configurarModo();

        setStatus(
            modo === 'medir'
                ? '📏 MEDIR POSTE: captura la foto y marca R1, R2, BASE y PUNTA.'
                : modo === 'plomado'
                    ? '📐 PLOMADO: alinea el poste con el péndulo.'
                    : '✅ Cámara lista.'
        );

    } catch (e) {

        console.error(e);

        setStatus(
            '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n' +
            (e.name || '') +
            '\n' +
            (e.message || e)
        );

        takeButton.disabled =
            true;
    }
}

/* =========================================================
   CONFIGURAR MODO
   ========================================================= */

function configurarModo() {

    modeBadge.textContent =
        modo === 'medir'
            ? '📏 MEDIR POSTE'
            : modo === 'plomado'
                ? '📐 PLOMADO POSTE'
                : '📷 ' +
                  nombreTipo(tipo);

    signalButton.style.display =
        modo === 'normal'
            ? 'inline-block'
            : 'none';

    if (modo === 'medir') {

        specialPanel.style.display =
            'block';

        specialHelp.textContent =
            'Escribe la medida real del objeto sólido conocido. Luego toma la foto.';
    }

    if (modo === 'plomado') {

        activarPlomadoVisual();
    }
}

/* =========================================================
   GPS
   ========================================================= */

function obtenerGPS() {

    return new Promise(resolve => {

        if (!navigator.geolocation) {
            return resolve(null);
        }

        navigator.geolocation.getCurrentPosition(
            p => resolve({

                lat:
                    p.coords.latitude,

                lng:
                    p.coords.longitude,

                accuracy:
                    p.coords.accuracy

            }),

            () => resolve(null),

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
}

/* =========================================================
   CAPTURA BASE
   ========================================================= */

function capturaBase() {

    const w =
        video.videoWidth;

    const h =
        video.videoHeight;

    if (!w || !h) {

        throw new Error(
            'La cámara todavía no está lista.'
        );
    }

    canvas.width =
        w;

    canvas.height =
        h;

    const ctx =
        canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    return ctx;
}

/* =========================================================
   TOMAR FOTO
   ========================================================= */

async function tomarFoto() {

    try {

        if (!cameraStream) {

            throw new Error(
                'La cámara no está iniciada.'
            );
        }

        gpsActual =
            await obtenerGPS();

        fechaFoto =
            new Date();

        const ctx =
            capturaBase();

        /* NORMAL */

        if (
            modo === 'normal'
        ) {

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            if (modoSenalar) {

                abrirEditorFlecha();

                return;
            }

            enviarFotoFinal(
                fotoBase,
                {
                    modo: 'normal'
                }
            );

            return;
        }

        /* MEDIR */

        if (
            modo === 'medir'
        ) {

            specialPanel.style.display =
                'none';

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            abrirEditorMedicion();

            return;
        }

        /* PLOMADO */

        if (
            modo === 'plomado'
        ) {

            plomadoGrados =
                calcularAnguloPendulo();

            setStatus(
                `📐 Lectura capturada: ${Math.abs(plomadoGrados).toFixed(2)}°.`
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            confirmarPlomado();

            return;
        }

    } catch (e) {

        console.error(e);

        setStatus(
            '❌ ERROR AL TOMAR FOTO\n' +
            e.message
        );
    }
}

/* =========================================================
   EDITOR DE MEDICIÓN
   ========================================================= */

let measureEditor = null;

function abrirEditorMedicion() {

    if (!measureEditor) {

        measureEditor =
            document.createElement('div');

        measureEditor.style.cssText =
            `
            position:absolute;
            inset:0;
            z-index:25;
            background:#000;
            overflow:hidden;
            touch-action:none;
            `;
    }

    measureEditor.innerHTML = '';

    const c =
        document.createElement('canvas');

    c.width =
        canvas.width;

    c.height =
        canvas.height;

    c.style.cssText =
        `
        position:absolute;
        max-width:100%;
        max-height:100%;
        width:100%;
        height:100%;
        object-fit:contain;
        left:0;
        top:0;
        `;

    const ctx =
        c.getContext('2d');

    const im =
        new Image();

    im.onload = () => {

        ctx.drawImage(
            im,
            0,
            0,

        );

        measureEditor.appendChild(c);

        document
            .getElementById('cameraContainer')
            .appendChild(
                measureEditor
            );

        setStatus(

        );
    };

        fotoBase;
}

/* =========================================================
   CONFIRMAR PLOMADO
   ========================================================= */

function confirmarPlomado() {

    /*
     * IMPORTANTE:
     *
     * El transportador NO se graba en la fotografía.
     *
     * Solamente se guarda el valor de grados.
     */

    plomadoOverlay.style.display =
        'none';

    plomadoActivo =
        false;

    const grados =
        Math.abs(
            plomadoGrados
        );

    const direccion =
        grados < .005
            ? 'CENTRADO'
            : plomadoGrados > 0
                ? 'DERECHA'
                : 'IZQUIERDA';

    const ctx =
        capturaBase();

    /*
     * UN SOLO ESTAMPADO.
     */

    dibujarEstampado(
        ctx,
        canvas.width,
        canvas.height,
        [
            `PLOMADO: ${grados.toFixed(2)}°`,
            `DIRECCIÓN: ${direccion}`
        ]
    );

    fotoBase =
        canvas.toDataURL(
            'image/jpeg',
            .92
        );

    enviarFotoFinal(
        fotoBase,
        {
            modo: 'plomado',

            plomado: {

                grados:
                    Number(
                        grados.toFixed(2)
                    ),

                direccion,

                anguloFirmado:
                    Number(
                        plomadoGrados.toFixed(2)
                    )
            }
        }
    );
}

/* =========================================================
   FLECHA
   ========================================================= */

let arrowEditor = null;
let arrowCanvas = null;

function abrirEditorFlecha() {

    crearEditorFlechaDOM();

    const im =
        new Image();

    im.onload = () => {

        arrowCanvas.width =
            im.naturalWidth;

        arrowCanvas.height =
            im.naturalHeight;

        ajustarCanvasFlecha();

        arrowEditor.style.display =
            'block';

        dibujarFlecha();

        iniciarGestosFlecha();
    };

    im.src =
        fotoBase;
}

function crearEditorFlechaDOM() {

    if (arrowEditor) {
        return;
    }

    arrowEditor =
        document.createElement('div');

    arrowEditor.id =
        'arrowEditor';

    arrowEditor.style.cssText =
        `
        position:absolute;
        inset:0;
        z-index:25;
        background:#000;
        touch-action:none;
        overflow:hidden;
        overscroll-behavior:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
        `;

    arrowCanvas =
        document.createElement('canvas');

    arrowCanvas.id =
        'arrowCanvas';

    arrowCanvas.style.cssText =
        `
        display:block;
        position:absolute;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
        margin:0;
        padding:0;
        `;

    arrowEditor.appendChild(
        arrowCanvas
    );

    document
        .getElementById('cameraContainer')
        .appendChild(
            arrowEditor
        );

    [
        'gesturestart',
        'gesturechange',
        'gestureend'
    ].forEach(eventName => {

        arrowEditor.addEventListener(
            eventName,
            e => e.preventDefault(),
            {
                passive: false
            }
        );
    });

    signalButton.style.display =
        'none';

    takeButton.style.display =
        'none';

    confirmButton.style.display =
        'inline-block';

    cancelSignalButton.style.display =
        'inline-block';

    cancelButton.style.display =
        'none';

    setStatus(
        '🎯 Toca la foto para colocar la flecha. Un dedo mueve; dos dedos giran/cambian tamaño.'
    );

    flechaX = null;
    flechaY = null;
    flechaAngulo = 0;
    flechaEscala = 1;
}

function ajustarCanvasFlecha() {

    if (
        !arrowCanvas ||
        !arrowCanvas.width ||
        !arrowCanvas.height
    ) {
        return;
    }

    const container =
        document.getElementById(
            'cameraContainer'
        );

    const cw =
        container.clientWidth;

    const ch =
        container.clientHeight;

    const iw =
        arrowCanvas.width;

    const ih =
        arrowCanvas.height;

    const escala =
        Math.min(
            cw / iw,
            ch / ih
        );

    const displayW =
        iw * escala;

    const displayH =
        ih * escala;

    arrowCanvas.style.width =
        `${displayW}px`;

    arrowCanvas.style.height =
        `${displayH}px`;

    arrowCanvas.style.left =
        `${(cw - displayW) / 2}px`;

    arrowCanvas.style.top =
        `${(ch - displayH) / 2}px`;
}

function puntoArrow(e) {

    const r =
        arrowCanvas.getBoundingClientRect();

    const p =
        e.touches
            ? e.touches[0]
            : e;

    return {

        x:
            (p.clientX - r.left) *
            arrowCanvas.width /
            r.width,

        y:
            (p.clientY - r.top) *
            arrowCanvas.height /
            r.height
    };
}

function puntoRect(
    x,
    y,
    r
) {

    return (
        r &&
        x >= r.x &&
        x <= r.x + r.width &&
        y >= r.y &&
        y <= r.y + r.height
    );
}

function arrowBlocked(
    x,
    y,
    ang,
    scale
) {

    const f =
        Math.max(
            arrowCanvas.width,
            arrowCanvas.height
        ) / 1200;

    const len =
        150 *
        f *
        scale;

    const sx =
        x -
        len *
        Math.cos(
            ang +
            Math.PI / 4
        );

    const sy =
        y -
        len *
        Math.sin(
            ang +
            Math.PI / 4
        );

    for (
        let i = 0;
        i <= 18;
        i++
    ) {

        const t =
            i / 18;

        const px =
            sx +
            (x - sx) *
            t;

        const py =
            sy +
            (y - sy) *
            t;

        if (
            puntoRect(
                px,
                py,
                zonaLogo
            ) ||
            puntoRect(
                px,
                py,
                zonaEstampado
            )
        ) {
            return true;
        }
    }

    return false;
}

function dibujarFlecha() {

    if (!arrowCanvas) {
        return;
    }

    const im =
        new Image();

    im.onload = () => {

        const c =
            arrowCanvas.getContext('2d');

        c.clearRect(
            0,
            0,
            arrowCanvas.width,
            arrowCanvas.height
        );

        c.drawImage(
            im,
            0,
            0,
            arrowCanvas.width,
            arrowCanvas.height
        );

        if (flechaX == null) {
            return;
        }

        const f =
            Math.max(
                arrowCanvas.width,
                arrowCanvas.height
            ) / 1200;

        const len =
            150 *
            f *
            flechaEscala;

        const tip =
            32 *
            f *
            flechaEscala;

        const sx =
            flechaX -
            len *
            Math.cos(
                flechaAngulo +
                Math.PI / 4
            );

        const sy =
            flechaY -
            len *
            Math.sin(
                flechaAngulo +
                Math.PI / 4
            );

        c.beginPath();

        c.moveTo(
            sx,
            sy
        );

        c.lineTo(
            flechaX,
            flechaY
        );

        c.strokeStyle =
            '#000';

        c.lineWidth =
            Math.max(
                12,
                13 *
                f *
                flechaEscala
            );

        c.lineCap =
            'round';

        c.stroke();

        c.beginPath();

        c.moveTo(
            sx,
            sy
        );

        c.lineTo(
            flechaX,
            flechaY
        );

        c.strokeStyle =
            '#00ff00';

        c.lineWidth =
            Math.max(
                7,
                9 *
                f *
                flechaEscala
            );

        c.stroke();

        const a =
            Math.atan2(
                flechaY - sy,
                flechaX - sx
            );

        c.beginPath();

        c.moveTo(
            flechaX,
            flechaY
        );

        c.lineTo(
            flechaX -
            tip *
            Math.cos(
                a - Math.PI / 6
            ),
            flechaY -
            tip *
            Math.sin(
                a - Math.PI / 6
            )
        );

        c.lineTo(
            flechaX -
            tip *
            Math.cos(
                a + Math.PI / 6
            ),
            flechaY -
            tip *
            Math.sin(
                a + Math.PI / 6
            )
        );

        c.closePath();

        c.fillStyle =
            '#00ff00';

        c.fill();

        c.strokeStyle =
            '#000';

        c.lineWidth =
            Math.max(
                3,
                4 *
                f *
                flechaEscala
            );

        c.stroke();
    };

    im.src =
        fotoBase;
}

/* =========================================================
   GESTOS
   ========================================================= */

function iniciarGestosFlecha() {

    if (
        !arrowCanvas ||
        arrowCanvas.dataset.ready
    ) {
        return;
    }

    arrowCanvas.dataset.ready =
        '1';

    arrowCanvas.addEventListener(
        'touchstart',
        e => {

            e.preventDefault();

            ultimoToque =
                Date.now();

            if (
                e.touches.length === 1
            ) {

                const p =
                    puntoArrow(e);

                if (
                    flechaX == null
                ) {

                    if (
                        arrowBlocked(
                            p.x,
                            p.y,
                            0,
                            1
                        )
                    ) {

                        return alert(
                            '🚫 La flecha no puede cubrir el logo ni el estampado.'
                        );
                    }

                    flechaX =
                        p.x;

                    flechaY =
                        p.y;

                    dibujarFlecha();
                }

                gestoActivo =
                    true;

                toqueInicial = {
                    tipo: 'move',
                    x: p.x,
                    y: p.y,
                    x0: flechaX,
                    y0: flechaY
                };

            } else if (
                e.touches.length === 2 &&
                flechaX != null
            ) {

                const a =
                    puntoArrow(
                        e.touches[0]
                    );

                const b =
                    puntoArrow(
                        e.touches[1]
                    );

                toqueInicial = {

                    tipo: 'transform',

                    dist:
                        Math.hypot(
                            b.x - a.x,
                            b.y - a.y
                        ),

                    ang:
                        Math.atan2(
                            b.y - a.y,
                            b.x - a.x
                        ),

                    x0:
                        flechaX,

                    y0:
                        flechaY,

                    s:
                        flechaEscala,

                    r:
                        flechaAngulo
                };

                gestoActivo =
                    true;
            }
        },
        {
            passive: false
        }
    );

    arrowCanvas.addEventListener(
        'touchmove',
        e => {

            e.preventDefault();

            if (!gestoActivo) {
                return;
            }

            if (
                e.touches.length === 1 &&
                toqueInicial?.tipo === 'move'
            ) {

                const p =
                    puntoArrow(e);

                const nx =
                    toqueInicial.x0 +
                    p.x -
                    toqueInicial.x;

                const ny =
                    toqueInicial.y0 +
                    p.y -
                    toqueInicial.y;

                if (
                    !arrowBlocked(
                        nx,
                        ny,
                        flechaAngulo,
                        flechaEscala
                    )
                ) {

                    flechaX =
                        nx;

                    flechaY =
                        ny;

                    dibujarFlecha();
                }

            } else if (
                e.touches.length === 2 &&
                toqueInicial?.tipo === 'transform'
            ) {

                const a =
                    puntoArrow(
                        e.touches[0]
                    );

                const b =
                    puntoArrow(
                        e.touches[1]
                    );

                const dist =
                    Math.hypot(
                        b.x - a.x,
                        b.y - a.y
                    );

                const ang =
                    Math.atan2(
                        b.y - a.y,
                        b.x - a.x
                    );

                const s =
                    clamp(
                        toqueInicial.s *
                        dist /
                        toqueInicial.dist,
                        .35,
                        3
                    );

                const r =
                    toqueInicial.r +
                    ang -
                    toqueInicial.ang;

                if (
                    !arrowBlocked(
                        toqueInicial.x0,
                        toqueInicial.y0,
                        r,
                        s
                    )
                ) {

                    flechaEscala =
                        s;

                    flechaAngulo =
                        r;

                    dibujarFlecha();
                }
            }
        },
        {
            passive: false
        }
    );

    arrowCanvas.addEventListener(
        'touchend',
        e => {

            if (!e.touches.length) {

                gestoActivo =
                    false;

                toqueInicial =
                    null;
            }
        },
        {
            passive: false
        }
    );
}

/* =========================================================
   CERRAR FLECHA
   ========================================================= */

function cerrarEditorFlecha() {

    if (arrowEditor) {

        arrowEditor.remove();

        arrowEditor =
            null;

        arrowCanvas =
            null;
    }

    confirmButton.style.display =
        'none';

    cancelSignalButton.style.display =
        'none';

    takeButton.style.display =
        'inline-block';

    cancelButton.style.display =
        'inline-block';

    signalButton.style.display =
        'inline-block';
}

/* =========================================================
   MEDIDA REAL
   ========================================================= */

measureStart.addEventListener(
    'click',
    () => {

        const v =
            Number(
                knownMeasure.value
            );

        if (
            !Number.isFinite(v) ||
            v <= 0
        ) {

            return alert(
                'Captura una medida real mayor que cero.'
            );
        }

        referenceReal =
            v;

        specialPanel.style.display =
            'none';

        setStatus(
            'Medida guardada: ' +
            v +
            ' m. Ahora toma la fotografía.'
        );

        takeButton.disabled =
            false;
    }
);

/* =========================================================
   ENVÍO
   ========================================================= */

function enviarFotoFinal(
    dataURL,
    extra = {}
) {

    preview.src =
        dataURL;

    preview.style.display =
        'block';

    const mensaje = {

        type:
            'CAMERA_STAMP_PHOTO',

        tipo:
            String(tipo || '')
                .trim(),

        fileName:
            crearNombreFoto(
                tipo,
                fechaFoto ||
                new Date()
            ),

        mimeType:
            'image/jpeg',

        data:
            dataURL,

        latitud:
            gpsActual
                ? gpsActual.lat
                : null,

        longitud:
            gpsActual
                ? gpsActual.lng
                : null,

        modo,

        metadata: {

            proyecto,

            tipoProyecto,

            hub,

            rama,

            tipoFoto:
                nombreTipo(tipo),

            fecha:
                (
                    fechaFoto ||
                    new Date()
                ).toISOString(),

            gps:
                gpsActual
        },

        ...extra
    };

    let confirmado =
        false;

    const cerrarTrasAck =
        e => {

            if (
                !e ||
                !e.data ||
                e.data.type !==
                'CAMERA_STAMP_ACK'
            ) {
                return;
            }

            if (
                e.data.fileName &&
                e.data.fileName !==
                mensaje.fileName
            ) {
                return;
            }

            confirmado =
                true;

            window.removeEventListener(
                'message',
                cerrarTrasAck
            );

            setStatus(
                '✅ FOTO RECIBIDA POR EL FORMULARIO.'
            );

            detenerCamara();

            setTimeout(
                () => {

                    try {

                        if (
                            window.opener &&
                            !window.opener.closed
                        ) {

                            window.opener.focus();
                        }

                        window.close();

                    } catch (_) {}
                },
                150
            );
        };

    window.addEventListener(
        'message',
        cerrarTrasAck
    );

    if (
        window.opener &&
        !window.opener.closed
    ) {

        window.opener.postMessage(
            mensaje,
            '*'
        );

        setStatus(
            '📤 Enviando fotografía al formulario…'
        );

    } else {

        window.removeEventListener(
            'message',
            cerrarTrasAck
        );

        setStatus(
            '❌ No se encontró el formulario que abrió la cámara.'
        );

        return;
    }

    setTimeout(
        () => {

            if (confirmado) {
                return;
            }

            window.removeEventListener(
                'message',
                cerrarTrasAck
            );

            setStatus(
                '✅ FOTO ENVIADA AL FORMULARIO.'
            );

            detenerCamara();

            try {

                if (
                    window.opener &&
                    !window.opener.closed
                ) {

                    window.opener.focus();
                }

                window.close();

            } catch (_) {}

        },
        2500
    );
}

/* =========================================================
   DETENER CÁMARA
   ========================================================= */

function detenerCamara() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                t => t.stop()
            );

        cameraStream =
            null;
    }

    video.srcObject =
        null;

    takeButton.disabled =
        true;

    if (motionHandler) {

        window.removeEventListener(
            'devicemotion',
            motionHandler
        );

        motionHandler =
            null;
    }

    if (orientationHandler) {

        window.removeEventListener(
            'deviceorientation',
            orientationHandler
        );

        orientationHandler =
            null;
    }
}

/* =========================================================
   SEÑALAR
   ========================================================= */

signalButton.addEventListener(
    'click',
    () => {

        modoSenalar =
            !modoSenalar;

        signalButton.textContent =
            modoSenalar
                ? '🎯 ACTIVO'
                : '🎯 SEÑALAR';

        setStatus(
            modoSenalar
                ? '🎯 SEÑALAR ACTIVADO. Toma la fotografía.'
                : 'Señalar desactivado.'
        );
    }
);

/* =========================================================
   FOTO
   ========================================================= */

takeButton.addEventListener(
    'click',
    tomarFoto
);

/* =========================================================
   SALIR
   ========================================================= */

cancelButton.addEventListener(
    'click',
    () => {

        detenerCamara();

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.close();
        }
    }
);

/* =========================================================
   CONFIRMAR FLECHA
   ========================================================= */

confirmButton.addEventListener(
    'click',
    () => {

        if (flechaX == null) {

            return alert(
                'Primero toca la imagen para colocar la flecha.'
            );
        }

        const data =
            arrowCanvas.toDataURL(
                'image/jpeg',
                .92
            );

        cerrarEditorFlecha();

        enviarFotoFinal(
            data,
            {
                modo: 'normal',

                metadata: {

                    flecha: {

                        x:
                            flechaX,

                        y:
                            flechaY,

                        angulo:
                            flechaAngulo,

                        escala:
                            flechaEscala
                    }
                }
            }
        );
    }
);

/* =========================================================
   CANCELAR FLECHA
   ========================================================= */

cancelSignalButton.addEventListener(
    'click',
    () => {

        cerrarEditorFlecha();

        fotoBase =
            null;

        setStatus(
            'Se canceló el señalamiento. Puedes tomar otra fotografía.'
        );
    }
);

/* =========================================================
   RESIZE / ROTACIÓN
   ========================================================= */

function actualizarInterfazOrientacion() {

    /*
     * Esperamos un instante porque algunos teléfonos
     * actualizan screen.orientation después del resize.
     */

    requestAnimationFrame(() => {

        if (
            arrowEditor &&
            arrowCanvas
        ) {

            ajustarCanvasFlecha();
        }

        if (
            modo === 'plomado'
        ) {

            dibujarTransportador();
            actualizarPlomado();
        }
    });
}

window.addEventListener(
    'resize',
    actualizarInterfazOrientacion
);

window.addEventListener(
    'orientationchange',
    () => {

        setTimeout(
            actualizarInterfazOrientacion,
            100
        );

        setTimeout(
            actualizarInterfazOrientacion,
            400
        );
    }
);

if (screen.orientation) {

    screen.orientation.addEventListener(
        'change',
        () => {

            setTimeout(
                actualizarInterfazOrientacion,
                100
            );
        }
    );
}

/* =========================================================
   INICIO
   ========================================================= */

window.addEventListener(
    'load',
    async () => {

        modeBadge.textContent =
            modo === 'medir'
                ? '📏 MEDIR POSTE'
                : modo === 'plomado'
                    ? '📐 PLOMADO POSTE'
                    : '📷 ' +
                      nombreTipo(tipo);

        if (modo === 'medir') {

            specialPanel.style.display =
                'block';

            specialHelp.textContent =
                'Captura la medida real del objeto conocido. La referencia y el poste deben estar aproximadamente a la misma distancia/plano para reducir error de perspectiva.';
        }

        if (modo === 'plomado') {

            plomadoOverlay.style.display =
                'block';

            plomadoActivo =
                true;

            dibujarTransportador();
        }

        setStatus(
            'Abriendo cámara…'
        );

        await iniciarCamara();
    }
);

</script>

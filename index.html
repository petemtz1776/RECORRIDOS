<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<title>PETES CAMERA STAMP</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    color:#fff;
    font-family:Arial,sans-serif;

   HUD
========================================================= */

<script>

'use strict';

/* =========================================================
   PARAMETROS
========================================================= */

const params =
    new URLSearchParams(location.search);

const tipo =
    params.get('tipo') || 'poste';

let modo =
    params.get('modo') || 'normal';

if(
    String(tipo).trim().toUpperCase()==='MEDIR POSTE'
){
    modo='medir';
}

if(
    String(tipo).trim().toUpperCase()==='PLOMADO POSTE'
){
    modo='plomado';
}

const proyecto =
    params.get('proyecto') || '';

const tipoProyecto =
    params.get('tipoProyecto') || '';

const hub =
    params.get('hub') || '';

const rama =
    params.get('rama') || '';

/* =========================================================
   LOGO
========================================================= */

const LOGO_DRIVE_ID =
    '12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP';

const LOGO_URL =
    'https://lh3.googleusercontent.com/d/' +
    LOGO_DRIVE_ID;

const LOGO_URL_ALTERNATIVO =
    'https://drive.google.com/uc?export=view&id=' +
    LOGO_DRIVE_ID;

/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById('video');

const canvas =
    document.getElementById('canvas');

const workCanvas =
    document.getElementById('workCanvas');

const takeButton =
    document.getElementById('takeButton');

const signalButton =
    document.getElementById('signalButton');

const confirmButton =
    document.getElementById('confirmButton');

const cancelSignalButton =
    document.getElementById('cancelSignalButton');

const cancelButton =
    document.getElementById('cancelButton');

const status =
    document.getElementById('status');

const preview =
    document.getElementById('preview');

const modeBadge =
    document.getElementById('modeBadge');

const sensorHud =
    document.getElementById('sensorHud');

const specialPanel =
    document.getElementById('specialPanel');

const knownMeasure =
    document.getElementById('knownMeasure');

const specialHelp =
    document.getElementById('specialHelp');

const measureStart =
    document.getElementById('measureStart');

const plomadoOverlay =
    document.getElementById('plomadoOverlay');

const plomadoCanvas =
    document.getElementById('plomadoCanvas');

const plomadoReading =
    document.getElementById('plomadoReading');

const plomadoHelp =
    document.getElementById('plomadoHelp');

/* =========================================================
   ESTADO
========================================================= */

let cameraStream=null;

let gpsActual=null;

let fechaFoto=null;

let logoImagen=null;

let logoListo=false;

let zonaLogo=null;

let zonaEstampado=null;

let modoSenalar=false;

let fotoBase=null;

/* Sensores */

let motionHandler=null;

let orientationHandler=null;

let gravity={
    x:0,
    y:9.8,
    z:0
};

let gravityReady=false;

/* Plomado */

let plomadoGrados=0;

let plomadoActivo=false;

/* =========================================================
   GENERALES
========================================================= */

function setStatus(text){
    status.textContent=text;
}

function nombreTipo(t){

    if(t==='poste'){
        return 'POSTE';
    }

    if(t==='carriers'){
        return 'CAJAS CARRIERS';
    }

    return String(t).toUpperCase();
}

function formatDate(d){

    const p=
        n=>String(n).padStart(2,'0');

    return(
        d.getFullYear()+
        p(d.getMonth()+1)+
        p(d.getDate())+
        '_' +
        p(d.getHours())+
        p(d.getMinutes())+
        p(d.getSeconds())
    );
}

function crearNombreFoto(t,d){

    return(
        'STAMPED_' +
        nombreTipo(t).replace(/\s+/g,'_')+
        '_' +
        formatDate(d)+
        '.jpg'
    );
}

function clamp(v,a,b){

    return Math.max(
        a,
        Math.min(b,v)
    );
}

/* =========================================================
   LOGO
========================================================= */

function cargarLogo(){

    logoListo=false;

    logoImagen=new Image();

    logoImagen.crossOrigin='anonymous';

    logoImagen.onload=()=>{
        logoListo=true;
    };

    logoImagen.onerror=()=>{

        const im=new Image();

        im.crossOrigin='anonymous';

        im.onload=()=>{

            logoImagen=im;
            logoListo=true;

        };

        im.src=LOGO_URL_ALTERNATIVO;
    };

    logoImagen.src=LOGO_URL;
}

function dibujarLogo(ctx,w,h){

    zonaLogo=null;

    if(!logoListo || !logoImagen){
        return;
    }

    const maxW=w*.18;
    const maxH=h*.14;

    const s=Math.min(
        maxW/logoImagen.width,
        maxH/logoImagen.height
    );

    const lw=logoImagen.width*s;
    const lh=logoImagen.height*s;

    const m=Math.max(
        20,
        w*.025
    );

    const x=w-lw-m;
    const y=m;

    const b=Math.max(
        15,
        w*.012
    );

    zonaLogo={
        x:x-b,
        y:y-b,
        width:lw+b*2,
        height:lh+b*2
    };

    ctx.save();

    ctx.fillStyle='rgba(0,0,0,.2)';

    ctx.fillRect(
        x-5,
        y-5,
        lw+10,
        lh+10
    );

    ctx.drawImage(
        logoImagen,
        x,
        y,
        lw,
        lh
    );

    ctx.restore();
}

/* =========================================================
   ESTAMPADO
========================================================= */

function dibujarEstampado(
    ctx,
    w,
    h,
    extra=[]
){

    const s=Math.max(w,h)/1200;

    const pad=Math.round(16*s);

    const font=Math.max(
        16,
        Math.round(20*s)
    );

    const line=27*s;

    const pos=gpsActual;

    const d=fechaFoto||new Date();

    const base=[
        `PROYECTO: ${proyecto||'SIN PROYECTO'}`,
        `TIPO PROYECTO: ${tipoProyecto||'SIN TIPO'}`,
        `HUB: ${hub||'-'}  RAMA: ${rama||'-'}`,
        `TIPO FOTO: ${nombreTipo(tipo)}`,
        `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
        pos
            ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
            : 'GPS: SIN UBICACIÓN',
        ...extra
    ];

    ctx.font=`bold ${font}px Arial`;

    let tw=0;

    base.forEach(text=>{
        tw=Math.max(
            tw,
            ctx.measureText(text).width
        );
    });

    const bw=tw+pad*2;

    const bh=base.length*line+pad*2;

    const x=pad;

    const y=h-bh-pad;

    zonaEstampado={
        x:x-18,
        y:y-18,
        width:bw+36,
        height:bh+36
    };

    ctx.fillStyle='rgba(0,0,0,.48)';

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        bw,
        bh,
        10*s
    );

    ctx.fill();

    ctx.fillStyle='rgba(255,255,255,.96)';

    ctx.textBaseline='top';

    base.forEach((text,i)=>{

        ctx.fillText(
            text,
            x+pad,
            y+pad+i*line
        );

    });

    dibujarLogo(ctx,w,h);
}

/* =========================================================
   ORIENTACION DEL TELEFONO
========================================================= */

function obtenerOrientacion(){

    if(
        screen.orientation &&
        Number.isFinite(screen.orientation.angle)
    ){
        return screen.orientation.angle;
    }

    if(
        typeof window.orientation==='number'
    ){
        return window.orientation;
    }

    return 0;
}

/* =========================================================
   SENSOR
========================================================= */

async function iniciarSensores(){

    try{

        if(
            typeof DeviceMotionEvent!=='undefined' &&
            typeof DeviceMotionEvent.requestPermission==='function'
        ){

            const permiso=
                await DeviceMotionEvent.requestPermission();

            if(permiso!=='granted'){
                throw new Error(
                    'Permiso de movimiento no concedido'
                );
            }
        }

        motionHandler=e=>{

            const a=
                e.accelerationIncludingGravity ||
                e.acceleration ||
                {};

            if(
                Number.isFinite(a.x) &&
                Number.isFinite(a.y)
            ){

                gravity={
                    x:a.x,
                    y:a.y,
                    z:Number.isFinite(a.z)
                        ? a.z
                        : 0
                };

                gravityReady=true;

                actualizarPlomado();
            }
        };

        window.addEventListener(
            'devicemotion',
            motionHandler,
            {passive:true}
        );

        if(
            typeof DeviceOrientationEvent!=='undefined' &&
            typeof DeviceOrientationEvent.requestPermission==='function'
        ){

            const permiso=
                await DeviceOrientationEvent.requestPermission();

            if(permiso!=='granted'){
                throw new Error(
                    'Permiso de orientación no concedido'
                );
            }
        }

        orientationHandler=()=>{
            actualizarPlomado();
        };

        window.addEventListener(
            'deviceorientation',
            orientationHandler,
            {passive:true}
        );

        sensorHud.textContent=
            'Sensores: ACTIVOS';

    }catch(e){

        sensorHud.textContent=
            'Sensores: no disponibles';

        console.warn(e);
    }
}

/* =========================================================
   GRAVEDAD EN COORDENADAS DE PANTALLA
========================================================= */

function obtenerGravedadPantalla(){

    let x=gravity.x;
    let y=gravity.y;

    const ang=
        ((obtenerOrientacion()%360)+360)%360;

    /*
     * Coordenadas del sensor:
     *
     * X = derecha del teléfono
     * Y = arriba del teléfono
     *
     * Convertimos esas coordenadas
     * a coordenadas visuales de pantalla.
     */

    if(ang===90){

        const temp=x;

        x=y;
        y=-temp;

    }else if(ang===180){

        x=-x;
        y=-y;

    }else if(ang===270){

        const temp=x;

        x=-y;
        y=temp;
    }

    return{x,y};
}

/* =========================================================
   ANGULO DEL PENDULO
========================================================= */

function calcularAnguloPendulo(){

    const g=obtenerGravedadPantalla();

    if(
        !Number.isFinite(g.x) ||
        !Number.isFinite(g.y)
    ){
        return 0;
    }

    const magnitud=
        Math.hypot(g.x,g.y);

    if(magnitud<0.1){
        return 0;
    }

    /*
     * El péndulo apunta hacia donde cae la gravedad.
     *
     * 0° = vertical hacia abajo.
     *
     * + = derecha.
     *
     * - = izquierda.
     */

    let ang=
        Math.atan2(
            g.x,
            -g.y
        )*
        180/
        Math.PI;

    while(ang>180){
        ang-=360;
    }

    while(ang<-180){
        ang+=360;
    }

    return clamp(
        ang,
        -90,
        90
    );
}

/* =========================================================
   DIBUJAR TRANSPORTADOR
========================================================= */

function dibujarTransportador(){

    const w=
        plomadoOverlay.clientWidth;

    const h=
        plomadoOverlay.clientHeight;

    if(!w || !h){
        return;
    }

    const dpr=
        window.devicePixelRatio||1;

    const realW=
        Math.round(w*dpr);

    const realH=
        Math.round(h*dpr);

    if(
        plomadoCanvas.width!==realW ||
        plomadoCanvas.height!==realH
    ){

        plomadoCanvas.width=realW;
        plomadoCanvas.height=realH;
    }

    const c=
        plomadoCanvas.getContext('2d');

    c.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    c.clearRect(
        0,
        0,
        w,
        h
    );

    /*
     * ======================================================
     * MEDIO CIRCULO
     *
     * PARTE PLANA ARRIBA
     * ARCO HACIA ABAJO
     *
     * El centro está arriba.
     * Los extremos del arco quedan abajo/laterales.
     * ======================================================
     */

    const cx=w/2;

    /*
     * En vertical colocamos el centro
     * en aproximadamente 15% de la pantalla.
     *
     * En horizontal se adapta automáticamente.
     */

    const cy=
        Math.max(
            75,
            Math.min(
                h*.22,
                150
            )
        );

    /*
     * El radio se adapta al ancho y alto.
     */

    const radius=
        Math.min(
            w*.43,
            h*.38
        );

    /* ======================================================
       ARCO DEL TRANSPORTADOR
    ====================================================== */

    c.save();

    c.strokeStyle=
        'rgba(255,255,255,.95)';

    c.lineWidth=3;

    c.beginPath();

    /*
     * 180° a la izquierda
     * 0° arriba
     * -180° a la derecha
     *
     * Arco inferior.
     */

    c.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI,
        false
    );

    c.stroke();

    /*
     * Línea plana superior.
     */

    c.beginPath();

    c.moveTo(
        cx-radius,
        cy
    );

    c.lineTo(
        cx+radius,
        cy
    );

    c.stroke();

    /* ======================================================
       MARCAS
    ====================================================== */

    for(
        let deg=-90;
        deg<=90;
        deg++
    ){

        const rad=
            deg*Math.PI/180;

        /*
         * 0 = vertical hacia abajo
         */

        const x=
            cx+
            radius*
            Math.sin(rad);

        const y=
            cy+
            radius*
            Math.cos(rad);

        let largo=8;

        if(deg%10===0){
            largo=25;
        }else if(deg%5===0){
            largo=17;
        }

        const x2=
            cx+
            (radius-largo)*
            Math.sin(rad);

        const y2=
            cy+
            (radius-largo)*
            Math.cos(rad);

        c.beginPath();

        c.moveTo(
            x,
            y
        );

        c.lineTo(
            x2,
            y2
        );

        c.strokeStyle=
            deg===0
                ? '#00ff00'
                : 'rgba(255,255,255,.9)';

        c.lineWidth=
            deg===0
                ? 4
                : deg%10===0
                    ? 3
                    : 1.5;

        c.stroke();
    }

    /* ======================================================
       NUMEROS
    ====================================================== */

    c.textAlign='center';
    c.textBaseline='middle';

    c.font=
        'bold 13px Arial';

    for(
        let deg=-90;
        deg<=90;
        deg+=10
    ){

        const rad=
            deg*Math.PI/180;

        const textRadius=
            radius-43;

        const tx=
            cx+
            textRadius*
            Math.sin(rad);

        const ty=
            cy+
            textRadius*
            Math.cos(rad);

        c.fillStyle=
            deg===0
                ? '#00ff00'
                : '#ffffff';

        c.fillText(
            `${deg}°`,
            tx,
            ty
        );
    }

    /* ======================================================
       CENTRO
    ====================================================== */

    c.beginPath();

    c.arc(
        cx,
        cy,
        7,
        0,
        Math.PI*2
    );

    c.fillStyle='#ff3b30';

    c.fill();

    c.strokeStyle='#fff';

    c.lineWidth=2;

    c.stroke();

    /* ======================================================
       LINEA VERTICAL DE REFERENCIA
    ====================================================== */

    const longitud=
        Math.min(
            radius*.92,
            h*.50
        );

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        cx,
        cy+longitud
    );

    c.strokeStyle=
        'rgba(0,170,255,.75)';

    c.lineWidth=2;

    c.setLineDash([
        7,
        7
    ]);

    c.stroke();

    c.setLineDash([]);

    /* ======================================================
       PENDULO
    ====================================================== */

    const ang=
        plomadoGrados*
        Math.PI/
        180;

    const px=
        cx+
        longitud*
        Math.sin(ang);

    const py=
        cy+
        longitud*
        Math.cos(ang);

    /*
     * Contorno oscuro.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle=
        'rgba(0,0,0,.8)';

    c.lineWidth=6;

    c.lineCap='round';

    c.stroke();

    /*
     * Línea roja del péndulo.
     * MÁS DELGADA.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle='#ff3030';

    c.lineWidth=3;

    c.lineCap='round';

    c.stroke();

    /*
     * Peso.
     */

    c.beginPath();

    c.arc(
        px,
        py,
        8,
        0,
        Math.PI*2
    );

    c.fillStyle='#ff3030';

    c.fill();

    c.strokeStyle='#fff';

    c.lineWidth=2;

    c.stroke();

    c.restore();

    /* ======================================================
       LECTURA
    ====================================================== */

    plomadoReading.textContent=
        `PLOMADO: ${Math.abs(plomadoGrados).toFixed(2)}°`;

    const sentido=
        Math.abs(plomadoGrados)<.005
            ? 'CENTRADO'
            : plomadoGrados>0
                ? 'DERECHA'
                : 'IZQUIERDA';

    plomadoHelp.textContent=
        `Péndulo: ${Math.abs(plomadoGrados).toFixed(2)}° ${sentido}`;
}

/* =========================================================
   ACTUALIZAR PLOMADO
========================================================= */

function actualizarPlomado(){

    if(modo!=='plomado'){
        return;
    }

    plomadoGrados=
        calcularAnguloPendulo();

    sensorHud.textContent=
        gravityReady
            ? `Sensores: ACTIVOS | ${plomadoGrados.toFixed(2)}°`
            : 'Sensores: esperando…';

    if(plomadoActivo){
        dibujarTransportador();
    }
}

/* =========================================================
   CAPTURAR TRANSPORTADOR EN LA FOTO
========================================================= */

function dibujarTransportadorEnFoto(ctx,w,h){

    /*
     * Esta función dibuja el MISMO transportador
     * sobre el canvas de la fotografía.
     */

    const cx=w/2;

    const cy=
        Math.max(
            75,
            Math.min(
                h*.22,
                150
            )
        );

    const radius=
        Math.min(
            w*.43,
            h*.38
        );

    const escala=
        Math.min(
            w/900,
            h/900
        );

    ctx.save();

    /* ======================================================
       ARCO
    ====================================================== */

    ctx.strokeStyle=
        'rgba(255,255,255,.95)';

    ctx.lineWidth=
        Math.max(
            3,
            4*escala
        );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI,
        false
    );

    ctx.stroke();

    /* Línea plana */

    ctx.beginPath();

    ctx.moveTo(
        cx-radius,
        cy
    );

    ctx.lineTo(
        cx+radius,
        cy
    );

    ctx.stroke();

    /* ======================================================
       MARCAS Y GRADOS
    ====================================================== */

    for(
        let deg=-90;
        deg<=90;
        deg++
    ){

        const rad=
            deg*Math.PI/180;

        const x=
            cx+
            radius*Math.sin(rad);

        const y=
            cy+
            radius*Math.cos(rad);

        let largo=
            9*escala;

        if(deg%10===0){
            largo=28*escala;
        }else if(deg%5===0){
            largo=19*escala;
        }

        const x2=
            cx+
            (radius-largo)*Math.sin(rad);

        const y2=
            cy+
            (radius-largo)*Math.cos(rad);

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x2,
            y2
        );

        ctx.strokeStyle=
            deg===0
                ? '#00ff00'
                : 'rgba(255,255,255,.92)';

        ctx.lineWidth=
            deg===0
                ? 5*escala
                : 2*escala;

        ctx.stroke();
    }

    ctx.font=
        `bold ${Math.max(20,26*escala)}px Arial`;

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    for(
        let deg=-90;
        deg<=90;
        deg+=10
    ){

        const rad=
            deg*Math.PI/180;

        const tr=
            radius-48*escala;

        const tx=
            cx+
            tr*Math.sin(rad);

        const ty=
            cy+
            tr*Math.cos(rad);

        ctx.fillStyle=
            deg===0
                ? '#00ff00'
                : '#ffffff';

        /*
         * Sombra para que los números
         * sean visibles sobre la cámara.
         */

        ctx.strokeStyle='rgba(0,0,0,.85)';
        ctx.lineWidth=5*escala;

        ctx.strokeText(
            `${deg}°`,
            tx,
            ty
        );

        ctx.fillText(
            `${deg}°`,
            tx,
            ty
        );
    }

    /* ======================================================
       CENTRO
    ====================================================== */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        10*escala,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#ff3b30';

    ctx.fill();

    ctx.strokeStyle='#fff';

    ctx.lineWidth=3*escala;

    ctx.stroke();

    /* ======================================================
       REFERENCIA VERTICAL
    ====================================================== */

    const longitud=
        Math.min(
            radius*.92,
            h*.50
        );

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        cx,
        cy+longitud
    );

    ctx.strokeStyle=
        'rgba(0,170,255,.75)';

    ctx.lineWidth=
        Math.max(
            2,
            3*escala
        );

    ctx.setLineDash([
        10*escala,
        10*escala
    ]);

    ctx.stroke();

    ctx.setLineDash([]);

    /* ======================================================
       PENDULO
    ====================================================== */

    const ang=
        plomadoGrados*
        Math.PI/
        180;

    const px=
        cx+
        longitud*Math.sin(ang);

    const py=
        cy+
        longitud*Math.cos(ang);

    /* sombra */

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        px,
        py
    );

    ctx.strokeStyle=
        'rgba(0,0,0,.85)';

    ctx.lineWidth=
        Math.max(
            5,
            8*escala
        );

    ctx.lineCap='round';

    ctx.stroke();

    /* roja */

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        px,
        py
    );

    ctx.strokeStyle='#ff3030';

    ctx.lineWidth=
        Math.max(
            2,
            3*escala
        );

    ctx.stroke();

    /* peso */

    ctx.beginPath();

    ctx.arc(
        px,
        py,
        11*escala,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#ff3030';

    ctx.fill();

    ctx.strokeStyle='#fff';

    ctx.lineWidth=3*escala;

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   CAMARA
========================================================= */

async function iniciarCamara(){

    try{

        if(cameraStream){
            detenerCamara();
        }

        setStatus(
            'Solicitando permiso de cámara…'
        );

        cameraStream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:'environment'
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }
                },

                audio:false
            });

        video.srcObject=
            cameraStream;

        await video.play();

        takeButton.disabled=false;

        cargarLogo();

        await iniciarSensores();

        configurarModo();

        setStatus(
            modo==='medir'
                ? '📏 MEDIR POSTE: captura la foto y marca la referencia.'
                : modo==='plomado'
                    ? '📐 PLOMADO: alinea el poste con el péndulo.'
                    : '✅ Cámara lista.'
        );

    }catch(e){

        console.error(e);

        setStatus(
            '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n'+
            (e.name||'')+
            '\n'+
            (e.message||e)
        );

        takeButton.disabled=true;
    }
}

/* =========================================================
   CONFIGURAR MODO
========================================================= */

function configurarModo(){

    modeBadge.textContent=
        modo==='medir'
            ? '📏 MEDIR POSTE'
            : modo==='plomado'
                ? '📐 PLOMADO POSTE'
                : '📷 '+nombreTipo(tipo);

    signalButton.style.display=
        modo==='normal'
            ? 'inline-block'
            : 'none';

    if(modo==='medir'){

        specialPanel.style.display='block';

        specialHelp.textContent=
            'Escribe la medida real del objeto de referencia.';
    }

    if(modo==='plomado'){

        plomadoActivo=true;

        plomadoOverlay.style.display='block';

        dibujarTransportador();
    }
}

/* =========================================================
   GPS
========================================================= */

function obtenerGPS(){

    return new Promise(resolve=>{

        if(!navigator.geolocation){
            return resolve(null);
        }

        navigator.geolocation.getCurrentPosition(

            p=>resolve({

                lat:p.coords.latitude,
                lng:p.coords.longitude,
                accuracy:p.coords.accuracy

            }),

            ()=>resolve(null),

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }
        );
    });
}

/* =========================================================
   CAPTURA VIDEO
========================================================= */

function capturaBase(){

    const w=video.videoWidth;
    const h=video.videoHeight;

    if(!w||!h){

        throw new Error(
            'La cámara todavía no está lista.'
        );
    }

    canvas.width=w;
    canvas.height=h;

    const ctx=
        canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    return ctx;
}

/* =========================================================
   FOTO
========================================================= */

async function tomarFoto(){

    try{

        if(!cameraStream){

            throw new Error(
                'La cámara no está iniciada.'
            );
        }

        gpsActual=
            await obtenerGPS();

        fechaFoto=
            new Date();

        /*
         * PLOMADO
         */

        if(modo==='plomado'){

            /*
             * Primero actualizamos la lectura.
             */

            plomadoGrados=
                calcularAnguloPendulo();

            /*
             * Capturamos el video.
             */

            const ctx=
                capturaBase();

            /*
             * IMPORTANTE:
             * aquí se dibuja el transportador
             * REAL sobre la fotografía.
             */

            dibujarTransportadorEnFoto(
                ctx,
                canvas.width,
                canvas.height
            );

            /*
             * Y después el estampado.
             */

            const grados=
                Math.abs(plomadoGrados);

            const direccion=
                Math.abs(plomadoGrados)<.005
                    ? 'CENTRADO'
                    : plomadoGrados>0
                        ? 'DERECHA'
                        : 'IZQUIERDA';

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height,
                [
                    `PLOMADO: ${grados.toFixed(2)}°`,
                    `DIRECCIÓN: ${direccion}`
                ]
            );

            fotoBase=
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            /*
             * Ocultamos la interfaz.
             * La imagen ya contiene todo.
             */

            plomadoOverlay.style.display='none';

            plomadoActivo=false;

            enviarFotoFinal(
                fotoBase,
                {
                    modo:'plomado',

                    plomado:{
                        grados:Number(
                            grados.toFixed(2)
                        ),

                        direccion,

                        anguloFirmado:Number(
                            plomadoGrados.toFixed(2)
                        )
                    }
                }
            );

            return;
        }

        /*
         * NORMAL
         */

        if(modo==='normal'){

            const ctx=
                capturaBase();

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase=
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            enviarFotoFinal(
                fotoBase,
                {
                    modo:'normal'
                }
            );

            return;
        }

        /*
         * MEDIR
         */

        if(modo==='medir'){

            specialPanel.style.display='none';

            const ctx=
                capturaBase();

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase=
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            setStatus(
                '📏 Foto capturada.'
            );

            enviarFotoFinal(
                fotoBase,
                {
                    modo:'medir'
                }
            );

            return;
        }

    }catch(e){

        console.error(e);

        setStatus(
            '❌ ERROR AL TOMAR FOTO\n'+
            e.message
        );
    }
}

/* =========================================================
   MEDICION
========================================================= */

let referenceReal=null;

measureStart.addEventListener(
    'click',
    ()=>{

        const v=
            Number(
                knownMeasure.value
            );

        if(
            !Number.isFinite(v)||
            v<=0
        ){

            return alert(
                'Captura una medida real mayor que cero.'
            );
        }

        referenceReal=v;

        specialPanel.style.display='none';

        setStatus(
            'Medida guardada: '+
            v+
            ' m. Ahora toma la fotografía.'
        );

        takeButton.disabled=false;
    }
);

/* =========================================================
   ENVIO
========================================================= */

function enviarFotoFinal(
    dataURL,
    extra={}
){

    preview.src=dataURL;

    preview.style.display='block';

    const mensaje={

        type:'CAMERA_STAMP_PHOTO',

        tipo:String(tipo||'').trim(),

        fileName:crearNombreFoto(
            tipo,
            fechaFoto||new Date()
        ),

        mimeType:'image/jpeg',

        data:dataURL,

        latitud:
            gpsActual
                ? gpsActual.lat
                : null,

        longitud:
            gpsActual
                ? gpsActual.lng
                : null,

        modo,

        metadata:{

            proyecto,

            tipoProyecto,

            hub,

            rama,

            tipoFoto:nombreTipo(tipo),

            fecha:(
                fechaFoto||
                new Date()
            ).toISOString(),

            gps:gpsActual
        },

        ...extra
    };

    let confirmado=false;

    const cerrarTrasAck=e=>{

        if(
            !e||
            !e.data||
            e.data.type!=='CAMERA_STAMP_ACK'
        ){
            return;
        }

        if(
            e.data.fileName&&
            e.data.fileName!==mensaje.fileName
        ){
            return;
        }

        confirmado=true;

        window.removeEventListener(
            'message',
            cerrarTrasAck
        );

        setStatus(
            '✅ FOTO RECIBIDA POR EL FORMULARIO.'
        );

        detenerCamara();

        setTimeout(
            ()=>{
                try{

                    if(
                        window.opener&&
                        !window.opener.closed
                    ){
                        window.opener.focus();
                    }

                    window.close();

                }catch(_){}
            },
            150
        );
    };

    window.addEventListener(
        'message',
        cerrarTrasAck
    );

    if(
        window.opener&&
        !window.opener.closed
    ){

        window.opener.postMessage(
            mensaje,
            '*'
        );

        setStatus(
            '📤 Enviando fotografía al formulario…'
        );

    }else{

        window.removeEventListener(
            'message',
            cerrarTrasAck
        );

        setStatus(
            '❌ No se encontró el formulario que abrió la cámara.'
        );

        return;
    }

    setTimeout(
        ()=>{

            if(confirmado){
                return;
            }

            window.removeEventListener(
                'message',
                cerrarTrasAck
            );

            setStatus(
                '✅ FOTO ENVIADA AL FORMULARIO.'
            );

            detenerCamara();

            try{

                if(
                    window.opener&&
                    !window.opener.closed
                ){
                    window.opener.focus();
                }

                window.close();

            }catch(_){}
        },
        2500
    );
}

/* =========================================================
   DETENER
========================================================= */

function detenerCamara(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                t=>t.stop()
            );

        cameraStream=null;
    }

    video.srcObject=null;

    takeButton.disabled=true;

    if(motionHandler){

        window.removeEventListener(
            'devicemotion',
            motionHandler
        );

        motionHandler=null;
    }

    if(orientationHandler){

        window.removeEventListener(
            'deviceorientation',
            orientationHandler
        );

        orientationHandler=null;
    }
}

/* =========================================================
   SEÑALAR
========================================================= */

signalButton.addEventListener(
    'click',
    ()=>{

        modoSenalar=!modoSenalar;

        signalButton.textContent=
            modoSenalar
                ? '🎯 ACTIVO'
                : '🎯 SEÑALAR';

        setStatus(
            modoSenalar
                ? '🎯 SEÑALAR ACTIVADO.'
                : 'Señalar desactivado.'
        );
    }
);

/* =========================================================
   FOTO
========================================================= */

takeButton.addEventListener(
    'click',
    tomarFoto
);

/* =========================================================
   SALIR
========================================================= */

cancelButton.addEventListener(
    'click',
    ()=>{

        detenerCamara();

        if(
            window.opener&&
            !window.opener.closed
        ){
            window.close();
        }
    }
);

/* =========================================================
   RESIZE / ORIENTACION
========================================================= */

function actualizarInterfazOrientacion(){

    if(modo==='plomado'){

        /*
         * Esperamos un frame para que el navegador
         * termine de cambiar las dimensiones.
         */

        requestAnimationFrame(()=>{
            dibujarTransportador();
        });
    }
}

window.addEventListener(
    'resize',
    actualizarInterfazOrientacion
);

window.addEventListener(
    'orientationchange',
    ()=>{
        setTimeout(
            actualizarInterfazOrientacion,
            150
        );
    }
);

/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    'load',
    async()=>{

        modeBadge.textContent=
            modo==='medir'
                ? '📏 MEDIR POSTE'
                : modo==='plomado'
                    ? '📐 PLOMADO POSTE'
                    : '📷 '+nombreTipo(tipo);

        if(modo==='medir'){

            specialPanel.style.display='block';

            specialHelp.textContent=
                'Captura la medida real del objeto conocido.';
        }

        if(modo==='plomado'){

            plomadoOverlay.style.display='block';

            plomadoActivo=true;

            dibujarTransportador();
        }

        setStatus(
            'Abriendo cámara…'
        );

        await iniciarCamara();
    }
);

    <script>

        /* =========================================================

        function setStatus(text) {

        function nombreTipo(t) {

            if (t === 'poste') {

            }

            }

            return String(t).toUpperCase();

        function formatDate(d) {

            const p =
                n => String(n).padStart(2, '0');

            return (
                d.getFullYear() +
                p(d.getMonth() + 1) +
                p(d.getDate()) +
                '_' +
                p(d.getHours()) +
                p(d.getMinutes()) +
                p(d.getSeconds())
            );
        }

        function crearNombreFoto(t, d) {

            return (
                'STAMPED_' +
                nombreTipo(t).replace(/\s+/g, '_') +
                '_' +
                formatDate(d) +
                '.jpg'
            );
        }

        function clamp(v, a, b) {

            return Math.max(
                a,
                Math.min(b, v)
            );

        /* =========================================================
           LOGO
        ========================================================= */

        function cargarLogo() {

            logoListo = false;

            logoImagen = new Image();

            logoImagen.crossOrigin =
                'anonymous';

            logoImagen.onload = () => {
                logoListo = true;
            };

            logoImagen.onerror = () => {

                const im = new Image();

                im.crossOrigin =
                    'anonymous';

                im.onload = () => {

                    logoImagen = im;
                    logoListo = true;
                };

                im.src =
                    LOGO_URL_ALTERNATIVO;
            };

            logoImagen.src =
                LOGO_URL;
        }

        function dibujarLogo(ctx, w, h) {

            zonaLogo = null;

            if (
                !logoListo ||
                !logoImagen
            ) {
                return;
            }

            const maxW =
                w * .18;

            const maxH =
                h * .14;

            const s =
                Math.min(
                    maxW / logoImagen.width,
                    maxH / logoImagen.height
                );

            const lw =
                logoImagen.width * s;

            const lh =
                logoImagen.height * s;

            const m =
                Math.max(
                    20,
                    w * .025
                );

            const x =
                w - lw - m;

            const y =
                m;

            const b =
                Math.max(
                    15,
                    w * .012
                );

            zonaLogo = {
                x: x - b,
                y: y - b,
                width: lw + b * 2,
                height: lh + b * 2
            };

            ctx.save();

            ctx.fillStyle =
                'rgba(0,0,0,.2)';

            ctx.fillRect(
                x - 5,
                y - 5,
                lw + 10,
                lh + 10
            );

            ctx.drawImage(
                logoImagen,
                x,
                y,
                lw,
                lh
            );

            ctx.restore();
        }

        /* =========================================================
           ESTAMPADO
        ========================================================= */

        function dibujarEstampado(
            ctx,
            w,
            h,
            extra = []
        ) {

            const s =
                Math.max(w, h) / 1200;

            const pad =
                Math.round(16 * s);

            const font =
                Math.max(
                    16,
                    Math.round(20 * s)
                );

            const line =
                27 * s;

            const pos =
                gpsActual;

            const d =
                fechaFoto || new Date();

            const base = [
                `PROYECTO: ${proyecto || 'SIN PROYECTO'}`,
                `TIPO PROYECTO: ${tipoProyecto || 'SIN TIPO'}`,
                `HUB: ${hub || '-'}  RAMA: ${rama || '-'}`,
                `TIPO FOTO: ${nombreTipo(tipo)}`,
                `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
                pos
                    ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
                    : 'GPS: SIN UBICACIÓN',
                ...extra
            ];

            ctx.font =
                `bold ${font}px Arial`;

            let tw = 0;

            base.forEach(text => {

                tw = Math.max(
                    tw,
                    ctx.measureText(text).width
                );
            });

            const bw =
                tw + pad * 2;

            const bh =
                base.length * line +
                pad * 2;

            const x =
                pad;

            const y =
                h - bh - pad;

            zonaEstampado = {
                x: x - 18,
                y: y - 18,
                width: bw + 36,
                height: bh + 36
            };

            ctx.fillStyle =
                'rgba(0,0,0,.48)';

            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                bw,
                bh,
                10 * s
            );

            ctx.fill();

            ctx.fillStyle =
                'rgba(255,255,255,.96)';

            ctx.textBaseline =
                'top';

            base.forEach((text, i) => {

                ctx.fillText(
                    text,
                    x + pad,
                    y + pad + i * line
                );
            });

            dibujarLogo(
                ctx,
                w,
                h
            );
        }

        /* =========================================================
           SENSORES
        ========================================================= */

        async function iniciarSensores() {

            try {

                if (
                    typeof DeviceMotionEvent !==
                    'undefined' &&
                    typeof DeviceMotionEvent
                        .requestPermission ===
                    'function'
                ) {

                    const p =
                        await DeviceMotionEvent
                            .requestPermission();

                    if (p !== 'granted') {

                        throw new Error(
                            'Permiso de movimiento no concedido'
                        );
                    }
                }

                motionHandler = e => {

                    const a =
                        e.accelerationIncludingGravity ||
                        e.acceleration ||
                        {};

                    if (
                        Number.isFinite(a.x) &&
                        Number.isFinite(a.y)
                    ) {

                        gravity = {
                            x: a.x,
                            y: a.y,
                            z: a.z || 0
                        };

                        gravityReady = true;

                        actualizarGuia();
                    }
                };

                window.addEventListener(
                    'devicemotion',
                    motionHandler,
                    {
                        passive: true
                    }
                );

                if (
                    typeof DeviceOrientationEvent !==
                    'undefined' &&
                    typeof DeviceOrientationEvent
                        .requestPermission ===
                    'function'
                ) {

                    const p =
                        await DeviceOrientationEvent
                            .requestPermission();

                    if (p !== 'granted') {

                        throw new Error(
                            'Permiso de orientación no concedido'
                        );
                    }
                }

                orientationHandler = e => {

                    if (
                        Number.isFinite(e.alpha)
                    ) {

                        orientationAngle =
                            screen.orientation &&
                            Number.isFinite(
                                screen.orientation.angle
                            )
                                ? screen.orientation.angle
                                : 0;

                        actualizarGuia();
                    }
                };

                window.addEventListener(
                    'deviceorientation',
                    orientationHandler,
                    {
                        passive: true
                    }
                );

                sensorHud.textContent =
                    'Sensores: ACTIVOS';

            } catch (e) {

                sensorHud.textContent =
                    'Sensores: no disponibles';

                console.warn(e);
            }
        }

        function screenGravity() {

            let x = gravity.x;
            let y = gravity.y;

            const a =
                (
                    (
                        screen.orientation &&
                        screen.orientation.angle
                    ) || 0
                ) % 360;

            if (a === 90) {

                const q = x;

                x = y;
                y = -q;

            } else if (a === 180) {

                x = -x;
                y = -y;

            } else if (a === 270) {

                const q = x;

                x = -y;
                y = q;
            }

            return {
                x,
                y
            };
        }

        function actualizarGuia() {

            if (modo !== 'plomado') {
                return;
            }

            const g =
                screenGravity();

            const ang =
                Math.atan2(
                    g.x,
                    -g.y
                ) *
                180 /
                Math.PI;

            verticalGuide.style.display =
                'block';

            verticalGuide.style.transform =
                `translateX(-50%) rotate(${ang}deg)`;

            sensorHud.textContent =
                gravityReady
                    ? `Sensores: ACTIVOS | vertical ${ang.toFixed(1)}°`
                    : 'Sensores: esperando…';
        }

        /* =========================================================
           CÁMARA
        ========================================================= */

        async function iniciarCamara() {

            try {

                if (cameraStream) {
                    detenerCamara();
                }

                setStatus(
                    'Solicitando permiso de cámara…'
                );

                cameraStream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            video: {
                                facingMode: {
                                    ideal: 'environment'
                                },
                                width: {
                                    ideal: 1920
                                },
                                height: {
                                    ideal: 1080
                                }
                            },
                            audio: false
                        });

                video.srcObject =
                    cameraStream;

                await video.play();

                takeButton.disabled =
                    false;

                cargarLogo();

                await iniciarSensores();

                configurarModo();

                setStatus(
                    modo === 'medir'
                        ? '📏 MEDIR POSTE: captura la foto y después marca 2 puntos de referencia y 2 puntos del poste.'
                        : modo === 'plomado'
                            ? '📐 PLOMADO: captura la foto y después marca BASE y PARTE SUPERIOR del poste.'
                            : '✅ Cámara lista. Puedes tomar la fotografía o activar SEÑALAR.'
                );

            } catch (e) {

                console.error(e);

                setStatus(
                    '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n' +
                    (e.name || '') +
                    '\n' +
                    (e.message || e)
                );

                    true;
            }

        function configurarModo() {

            }

                verticalGuide.style.display =
                    'block';
            }

        /* =========================================================
           GPS
        ========================================================= */

        function obtenerGPS() {

            return new Promise(resolve => {

                if (!navigator.geolocation) {
                    return resolve(null);
                }

                navigator.geolocation.getCurrentPosition(
                    p => resolve({
                        lat: p.coords.latitude,
                        lng: p.coords.longitude,
                        accuracy: p.coords.accuracy
                    }),
                    () => resolve(null),
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        /* =========================================================
           CAPTURA BASE
        ========================================================= */

        function capturaBase() {

            const w =
                video.videoWidth;

            const h =
                video.videoHeight;

            if (!w || !h) {

                throw new Error(
                    'La cámara todavía no está lista.'
                );
            }

            canvas.width = w;
            canvas.height = h;

            const ctx =
                canvas.getContext('2d');

            ctx.drawImage(
                video,
                0,
                0,
                w,
                h
            );

            return ctx;
        }

                if (!cameraStream) {

                    throw new Error(
                        'La cámara no está iniciada.'
                    );
                }

                gpsActual =
                    await obtenerGPS();

                    new Date();

                    capturaBase();

                    ctx,
                    canvas.width,
                    canvas.height
                );

                    canvas.toDataURL(

                        .92
                    );

                if (

                ) {

                    return;
                }

                    specialPanel.style.display =
                        'none';

                    abrirEditorPuntos(

                    );

                    return;
                }

                if (modo === 'plomado') {

                    abrirEditorPuntos(
                        'plomado'
                    );

                    return;
                }

                enviarFotoFinal(
                    fotoBase,
                    {
                        modo: 'normal'
                    }
                );

            } catch (e) {

                console.error(e);

                setStatus(
                    '❌ ERROR AL TOMAR FOTO\n' +
                    e.message
                );
            }
        }

        /* =========================================================
           EDITOR DE FLECHA
           
           CORRECCIÓN:
           El canvas conserva exactamente la proporción
           de la fotografía capturada.
        ========================================================= */

        function abrirEditorFlecha() {

            crearEditorFlechaDOM();

            const im =
                new Image();

            im.onload = () => {

                /*
                 * IMPORTANTE:
                 * El canvas interno tiene exactamente
                 * la resolución original de la fotografía.
                 */

                arrowCanvas.width =
                    im.naturalWidth;

                arrowCanvas.height =
                    im.naturalHeight;

                /*
                 * El canvas se muestra dentro de la pantalla
                 * manteniendo su relación de aspecto.
                 */

                ajustarCanvasFlecha();

                arrowEditor.style.display =
                    'block';

                dibujarFlecha();

                iniciarGestosFlecha();
            };

            im.src =
                fotoBase;
        }

        let arrowEditor = null;
        let arrowCanvas = null;

        function crearEditorFlechaDOM() {

            if (arrowEditor) {
                return;
            }

            arrowEditor =
                document.createElement('div');

            arrowEditor.id =
                'arrowEditor';

            arrowEditor.style.cssText =
                [
                    'position:absolute',
                    'inset:0',
                    'z-index:25',
                    'background:#000',
                    'touch-action:none',
                    'overflow:hidden',
                    'overscroll-behavior:none',
                    'user-select:none',
                    '-webkit-user-select:none',
                    '-webkit-touch-callout:none'
                ].join(';');

            arrowCanvas =
                document.createElement('canvas');

            arrowCanvas.id =
                'arrowCanvas';

            arrowCanvas.style.cssText =
                [
                    'display:block',
                    'position:absolute',
                    'touch-action:none',
                    'user-select:none',
                    '-webkit-user-select:none',
                    '-webkit-touch-callout:none',
                    'margin:0',
                    'padding:0'
                ].join(';');

            arrowEditor.appendChild(
                arrowCanvas
            );

            document
                .getElementById('cameraContainer')
                .appendChild(
                    arrowEditor
                );

            /*
             * Evita que iOS interprete los gestos
             * como zoom del navegador.
             */

            [
                'gesturestart',
                'gesturechange',
                'gestureend'
            ].forEach(eventName => {

                arrowEditor.addEventListener(
                    eventName,
                    e => e.preventDefault(),
                    {
                        passive: false
                    }
                );
            });

            signalButton.style.display =
                'none';

            takeButton.style.display =
                'none';

            confirmButton.style.display =
                'inline-block';

            cancelSignalButton.style.display =
                'inline-block';

            cancelButton.style.display =
                'none';

            setStatus(
                '🎯 TOCA LA FOTO PARA colocar la flecha. Un dedo mueve; dos dedos giran/cambian tamaño.'
            );

            flechaX = null;
            flechaY = null;
            flechaAngulo = 0;
            flechaEscala = 1;
        }

        /*
         * Ajusta el canvas a la pantalla SIN deformar
         * ni recortar la fotografía.
         */
        function ajustarCanvasFlecha() {

            if (
                !arrowCanvas ||
                !arrowCanvas.width ||
                !arrowCanvas.height
            ) {
                return;
            }

            const container =
                document.getElementById(
                    'cameraContainer'
                );

            const cw =
                container.clientWidth;

            const ch =
                container.clientHeight;

            const iw =
                arrowCanvas.width;

            const ih =
                arrowCanvas.height;

            /*
             * contain:
             * muestra la fotografía completa.
             */

            const escala =
                Math.min(
                    cw / iw,
                    ch / ih
                );

            const displayW =
                iw * escala;

            const displayH =
                ih * escala;

            arrowCanvas.style.width =
                `${displayW}px`;

            arrowCanvas.style.height =
                `${displayH}px`;

            arrowCanvas.style.left =
                `${(cw - displayW) / 2}px`;

            arrowCanvas.style.top =
                `${(ch - displayH) / 2}px`;
        }

        function puntoArrow(e) {

            const r =
                arrowCanvas.getBoundingClientRect();

            const p =
                e.touches
                    ? e.touches[0]
                    : e;

            return {

                x:
                    (p.clientX - r.left) *
                    arrowCanvas.width /
                    r.width,

                y:
                    (p.clientY - r.top) *
                    arrowCanvas.height /
                    r.height
            };
        }

        function arrowBlocked(
            x,
            y,
            ang,
            scale
        ) {

            const f =
                Math.max(
                    arrowCanvas.width,
                    arrowCanvas.height
                ) / 1200;

            const len =
                150 *
                f *
                scale;

            const sx =
                x -
                len *
                Math.cos(
                    ang +
                    Math.PI / 4
                );

            const sy =
                y -
                len *
                Math.sin(
                    ang +
                    Math.PI / 4
                );

            for (
                let i = 0;
                i <= 18;
                i++
            ) {

                const t =
                    i / 18;

                const px =
                    sx +
                    (x - sx) *
                    t;

                const py =
                    sy +
                    (y - sy) *
                    t;

                if (
                    puntoRect(
                        px,
                        py,
                        zonaLogo
                    ) ||
                    puntoRect(
                        px,
                        py,
                        zonaEstampado
                    )
                ) {
                    return true;
                }
            }

            return false;
        }

        function puntoRect(
            x,
            y,
            r
        ) {

            return (
                r &&
                x >= r.x &&
                x <= r.x + r.width &&
                y >= r.y &&
                y <= r.y + r.height
            );
        }

        function dibujarFlecha() {

            if (!arrowCanvas) {
                return;
            }

            const im =
                new Image();

            im.onload = () => {

                const c =
                    arrowCanvas.getContext(
                        '2d'
                    );

                c.clearRect(
                    0,
                    0,
                    arrowCanvas.width,
                    arrowCanvas.height
                );

                c.drawImage(
                    im,
                    0,
                    0,
                    arrowCanvas.width,
                    arrowCanvas.height
                );

                if (flechaX == null) {
                    return;
                }

                const f =
                    Math.max(
                        arrowCanvas.width,
                        arrowCanvas.height
                    ) / 1200;

                const len =
                    150 *
                    f *
                    flechaEscala;

                const tip =
                    32 *
                    f *
                    flechaEscala;

                const sx =
                    flechaX -
                    len *
                    Math.cos(
                        flechaAngulo +
                        Math.PI / 4
                    );

                const sy =
                    flechaY -
                    len *
                    Math.sin(
                        flechaAngulo +
                        Math.PI / 4
                    );

                /* Línea negra */

                c.beginPath();

                c.moveTo(
                    sx,
                    sy
                );

                c.lineTo(
                    flechaX,
                    flechaY
                );

                c.strokeStyle =
                    '#000';

                c.lineWidth =
                    Math.max(
                        12,
                        13 *
                        f *
                        flechaEscala
                    );

                c.lineCap =
                    'round';

                c.stroke();

                /* Línea verde */

                c.beginPath();

                c.moveTo(
                    sx,
                    sy
                );

                c.lineTo(
                    flechaX,
                    flechaY
                );

                c.strokeStyle =
                    '#00ff00';

                c.lineWidth =
                    Math.max(
                        7,
                        9 *
                        f *
                        flechaEscala
                    );

                c.stroke();

                /* Punta */

                const a =
                    Math.atan2(
                        flechaY - sy,
                        flechaX - sx
                    );

                c.beginPath();

                c.moveTo(
                    flechaX,
                    flechaY
                );

                c.lineTo(
                    flechaX -
                    tip *
                    Math.cos(
                        a - Math.PI / 6
                    ),
                    flechaY -
                    tip *
                    Math.sin(
                        a - Math.PI / 6
                    )
                );

                c.lineTo(
                    flechaX -
                    tip *
                    Math.cos(
                        a + Math.PI / 6
                    ),
                    flechaY -
                    tip *
                    Math.sin(
                        a + Math.PI / 6
                    )
                );

                c.closePath();

                c.fillStyle =
                    '#00ff00';

                c.fill();

                c.strokeStyle =
                    '#000';

                c.lineWidth =
                    Math.max(
                        3,
                        4 *
                        f *
                        flechaEscala
                    );

                c.stroke();
            };

            im.src =
                fotoBase;
        }

        /* =========================================================
           GESTOS DE FLECHA
        ========================================================= */

        function iniciarGestosFlecha() {

            if (
                !arrowCanvas ||
                arrowCanvas.dataset.ready
            ) {
                return;
            }

            arrowCanvas.dataset.ready =
                '1';

            arrowCanvas.addEventListener(
                'touchstart',
                e => {

                    e.preventDefault();

                    ultimoToque =
                        Date.now();

                    if (
                        e.touches.length === 1
                    ) {

                        const p =
                            puntoArrow(e);

                        if (
                            flechaX == null
                        ) {

                            if (
                                arrowBlocked(
                                    p.x,
                                    p.y,
                                    0,
                                    1
                                )
                            ) {

                                return alert(
                                    '🚫 La flecha no puede cubrir el logo ni el estampado.'
                                );
                            }

                            flechaX =
                                p.x;

                            flechaY =
                                p.y;

                            dibujarFlecha();
                        }

                        gestoActivo =
                            true;

                        toqueInicial = {
                            tipo: 'move',
                            x: p.x,
                            y: p.y,
                            x0: flechaX,
                            y0: flechaY
                        };

                    } else if (
                        e.touches.length === 2 &&
                        flechaX != null
                    ) {

                        const a =
                            puntoArrow(
                                e.touches[0]
                            );

                        const b =
                            puntoArrow(
                                e.touches[1]
                            );

                        toqueInicial = {

                            tipo: 'transform',

                            cx:
                                (a.x + b.x) / 2,

                            cy:
                                (a.y + b.y) / 2,

                            dist:
                                Math.hypot(
                                    b.x - a.x,
                                    b.y - a.y
                                ),

                            ang:
                                Math.atan2(
                                    b.y - a.y,
                                    b.x - a.x
                                ),

                            x0:
                                flechaX,

                            y0:
                                flechaY,

                            s:
                                flechaEscala,

                            r:
                                flechaAngulo
                        };

                        gestoActivo =
                            true;
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'touchmove',
                e => {

                    e.preventDefault();

                    if (!gestoActivo) {
                        return;
                    }

                    if (
                        e.touches.length === 1 &&
                        toqueInicial?.tipo === 'move'
                    ) {

                        const p =
                            puntoArrow(e);

                        const nx =
                            toqueInicial.x0 +
                            p.x -
                            toqueInicial.x;

                        const ny =
                            toqueInicial.y0 +
                            p.y -
                            toqueInicial.y;

                        if (
                            !arrowBlocked(
                                nx,
                                ny,
                                flechaAngulo,
                                flechaEscala
                            )
                        ) {

                            flechaX =
                                nx;

                            flechaY =
                                ny;

                            dibujarFlecha();
                        }

                    } else if (
                        e.touches.length === 2 &&
                        toqueInicial?.tipo === 'transform'
                    ) {

                        const a =
                            puntoArrow(
                                e.touches[0]
                            );

                        const b =
                            puntoArrow(
                                e.touches[1]
                            );

                        const dist =
                            Math.hypot(
                                b.x - a.x,
                                b.y - a.y
                            );

                        const ang =
                            Math.atan2(
                                b.y - a.y,
                                b.x - a.x
                            );

                        const s =
                            clamp(
                                toqueInicial.s *
                                dist /
                                toqueInicial.dist,
                                .35,
                                3
                            );

                        const r =
                            toqueInicial.r +
                            ang -
                            toqueInicial.ang;

                        if (
                            !arrowBlocked(
                                toqueInicial.x0,
                                toqueInicial.y0,
                                r,
                                s
                            )
                        ) {

                            flechaEscala =
                                s;

                            flechaAngulo =
                                r;

                            dibujarFlecha();
                        }
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'touchend',
                e => {

                    if (
                        !e.touches.length
                    ) {

                        gestoActivo =
                            false;

                        toqueInicial =
                            null;
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'click',
                e => {

                    if (
                        Date.now() -
                        ultimoToque <
                        500
                    ) {
                        return;
                    }

                    const p =
                        puntoArrow(e);

                    if (
                        flechaX == null &&
                        !arrowBlocked(
                            p.x,
                            p.y,
                            0,
                            1
                        )
                    ) {

                        flechaX =
                            p.x;

                        flechaY =
                            p.y;

                        dibujarFlecha();
                    }
                }
            );
        }

        /* =========================================================
           CERRAR EDITOR DE FLECHA
        ========================================================= */

        function cerrarEditorFlecha() {

            if (arrowEditor) {

                arrowEditor.remove();

                arrowEditor =
                    null;

                arrowCanvas =
                    null;
            }

            confirmButton.style.display =
                'none';

            cancelSignalButton.style.display =
                'none';

            takeButton.style.display =
                'inline-block';

            cancelButton.style.display =
                'inline-block';

            signalButton.style.display =
                'inline-block';
        }

        /* =========================================================
           EDITOR DE PUNTOS
        ========================================================= */

        let moverPuntosActivo = false;
        let puntoSeleccionado = -1;
        let puntoArrastrando = false;

        function abrirEditorPuntos(m) {

            pointEditor.style.display =
                'block';

            pointCanvas.width =
                video.videoWidth;

            pointCanvas.height =
                video.videoHeight;

            const c =
                pointCanvas.getContext(
                    '2d'
                );

            const im =
                new Image();

            im.onload = () => {

                c.drawImage(
                    im,
                    0,
                    0
                );

                pointImage =
                    im;
            };

            im.src =
                fotoBase;

            points = [];

            specialStage =
                m === 'medir'
                    ? 'reference'
                    : 'post';

            moverPuntosActivo =
                false;

            puntoSeleccionado =
                -1;

            puntoArrastrando =
                false;

            pointMove.textContent =
                '🔧 MOVER PUNTOS';

            if (m === 'medir') {

                setStatus(
                    '📏 Marca R1 y R2 en la referencia. Después BASE y PUNTA del POSTE. Puedes activar MOVER PUNTOS para corregirlos.'
                );

            } else {

                setStatus(
                    '📐 Marca BASE y después PARTE SUPERIOR del poste. Puedes activar MOVER PUNTOS para corregirlos.'
                );
            }
        }

        function puntoDesdeEvento(e) {

            const r =
                pointCanvas.getBoundingClientRect();

            const t =
                e.touches &&
                e.touches.length
                    ? e.touches[0]
                    : e;

            return {

                x:
                    (t.clientX - r.left) *
                    pointCanvas.width /
                    r.width,

                y:
                    (t.clientY - r.top) *
                    pointCanvas.height /
                    r.height
            };
        }

        function indicePuntoCercano(p) {

            let mejor = -1;
            let dist = Infinity;

            points.forEach((q, i) => {

                const d =
                    Math.hypot(
                        q.x - p.x,
                        q.y - p.y
                    );

                if (d < dist) {

                    dist = d;
                    mejor = i;
                }
            });

            return dist <=
                Math.max(
                    28,
                    pointCanvas.width / 45
                )
                ? mejor
                : -1;
        }

        function agregarPunto(p) {

            if (moverPuntosActivo) {
                return false;
            }

            if (
                points.length >= 4 &&
                modo === 'medir'
            ) {
                return false;
            }

            if (
                points.length >= 2 &&
                modo === 'plomado'
            ) {
                return false;
            }

            points.push(p);

            dibujarPuntos();

            return true;
        }

        pointCanvas.addEventListener(
            'click',
            e => {

                if (
                    !pointEditor.style.display ||
                    pointEditor.style.display ===
                    'none'
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                if (moverPuntosActivo) {
                    return;
                }

                agregarPunto(p);
            }
        );

        pointCanvas.addEventListener(
            'pointerdown',
            e => {

                if (
                    !moverPuntosActivo ||
                    !points.length
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                const i =
                    indicePuntoCercano(p);

                if (i < 0) {
                    return;
                }

                puntoSeleccionado =
                    i;

                puntoArrastrando =
                    true;

                pointCanvas
                    .setPointerCapture?.(
                        e.pointerId
                    );

                e.preventDefault();
            }
        );

        pointCanvas.addEventListener(
            'pointermove',
            e => {

                if (
                    !moverPuntosActivo ||
                    !puntoArrastrando ||
                    puntoSeleccionado < 0
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                points[puntoSeleccionado] = {

                    x: Math.max(
                        0,
                        Math.min(
                            pointCanvas.width,
                            p.x
                        )
                    ),

                    y: Math.max(
                        0,
                        Math.min(
                            pointCanvas.height,
                            p.y
                        )
                    )
                };

                dibujarPuntos();

                e.preventDefault();
            }
        );

        pointCanvas.addEventListener(
            'pointerup',
            e => {

                puntoArrastrando =
                    false;

                puntoSeleccionado =
                    -1;

                try {

                    pointCanvas
                        .releasePointerCapture?.(
                            e.pointerId
                        );

                } catch (_) {}
            }
        );

        /* =========================================================
           DIBUJAR PUNTOS
        ========================================================= */

        function dibujarPuntos() {

            if (!pointImage) {
                return;
            }

            const c =
                pointCanvas.getContext(
                    '2d'
                );

            c.drawImage(
                pointImage,
                0,
                0
            );

            c.lineWidth =
                Math.max(
                    5,
                    pointCanvas.width / 400
                );

            c.strokeStyle =
                '#00ff00';

            c.fillStyle =
                '#00ff00';

            const labels =
                modo === 'medir'
                    ? [
                        'R1',
                        'R2',
                        'BASE',
                        'PUNTA'
                    ]
                    : [
                        'BASE',
                        'PUNTA'
                    ];

            points.forEach((p, i) => {

                c.beginPath();

                c.arc(
                    p.x,
                    p.y,
                    10,
                    0,
                    Math.PI * 2
                );

                c.fill();

                c.fillStyle =
                    '#fff';

                c.font =
                    'bold 24px Arial';

                c.fillText(
                    labels[i] ||
                    String(i + 1),
                    p.x + 14,
                    p.y - 14
                );

                c.fillStyle =
                    '#00ff00';
            });

            const pairs =
                modo === 'medir'
                    ? [
                        [0, 1],
                        [2, 3]
                    ]
                    : [
                        [0, 1]
                    ];

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });
        }

        pointMove.addEventListener(
            'click',
            () => {

                moverPuntosActivo =
                    !moverPuntosActivo;

                pointMove.textContent =
                    moverPuntosActivo
                        ? '🖐️ MODO MOVER ACTIVO'
                        : '🔧 MOVER PUNTOS';

                setStatus(
                    moverPuntosActivo
                        ? '🖐️ MODO MOVER: arrastra BASE, PUNTA, R1 o R2 para corregir su posición.'
                        : '📍 MODO COLOCAR: toca la imagen para agregar el siguiente punto.'
                );
            }
        );

        pointUndo.addEventListener(
            'click',
            () => {

                if (!points.length) {
                    return;
                }

                points.pop();

                dibujarPuntos();

                setStatus(
                    '↩️ Se quitó el último punto. Puedes colocarlo nuevamente.'
                );
            }
        );

        /* =========================================================
           CÁLCULOS
        ========================================================= */

        function distancia(a, b) {

            return Math.hypot(
                b.x - a.x,
                b.y - a.y
            );
        }

        function anguloLinea(a, b) {

            return (
                Math.atan2(
                    b.y - a.y,
                    b.x - a.x
                ) *
                180 /
                Math.PI
            );
        }

        function verticalDeviation(a, b) {

            const g =
                screenGravity();

            const ga =
                Math.atan2(
                    g.x,
                    -g.y
                ) *
                180 /
                Math.PI;

            const pa =
                anguloLinea(a, b);

            const d =
                ((pa - ga + 90) % 180) - 90;

            return {

                degrees:
                    Math.abs(d),

                signed:
                    d,

                verticalAngle:
                    ga,

                postAngle:
                    pa
            };
        }

        /* =========================================================
           CONFIRMAR PUNTOS
        ========================================================= */

        function confirmarPuntos() {

            if (modo === 'medir') {

                if (
                    points.length !== 4
                ) {

                    return alert(
                        'Debes marcar exactamente 4 puntos: R1, R2, BASE y PUNTA.'
                    );
                }

                const refPx =
                    distancia(
                        points[0],
                        points[1]
                    );

                const postPx =
                    distancia(
                        points[2],
                        points[3]
                    );

                if (refPx < 2) {

                    return alert(
                        'La línea de referencia es demasiado corta.'
                    );
                }

                const h =
                    referenceReal *
                    postPx /
                    refPx;

                specialResult = {

                    referenceReal,

                    referencePixels:
                        refPx,

                    postPixels:
                        postPx,

                    height:
                        h
                };

                finalizarEspecial(
                    [
                        `REF: ${referenceReal.toFixed(3)} m`,
                        `ALTURA POSTE: ${h.toFixed(3)} m`
                    ],
                    {
                        medicion:
                            specialResult
                    }
                );

            } else {

                if (
                    points.length !== 2
                ) {

                    return alert(
                        'Debes marcar BASE y PARTE SUPERIOR del poste.'
                    );
                }

                const r =
                    verticalDeviation(
                        points[0],
                        points[1]
                    );

                specialResult =
                    r;

                finalizarEspecial(
                    [
                        `PLOMADO: ${r.degrees.toFixed(2)}°`,
                        `VERTICAL SENSOR: ${r.verticalAngle.toFixed(2)}°`,
                        `POSTE: ${r.postAngle.toFixed(2)}°`
                    ],
                    {
                        plomado:
                            r
                    }
                );
            }
        }

        /* =========================================================
           ANOTACIONES FINALES
        ========================================================= */

        function dibujarAnotacionesFinales(
            c,
            w,
            h
        ) {

            const labels =
                modo === 'medir'
                    ? [
                        'R1',
                        'R2',
                        'BASE',
                        'PUNTA'
                    ]
                    : [
                        'BASE',
                        'PUNTA'
                    ];

            const pairs =
                modo === 'medir'
                    ? [
                        [0, 1],
                        [2, 3]
                    ]
                    : [
                        [0, 1]
                    ];

            const lineW =
                Math.max(
                    8,
                    w / 300
                );

            const radius =
                Math.max(
                    16,
                    w / 70
                );

            const fs =
                Math.max(
                    28,
                    w / 48
                );

            const off =
                Math.max(
                    22,
                    w / 65
                );

            c.save();

            c.lineCap =
                'round';

            c.lineJoin =
                'round';

            c.strokeStyle =
                '#000';

            c.lineWidth =
                lineW +
                Math.max(
                    8,
                    w / 500
                );

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });

            c.strokeStyle =
                '#00ff00';

            c.lineWidth =
                lineW;

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });

            c.font =
                `bold ${fs}px Arial`;

            c.textBaseline =
                'middle';

            points.forEach((p, i) => {

                c.beginPath();

                c.fillStyle =
                    '#000';

                c.arc(
                    p.x,
                    p.y,
                    radius +
                    Math.max(
                        4,
                        w / 500
                    ),
                    0,
                    Math.PI * 2
                );

                c.fill();

                c.beginPath();

                c.fillStyle =
                    '#00ff00';

                c.arc(
                    p.x,
                    p.y,
                    radius,
                    0,
                    Math.PI * 2
                );

                c.fill();

                const label =
                    labels[i] ||
                    String(i + 1);

                const tx =
                    p.x + off;

                const ty =
                    p.y - off;

                c.font =
                    `bold ${fs}px Arial`;

                const box =
                    c.measureText(
                        label
                    );

                c.fillStyle =
                    'rgba(0,0,0,.82)';

                c.fillRect(
                    tx - 8,
                    ty - fs * .58,
                    box.width + 16,
                    fs * 1.16
                );

                c.fillStyle =
                    '#fff';

                c.fillText(
                    label,
                    tx,
                    ty
                );
            });

            c.restore();
        }

        /* =========================================================
           FINALIZAR ESPECIAL
        ========================================================= */

        function finalizarEspecial(
            extra,
            meta
        ) {

            pointEditor.style.display =
                'none';

            canvas.width =
                pointCanvas.width;

            canvas.height =
                pointCanvas.height;

            const c =
                canvas.getContext(
                    '2d'
                );

            c.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            c.drawImage(
                pointImage,
                0,
                0,
                canvas.width,
                canvas.height
            );

            dibujarAnotacionesFinales(
                c,
                canvas.width,
                canvas.height
            );

            dibujarEstampado(
                c,
                canvas.width,
                canvas.height,
                extra
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            enviarFotoFinal(
                fotoBase,
                meta
            );
        }

        /* =========================================================
           MEDIDA REAL
        ========================================================= */

        measureStart.addEventListener(
            'click',
            () => {

                const v =
                    Number(
                        knownMeasure.value
                    );

                if (
                    !Number.isFinite(v) ||
                    v <= 0
                ) {

                    return alert(
                        'Captura una medida real mayor que cero.'
                    );
                }

                referenceReal =
                    v;

                specialPanel.style.display =
                    'none';

                setStatus(
                    'Medida guardada: ' +
                    v +
                    ' m. Ahora toma la fotografía.'
                );

                takeButton.disabled =
                    false;
            }
        );

        /* =========================================================
           ENVÍO DE FOTO
        ========================================================= */

        function enviarFotoFinal(
            dataURL,
            extra = {}
        ) {

            preview.src =
                dataURL;

            preview.style.display =
                'block';

            const mensaje = {

                type:
                    'CAMERA_STAMP_PHOTO',

                tipo:
                    String(tipo || '')
                        .trim(),

                fileName:
                    crearNombreFoto(
                        tipo,
                        fechaFoto ||
                        new Date()
                    ),

                mimeType:
                    'image/jpeg',

                data:
                    dataURL,

                latitud:
                    gpsActual
                        ? gpsActual.lat
                        : null,

                longitud:
                    gpsActual
                        ? gpsActual.lng
                        : null,

                modo,

                metadata: {

                    proyecto,

                    tipoProyecto,

                    hub,

                    rama,

                    tipoFoto:
                        nombreTipo(tipo),

                    fecha:
                        (
                            fechaFoto ||
                            new Date()
                        ).toISOString(),

                    gps:
                        gpsActual
                },

                ...extra
            };

            let confirmado =
                false;

            const cerrarTrasAck =
                e => {

                    if (
                        !e ||
                        !e.data ||
                        e.data.type !==
                        'CAMERA_STAMP_ACK'
                    ) {
                        return;
                    }

                    if (
                        e.data.fileName &&
                        e.data.fileName !==
                        mensaje.fileName
                    ) {
                        return;
                    }

                    confirmado =
                        true;

                    window.removeEventListener(
                        'message',
                        cerrarTrasAck
                    );

                    setStatus(
                        '✅ FOTO RECIBIDA POR EL FORMULARIO.'
                    );

                    detenerCamara();

                    setTimeout(
                        () => {

                            try {

                                if (
                                    window.opener &&
                                    !window.opener.closed
                                ) {

                                    window.opener.focus();
                                }

                                window.close();

                            } catch (_) {}

                        },
                        150
                    );
                };

            window.addEventListener(
                'message',
                cerrarTrasAck
            );

            if (
                window.opener &&
                !window.opener.closed
            ) {

                window.opener.postMessage(
                    mensaje,
                    '*'
                );

                setStatus(
                    '📤 Enviando fotografía al formulario…'
                );

            } else {

                window.removeEventListener(
                    'message',
                    cerrarTrasAck
                );

                setStatus(
                    '❌ No se encontró el formulario que abrió la cámara.'
                );

                return;
            }

            setTimeout(
                () => {

                    if (confirmado) {
                        return;
                    }

                    window.removeEventListener(
                        'message',
                        cerrarTrasAck
                    );

                    setStatus(
                        '✅ FOTO ENVIADA AL FORMULARIO.'
                    );

                    detenerCamara();

                    try {

                        if (
                            window.opener &&
                            !window.opener.closed
                        ) {

                            window.opener.focus();
                        }

                        window.close();

                    } catch (_) {}

                },
                2500
            );
        }

        /* =========================================================
           DETENER CÁMARA
        ========================================================= */

        function detenerCamara() {

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(
                        t => t.stop()
                    );

                cameraStream =
                    null;
            }

            video.srcObject =
                null;

            takeButton.disabled =
                true;

            if (motionHandler) {

                window.removeEventListener(
                    'devicemotion',
                    motionHandler
                );
            }

            if (orientationHandler) {

                window.removeEventListener(
                    'deviceorientation',
                    orientationHandler
                );
            }
        }

        /* =========================================================
           SEÑALAR
        ========================================================= */

        signalButton.addEventListener(
            'click',
            () => {

                modoSenalar =
                    !modoSenalar;

                signalButton.classList.toggle(
                    'active',
                    modoSenalar
                );

                signalButton.textContent =
                    modoSenalar
                        ? '🎯 ACTIVO'
                        : '🎯 SEÑALAR';

                setStatus(
                    modoSenalar
                        ? '🎯 SEÑALAR ACTIVADO. Toma la fotografía.'
                        : 'Señalar desactivado.'
                );
            }
        );

        /* =========================================================
           FOTO
        ========================================================= */

        takeButton.addEventListener(
            'click',
            tomarFoto
        );

        /* =========================================================
           SALIR
        ========================================================= */

        cancelButton.addEventListener(
            'click',
            () => {

                detenerCamara();

                if (
                    window.opener &&
                    !window.opener.closed
                ) {

                    window.close();
                }
            }
        );

        /* =========================================================
           CONFIRMAR FLECHA
        ========================================================= */

        confirmButton.addEventListener(
            'click',
            () => {

                if (flechaX == null) {

                    return alert(
                        'Primero toca la imagen para colocar la flecha.'
                    );
                }

                if (
                    arrowBlocked(
                        flechaX,
                        flechaY,
                        flechaAngulo,
                        flechaEscala
                    )
                ) {

                    return alert(
                        'La flecha invade el logo o estampado.'
                    );
                }

                const data =
                    arrowCanvas.toDataURL(
                        'image/jpeg',
                        .92
                    );

                cerrarEditorFlecha();

                enviarFotoFinal(
                    data,
                    {

                        modo:
                            'normal',

                        metadata: {

                            flecha: {

                                x:
                                    flechaX,

                                y:
                                    flechaY,

                                angulo:
                                    flechaAngulo,

                                escala:
                                    flechaEscala
                            }
                        }
                    }
                );
            }
        );

        /* =========================================================
           CANCELAR FLECHA
        ========================================================= */

        cancelSignalButton.addEventListener(
            'click',
            () => {

                cerrarEditorFlecha();

                fotoBase =
                    null;

                setStatus(
                    'Se canceló el señalamiento. Puedes tomar otra fotografía.'
                );
            }
        );

        /* =========================================================
           PUNTOS
        ========================================================= */

        pointConfirm.addEventListener(
            'click',
            confirmarPuntos
        );

        pointCancel.addEventListener(
            'click',
            () => {

                pointEditor.style.display =
                    'none';

                points = [];

                setStatus(
                    'Medición/plomado cancelado. Puedes tomar otra fotografía.'
                );
            }
        );

        /* =========================================================
           INICIO
        ========================================================= */

        window.addEventListener(
            'resize',
            () => {

                if (
                    arrowEditor &&
                    arrowCanvas
                ) {

                    ajustarCanvasFlecha();
                }
            }
        );

        window.addEventListener(
            'load',
            async () => {

                crearEditorFlechaDOM();

                cerrarEditorFlecha();

                modeBadge.textContent =
                    modo === 'medir'
                        ? '📏 MEDIR POSTE'
                        : modo === 'plomado'
                            ? '📐 PLOMADO POSTE'
                            : '📷 ' +
                              nombreTipo(tipo);

                if (modo === 'medir') {

                    specialPanel.style.display =
                        'block';

                    specialHelp.textContent =
                        'Captura la medida real del objeto conocido. La referencia y el poste deben estar aproximadamente a la misma distancia/plano para reducir error de perspectiva.';
                }

                if (modo === 'plomado') {

                    verticalGuide.style.display =
                        'block';
                }

                setStatus(
                    'Abriendo cámara…'
                );

                await iniciarCamara();
            }
        );
    </script>

</body>

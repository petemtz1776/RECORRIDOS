<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <title>PETES CAMERA STAMP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            height: 100dvh;
            max-width: 900px;
            margin: auto;
            background: #000;
            overflow: hidden;
        }

        #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        #canvas,
        #workCanvas {
            display: none;
        }

        /* =====================================================
           HUD
        ===================================================== */

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 8px;
            pointer-events: none;
        }

        #modeBadge {
            display: inline-block;
            background: rgba(0, 0, 0, .72);
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        #sensorHud {
            margin-top: 6px;
            display: inline-block;
            background: rgba(0, 0, 0, .68);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* =====================================================
           PÉNDULO EN VIVO
        ===================================================== */

        #pendulumHud {
            position: absolute;
            z-index: 19;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(82vw, 430px);
            height: min(72vh, 560px);
            pointer-events: none;
            display: none;
        }

        #pendulumCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* =====================================================
           CONTROLES
        ===================================================== */

        #controls {
            position: absolute;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 9px 7px calc(9px + env(safe-area-inset-bottom));
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, .96)
            );
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 13px;
            min-height: 46px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .45;
        }

        #takeButton {
            background: #4caf50;
            color: #fff;
        }

        #signalButton {
            background: #ff9800;
            color: #fff;
        }

        #confirmButton {
            background: #4caf50;
            color: #fff;
            display: none;
        }

        #cancelSignalButton {
            background: #f44336;
            color: #fff;
            display: none;
        }

        #cancelButton {
            background: #b71c1c;
            color: #fff;
        }

        /* =====================================================
           PANEL MEDICIÓN
        ===================================================== */

        #specialPanel {
            position: absolute;
            z-index: 40;
            left: 8px;
            right: 8px;
            top: 76px;
            background: rgba(0, 0, 0, .82);
            padding: 12px;
            border-radius: 10px;
            display: none;
            pointer-events: auto;
        }

        #specialPanel label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #knownMeasure {
            width: 100%;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid #777;
            background: #fff;
            color: #000;
            font-size: 17px;
            margin-bottom: 7px;
        }

        #specialHelp {
            font-size: 13px;
            line-height: 1.35;
        }

        #measureStart {
            margin-top: 8px;
            background: #1565c0;
            color: #fff;
            width: 100%;
        }

        /* =====================================================
           EDITOR DE PUNTOS
           SOLO SE UTILIZA EN MEDIR
        ===================================================== */

        #pointEditor {
            position: absolute;
            z-index: 50;
            inset: 0;
            background: #000;
            display: none;
            touch-action: none;
        }

        #pointCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #pointControls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 9px 7px calc(9px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, .95)
            );
        }

        #pointMove {
            background: #1565c0;
            color: #fff;
        }

        #pointUndo {
            background: #ff9800;
            color: #fff;
        }

        #pointConfirm {
            background: #4caf50;
            color: #fff;
        }

        #pointCancel {
            background: #f44336;
            color: #fff;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        #status {
            position: absolute;
            z-index: 60;
            left: 8px;
            right: 8px;
            bottom: 88px;
            background: rgba(0, 0, 0, .7);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            white-space: pre-line;
            pointer-events: none;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 420px) {

            button {
                padding: 10px 9px;
                font-size: 12px;
                min-height: 45px;
            }

            #specialPanel {
                top: 68px;
            }
        }
    </style>
</head>

<body>

    <div id="cameraContainer">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <canvas id="canvas"></canvas>
        <canvas id="workCanvas"></canvas>

        <div id="hud">

            <div id="modeBadge">
                📷 CÁMARA
            </div>

            <br>

            <div id="sensorHud">
                Sensores: esperando…
            </div>

        </div>

        <!-- =====================================================
             PÉNDULO
        ====================================================== -->

        <div id="pendulumHud">

            <canvas id="pendulumCanvas"></canvas>

        </div>

        <!-- =====================================================
             PANEL MEDICIÓN
        ====================================================== -->

        <div id="specialPanel">

            <label for="knownMeasure">
                MEDIDA REAL DEL OBJETO DE REFERENCIA
            </label>

            <input
                id="knownMeasure"
                type="number"
                step="0.001"
                min="0.001"
                placeholder="Ejemplo: 2.00 metros"
            >

            <div id="specialHelp"></div>

            <button id="measureStart">
                CONTINUAR
            </button>

        </div>

        <!-- =====================================================
             EDITOR DE PUNTOS
             SOLO PARA MEDIR POSTE
        ====================================================== -->

        <div id="pointEditor">

            <canvas id="pointCanvas"></canvas>

            <div id="pointControls">

                <button id="pointMove">
                    🔧 MOVER PUNTOS
                </button>

                <button id="pointUndo">
                    ↩️ DESHACER
                </button>

                <button id="pointConfirm">
                    ✅ CONFIRMAR
                </button>

                <button id="pointCancel">
                    ❌ CANCELAR
                </button>

            </div>

        </div>

        <div id="status">
            Abriendo cámara…
        </div>

        <!-- =====================================================
             CONTROLES
        ====================================================== -->

        <div id="controls">

            <button id="signalButton">
                🎯 SEÑALAR
            </button>

            <button id="takeButton" disabled>
                📸 FOTO
            </button>

            <button id="confirmButton">
                ✅ USAR
            </button>

            <button id="cancelSignalButton">
                ❌ CANCELAR
            </button>

            <button id="cancelButton">
                ✕ SALIR
            </button>

        </div>

    </div>

    <img id="preview">

    <script>
        'use strict';

        /* =====================================================
           PARÁMETROS
        ===================================================== */

        const params =
            new URLSearchParams(location.search);

        const tipo =
            params.get('tipo') || 'poste';

        let modo =
            params.get('modo') || 'normal';

        if (
            String(tipo).trim().toUpperCase() ===
            'MEDIR POSTE'
        ) {
            modo = 'medir';
        }

        if (
            String(tipo).trim().toUpperCase() ===
            'PLOMADO POSTE'
        ) {
            modo = 'plomado';
        }

        const proyecto =
            params.get('proyecto') || '';

        const tipoProyecto =
            params.get('tipoProyecto') || '';

        const hub =
            params.get('hub') || '';

        const rama =
            params.get('rama') || '';

        /* =====================================================
           LOGO
        ===================================================== */

        const LOGO_DRIVE_ID =
            '12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP';

        const LOGO_URL =
            'https://lh3.googleusercontent.com/d/' +
            LOGO_DRIVE_ID;

        const LOGO_URL_ALTERNATIVO =
            'https://drive.google.com/uc?export=view&id=' +
            LOGO_DRIVE_ID;

        /* =====================================================
           DOM
        ===================================================== */

        const video =
            document.getElementById('video');

        const canvas =
            document.getElementById('canvas');

        const workCanvas =
            document.getElementById('workCanvas');

        const takeButton =
            document.getElementById('takeButton');

        const signalButton =
            document.getElementById('signalButton');

        const confirmButton =
            document.getElementById('confirmButton');

        const cancelSignalButton =
            document.getElementById('cancelSignalButton');

        const cancelButton =
            document.getElementById('cancelButton');

        const status =
            document.getElementById('status');

        const preview =
            document.getElementById('preview');

        const modeBadge =
            document.getElementById('modeBadge');

        const sensorHud =
            document.getElementById('sensorHud');

        const pendulumHud =
            document.getElementById('pendulumHud');

        const pendulumCanvas =
            document.getElementById('pendulumCanvas');

        const specialPanel =
            document.getElementById('specialPanel');

        const knownMeasure =
            document.getElementById('knownMeasure');

        const specialHelp =
            document.getElementById('specialHelp');

        const measureStart =
            document.getElementById('measureStart');

        const pointEditor =
            document.getElementById('pointEditor');

        const pointCanvas =
            document.getElementById('pointCanvas');

        const pointMove =
            document.getElementById('pointMove');

        const pointUndo =
            document.getElementById('pointUndo');

        const pointConfirm =
            document.getElementById('pointConfirm');

        const pointCancel =
            document.getElementById('pointCancel');

        /* =====================================================
           ESTADO
        ===================================================== */

        let cameraStream = null;

        let gpsActual = null;

        let fechaFoto = null;

        let logoImagen = null;

        let logoListo = false;

        let zonaLogo = null;

        let zonaEstampado = null;

        let modoSenalar = false;

        let fotoBase = null;

        /* =====================================================
           FLECHA
        ===================================================== */

        let flechaX = null;
        let flechaY = null;
        let flechaAngulo = 0;
        let flechaEscala = 1;

        let gestoActivo = false;
        let toqueInicial = null;
        let ultimoToque = 0;

        let arrowEditor = null;
        let arrowCanvas = null;

        /* =====================================================
           SENSORES
        ===================================================== */

        let motionHandler = null;
        let orientationHandler = null;

        let gravity = {
            x: 0,
            y: -1,
            z: 0
        };

        let gravityReady = false;

        let orientationAngle = 0;

        /*
         * Ángulo que se mostrará y que se estampará.
         *
         * Es el ángulo instantáneo que está mostrando
         * el péndulo.
         */
        let pendulumAngle = 0;

        let pendulumAngleAtCapture = 0;

        /* =====================================================
           MEDICIÓN
        ===================================================== */

        let referenceReal = null;

        let points = [];

        let pointImage = null;

        let specialResult = null;

        let moverPuntosActivo = false;

        let puntoSeleccionado = -1;

        let puntoArrastrando = false;

        /* =====================================================
           GENERALES
        ===================================================== */

        function setStatus(text) {

            status.textContent = text;
        }

        function nombreTipo(t) {

            if (t === 'poste') {
                return 'POSTE';
            }

            if (t === 'carriers') {
                return 'CAJAS CARRIERS';
            }

            return String(t).toUpperCase();
        }

        function formatDate(d) {

            const p =
                n => String(n).padStart(2, '0');

            return (
                d.getFullYear() +
                p(d.getMonth() + 1) +
                p(d.getDate()) +
                '_' +
                p(d.getHours()) +
                p(d.getMinutes()) +
                p(d.getSeconds())
            );
        }

        function crearNombreFoto(t, d) {

            return (
                'STAMPED_' +
                nombreTipo(t).replace(/\s+/g, '_') +
                '_' +
                formatDate(d) +
                '.jpg'
            );
        }

        function clamp(v, a, b) {

            return Math.max(
                a,
                Math.min(b, v)
            );
        }

        /* =====================================================
           LOGO
        ===================================================== */

        function cargarLogo() {

            logoListo = false;

            logoImagen = new Image();

            logoImagen.crossOrigin =
                'anonymous';

            logoImagen.onload = () => {
                logoListo = true;
            };

            logoImagen.onerror = () => {

                const im = new Image();

                im.crossOrigin =
                    'anonymous';

                im.onload = () => {

                    logoImagen = im;

                    logoListo = true;
                };

                im.src =
                    LOGO_URL_ALTERNATIVO;
            };

            logoImagen.src =
                LOGO_URL;
        }

        function dibujarLogo(ctx, w, h) {

            zonaLogo = null;

            if (
                !logoListo ||
                !logoImagen
            ) {
                return;
            }

            const maxW =
                w * .18;

            const maxH =
                h * .14;

            const s =
                Math.min(
                    maxW / logoImagen.width,
                    maxH / logoImagen.height
                );

            const lw =
                logoImagen.width * s;

            const lh =
                logoImagen.height * s;

            const m =
                Math.max(
                    20,
                    w * .025
                );

            const x =
                w - lw - m;

            const y =
                m;

            const b =
                Math.max(
                    15,
                    w * .012
                );

            zonaLogo = {
                x: x - b,
                y: y - b,
                width: lw + b * 2,
                height: lh + b * 2
            };

            ctx.save();

            ctx.fillStyle =
                'rgba(0,0,0,.2)';

            ctx.fillRect(
                x - 5,
                y - 5,
                lw + 10,
                lh + 10
            );

            ctx.drawImage(
                logoImagen,
                x,
                y,
                lw,
                lh
            );

            ctx.restore();
        }

        /* =====================================================
           ESTAMPADO
        ===================================================== */

        function dibujarEstampado(
            ctx,
            w,
            h,
            extra = []
        ) {

            const s =
                Math.max(w, h) / 1200;

            const pad =
                Math.round(16 * s);

            const font =
                Math.max(
                    16,
                    Math.round(20 * s)
                );

            const line =
                27 * s;

            const pos =
                gpsActual;

            const d =
                fechaFoto || new Date();

            const base = [
                `PROYECTO: ${proyecto || 'SIN PROYECTO'}`,
                `TIPO PROYECTO: ${tipoProyecto || 'SIN TIPO'}`,
                `HUB: ${hub || '-'}  RAMA: ${rama || '-'}`,
                `TIPO FOTO: ${nombreTipo(tipo)}`,
                `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
                pos
                    ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
                    : 'GPS: SIN UBICACIÓN',
                ...extra
            ];

            ctx.font =
                `bold ${font}px Arial`;

            let tw = 0;

            base.forEach(text => {

                tw = Math.max(
                    tw,
                    ctx.measureText(text).width
                );
            });

            const bw =
                tw + pad * 2;

            const bh =
                base.length * line +
                pad * 2;

            const x =
                pad;

            const y =
                h - bh - pad;

            zonaEstampado = {
                x: x - 18,
                y: y - 18,
                width: bw + 36,
                height: bh + 36
            };

            ctx.fillStyle =
                'rgba(0,0,0,.48)';

            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                bw,
                bh,
                10 * s
            );

            ctx.fill();

            ctx.fillStyle =
                'rgba(255,255,255,.96)';

            ctx.textBaseline =
                'top';

            base.forEach((text, i) => {

                ctx.fillText(
                    text,
                    x + pad,
                    y + pad + i * line
                );
            });

            dibujarLogo(
                ctx,
                w,
                h
            );
        }

        /* =====================================================
           SENSORES
        ===================================================== */

        async function iniciarSensores() {

            try {

                if (
                    typeof DeviceMotionEvent !==
                    'undefined' &&
                    typeof DeviceMotionEvent
                        .requestPermission ===
                    'function'
                ) {

                    const p =
                        await DeviceMotionEvent
                            .requestPermission();

                    if (p !== 'granted') {

                        throw new Error(
                            'Permiso de movimiento no concedido'
                        );
                    }
                }

                motionHandler = e => {

                    const a =
                        e.accelerationIncludingGravity ||
                        e.acceleration ||
                        {};

                    if (
                        Number.isFinite(a.x) &&
                        Number.isFinite(a.y)
                    ) {

                        gravity = {
                            x: a.x,
                            y: a.y,
                            z: a.z || 0
                        };

                        gravityReady = true;

                        actualizarPendulo();
                    }
                };

                window.addEventListener(
                    'devicemotion',
                    motionHandler,
                    {
                        passive: true
                    }
                );

                if (
                    typeof DeviceOrientationEvent !==
                    'undefined' &&
                    typeof DeviceOrientationEvent
                        .requestPermission ===
                    'function'
                ) {

                    const p =
                        await DeviceOrientationEvent
                            .requestPermission();

                    if (p !== 'granted') {

                        throw new Error(
                            'Permiso de orientación no concedido'
                        );
                    }
                }

                orientationHandler = e => {

                    if (
                        Number.isFinite(e.alpha)
                    ) {

                        orientationAngle =
                            screen.orientation &&
                            Number.isFinite(
                                screen.orientation.angle
                            )
                                ? screen.orientation.angle
                                : 0;

                        actualizarPendulo();
                    }
                };

                window.addEventListener(
                    'deviceorientation',
                    orientationHandler,
                    {
                        passive: true
                    }
                );

                sensorHud.textContent =
                    'Sensores: ACTIVOS';

                actualizarPendulo();

            } catch (e) {

                sensorHud.textContent =
                    'Sensores: no disponibles';

                console.warn(e);
            }
        }

        /* =====================================================
           GRAVEDAD SEGÚN ORIENTACIÓN DE PANTALLA
        ===================================================== */

        function screenGravity() {

            let x = gravity.x;

            let y = gravity.y;

            const a =
                (
                    (
                        screen.orientation &&
                        screen.orientation.angle
                    ) || 0
                ) % 360;

            if (a === 90) {

                const q = x;

                x = y;

                y = -q;

            } else if (a === 180) {

                x = -x;

                y = -y;

            } else if (a === 270) {

                const q = x;

                x = -y;

                y = q;
            }

            return {
                x,
                y
            };
        }

        /* =====================================================
           CÁLCULO DEL ÁNGULO DEL PÉNDULO
        ===================================================== */

        function calcularAnguloPendulo() {

            const g =
                screenGravity();

            if (
                !Number.isFinite(g.x) ||
                !Number.isFinite(g.y)
            ) {
                return 0;
            }

            /*
             * La referencia vertical es 0°.
             *
             * El signo conserva hacia qué lado
             * está inclinado el teléfono.
             */

            let ang =
                Math.atan2(
                    g.x,
                    -g.y
                ) *
                180 /
                Math.PI;

            /*
             * Normalizamos para que el indicador
             * trabaje en -90° a +90°.
             */

            if (ang > 90) {
                ang -= 180;
            }

            if (ang < -90) {
                ang += 180;
            }

            return ang;
        }

        /* =====================================================
           PÉNDULO
        ===================================================== */

        function actualizarPendulo() {

            pendulumAngle =
                calcularAnguloPendulo();

            if (modo === 'plomado') {

                sensorHud.textContent =
                    gravityReady
                        ? `PÉNDULO: ${Math.abs(pendulumAngle).toFixed(2)}°`
                        : 'Péndulo: esperando…';

                pendulumHud.style.display =
                    'block';

                dibujarPenduloLive();
            }
        }

        function prepararCanvasPendulo() {

            const rect =
                pendulumCanvas.getBoundingClientRect();

            const dpr =
                window.devicePixelRatio || 1;

            const w =
                Math.max(
                    1,
                    Math.round(rect.width * dpr)
                );

            const h =
                Math.max(
                    1,
                    Math.round(rect.height * dpr)
                );

            if (
                pendulumCanvas.width !== w ||
                pendulumCanvas.height !== h
            ) {

                pendulumCanvas.width = w;

                pendulumCanvas.height = h;
            }
        }

        function dibujarPenduloLive() {

            prepararCanvasPendulo();

            const c =
                pendulumCanvas.getContext('2d');

            const w =
                pendulumCanvas.width;

            const h =
                pendulumCanvas.height;

            c.clearRect(
                0,
                0,
                w,
                h
            );

            dibujarGraficoPendulo(
                c,
                w,
                h,
                pendulumAngle,
                true
            );
        }

        /*
         * Este mismo gráfico se utiliza:
         *
         * 1. En vivo sobre la cámara.
         * 2. En la fotografía final.
         *
         * De esta manera los grados estampados son
         * exactamente los grados que estaba mostrando
         * el péndulo al capturar.
         */

        function dibujarGraficoPendulo(
            c,
            w,
            h,
            angulo,
            live = false
        ) {

            const cx =
                w / 2;

            const cy =
                h * .43;

            const radius =
                Math.min(w, h) *
                .34;

            c.save();

            /*
             * Panel semitransparente
             */

            c.fillStyle =
                live
                    ? 'rgba(0,0,0,.38)'
                    : 'rgba(0,0,0,.58)';

            c.beginPath();

            c.roundRect(
                cx - radius * 1.05,
                cy - radius * 1.05,
                radius * 2.1,
                radius * 2.25,
                radius * .12
            );

            c.fill();

            /*
             * Título
             */

            c.textAlign =
                'center';

            c.textBaseline =
                'middle';

            c.font =
                `bold ${Math.max(18, radius * .15)}px Arial`;

            c.fillStyle =
                '#ffffff';

            c.fillText(
                'PLOMADO',
                cx,
                cy - radius * .83
            );

            /*
             * ESCALA
             *
             * Marcas:
             * -10 -5 -3 -2 -1 0 1 2 3 5 10
             */

            const marcas = [
                -10,
                -5,
                -3,
                -2,
                -1,
                0,
                1,
                2,
                3,
                5,
                10
            ];

            const escalaMax =
                10;

            /*
             * Arco superior.
             */

            const arcoR =
                radius * .67;

            c.lineWidth =
                Math.max(
                    3,
                    radius * .018
                );

            c.strokeStyle =
                'rgba(255,255,255,.8)';

            c.beginPath();

            c.arc(
                cx,
                cy,
                arcoR,
                Math.PI,
                Math.PI * 2
            );

            c.stroke();

            /*
             * Marcas de grados.
             */

            marcas.forEach(g => {

                const rad =
                    Math.PI +
                    (
                        (g + escalaMax) /
                        (escalaMax * 2)
                    ) *
                    Math.PI;

                const x1 =
                    cx +
                    Math.cos(rad) *
                    arcoR;

                const y1 =
                    cy +
                    Math.sin(rad) *
                    arcoR;

                const largo =
                    g === 0
                        ? radius * .13
                        : radius * .075;

                const x2 =
                    cx +
                    Math.cos(rad) *
                    (arcoR - largo);

                const y2 =
                    cy +
                    Math.sin(rad) *
                    (arcoR - largo);

                c.beginPath();

                c.moveTo(
                    x1,
                    y1
                );

                c.lineTo(
                    x2,
                    y2
                );

                c.lineWidth =
                    g === 0
                        ? Math.max(
                            5,
                            radius * .025
                        )
                        : Math.max(
                            2,
                            radius * .014
                        );

                c.strokeStyle =
                    g === 0
                        ? '#00ffff'
                        : 'rgba(255,255,255,.8)';

                c.stroke();

                /*
                 * Número
                 */

                c.font =
                    `bold ${Math.max(11, radius * .075)}px Arial`;

                c.fillStyle =
                    g === 0
                        ? '#00ffff'
                        : '#ffffff';

                const tx =
                    cx +
                    Math.cos(rad) *
                    (arcoR - radius * .18);

                const ty =
                    cy +
                    Math.sin(rad) *
                    (arcoR - radius * .18);

                c.fillText(
                    `${Math.abs(g)}°`,
                    tx,
                    ty
                );
            });

            /*
             * Línea vertical de referencia.
             */

            c.beginPath();

            c.moveTo(
                cx,
                cy - radius * .65
            );

            c.lineTo(
                cx,
                cy + radius * .82
            );

            c.lineWidth =
                Math.max(
                    3,
                    radius * .018
                );

            c.strokeStyle =
                '#00ffff';

            c.setLineDash([
                radius * .045,
                radius * .035
            ]);

            c.stroke();

            c.setLineDash([]);

            /*
             * PÉNDULO
             *
             * La lectura se representa con la inclinación
             * real del sensor.
             */

            const rad =
                angulo *
                Math.PI /
                180;

            const longitud =
                radius * .72;

            const px =
                cx +
                Math.sin(rad) *
                longitud;

            const py =
                cy +
                Math.cos(rad) *
                longitud;

            /*
             * Sombra/línea exterior
             */

            c.beginPath();

            c.moveTo(
                cx,
                cy
            );

            c.lineTo(
                px,
                py
            );

            c.lineWidth =
                Math.max(
                    12,
                    radius * .07
                );

            c.lineCap =
                'round';

            c.strokeStyle =
                'rgba(0,0,0,.8)';

            c.stroke();

            /*
             * Línea del péndulo
             */

            c.beginPath();

            c.moveTo(
                cx,
                cy
            );

            c.lineTo(
                px,
                py
            );

            c.lineWidth =
                Math.max(
                    7,
                    radius * .042
                );

            c.strokeStyle =
                '#ff3b30';

            c.stroke();

            /*
             * Punto de suspensión
             */

            c.beginPath();

            c.arc(
                cx,
                cy,
                Math.max(
                    10,
                    radius * .065
                ),
                0,
                Math.PI * 2
            );

            c.fillStyle =
                '#ffffff';

            c.fill();

            c.strokeStyle =
                '#000000';

            c.lineWidth =
                Math.max(
                    3,
                    radius * .018
                );

            c.stroke();

            /*
             * Peso del péndulo
             */

            c.beginPath();

            c.arc(
                px,
                py,
                Math.max(
                    15,
                    radius * .09
                ),
                0,
                Math.PI * 2
            );

            c.fillStyle =
                '#ff3b30';

            c.fill();

            c.strokeStyle =
                '#ffffff';

            c.lineWidth =
                Math.max(
                    3,
                    radius * .02
                );

            c.stroke();

            /*
             * Lectura digital
             */

            const lectura =
                Math.abs(angulo).toFixed(2);

            const signo =
                angulo > 0
                    ? '+'
                    : angulo < 0
                        ? '-'
                        : '';

            const texto =
                `${signo}${lectura}°`;

            const boxW =
                radius * .85;

            const boxH =
                radius * .28;

            const boxX =
                cx -
                boxW / 2;

            const boxY =
                cy +
                radius * .91;

            c.fillStyle =
                'rgba(0,0,0,.78)';

            c.beginPath();

            c.roundRect(
                boxX,
                boxY,
                boxW,
                boxH,
                boxH * .25
            );

            c.fill();

            c.font =
                `bold ${Math.max(20, radius * .16)}px Arial`;

            c.fillStyle =
                '#ffeb3b';

            c.fillText(
                texto,
                cx,
                boxY + boxH / 2
            );

            /*
             * Texto auxiliar
             */

            c.font =
                `bold ${Math.max(11, radius * .07)}px Arial`;

            c.fillStyle =
                '#ffffff';

            c.fillText(
                'ALINEAR CON EL POSTE',
                cx,
                cy +
                radius * 1.19
            );

            c.restore();
        }

        /* =====================================================
           CAPTURA DE CÁMARA
        ===================================================== */

        async function iniciarCamara() {

            try {

                if (cameraStream) {
                    detenerCamara();
                }

                setStatus(
                    'Solicitando permiso de cámara…'
                );

                cameraStream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            video: {
                                facingMode: {
                                    ideal: 'environment'
                                },
                                width: {
                                    ideal: 1920
                                },
                                height: {
                                    ideal: 1080
                                }
                            },
                            audio: false
                        });

                video.srcObject =
                    cameraStream;

                await video.play();

                takeButton.disabled =
                    false;

                cargarLogo();

                await iniciarSensores();

                configurarModo();

                setStatus(
                    modo === 'medir'
                        ? '📏 MEDIR POSTE: captura la foto y después marca 2 puntos de referencia y 2 puntos del poste.'
                        : modo === 'plomado'
                            ? '📐 PLOMADO: alinea el péndulo con el poste. El valor mostrado se estampará en la fotografía.'
                            : '✅ Cámara lista. Puedes tomar la fotografía o activar SEÑALAR.'
                );

            } catch (e) {

                console.error(e);

                setStatus(
                    '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n' +
                    (e.name || '') +
                    '\n' +
                    (e.message || e)
                );

                takeButton.disabled =
                    true;
            }
        }

        /* =====================================================
           CONFIGURAR MODO
        ===================================================== */

        function configurarModo() {

            modeBadge.textContent =
                modo === 'medir'
                    ? '📏 MEDIR POSTE'
                    : modo === 'plomado'
                        ? '📐 PLOMADO POSTE'
                        : '📷 ' +
                          nombreTipo(tipo);

            signalButton.style.display =
                modo === 'normal'
                    ? 'inline-block'
                    : 'none';

            if (modo === 'medir') {

                specialPanel.style.display =
                    'block';

                specialHelp.textContent =
                    'Escribe la medida real del objeto sólido conocido. Luego toma la foto. El objeto de referencia debe estar aproximadamente en el mismo plano/distancia que el poste.';

                pendulumHud.style.display =
                    'none';
            }

            if (modo === 'plomado') {

                specialPanel.style.display =
                    'none';

                pendulumHud.style.display =
                    'block';

                actualizarPendulo();
            }
        }

        /* =====================================================
           GPS
        ===================================================== */

        function obtenerGPS() {

            return new Promise(resolve => {

                if (!navigator.geolocation) {
                    return resolve(null);
                }

                navigator.geolocation.getCurrentPosition(
                    p => resolve({
                        lat: p.coords.latitude,
                        lng: p.coords.longitude,
                        accuracy: p.coords.accuracy
                    }),
                    () => resolve(null),
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        /* =====================================================
           CAPTURA BASE
        ===================================================== */

        function capturaBase() {

            const w =
                video.videoWidth;

            const h =
                video.videoHeight;

            if (!w || !h) {

                throw new Error(
                    'La cámara todavía no está lista.'
                );
            }

            canvas.width =
                w;

            canvas.height =
                h;

            const ctx =
                canvas.getContext('2d');

            ctx.drawImage(
                video,
                0,
                0,
                w,
                h
            );

            return ctx;
        }

        /* =====================================================
           DIBUJAR PÉNDULO SOBRE FOTO
        ===================================================== */

        function dibujarPenduloEnFoto(
            ctx,
            w,
            h,
            angulo
        ) {

            /*
             * Creamos un área proporcional a la pantalla
             * original del HUD.
             */

            const areaW =
                Math.min(
                    w * .48,
                    900
                );

            const areaH =
                Math.min(
                    h * .52,
                    1000
                );

            const x =
                (w - areaW) / 2;

            const y =
                h * .08;

            ctx.save();

            ctx.translate(
                x,
                y
            );

            /*
             * Dibujamos exactamente el mismo gráfico
             * usado en vivo.
             */

            dibujarGraficoPendulo(
                ctx,
                areaW,
                areaH,
                angulo,
                false
            );

            ctx.restore();
        }

        /* =====================================================
           TOMAR FOTO
        ===================================================== */

        async function tomarFoto() {

            try {

                if (!cameraStream) {

                    throw new Error(
                        'La cámara no está iniciada.'
                    );
                }

                gpsActual =
                    await obtenerGPS();

                fechaFoto =
                    new Date();

                /*
                 * =================================================
                 * PLOMADO
                 * =================================================
                 *
                 * MUY IMPORTANTE:
                 *
                 * Aquí NO se dibuja primero el estampado normal.
                 *
                 * Se captura la fotografía limpia,
                 * se congela el ángulo del péndulo,
                 * se dibuja el péndulo,
                 * y finalmente se dibuja UNA SOLA VEZ
                 * el estampado.
                 */

                if (modo === 'plomado') {

                    const ctx =
                        capturaBase();

                    /*
                     * Congelamos exactamente el valor que
                     * estaba mostrando el péndulo al tocar FOTO.
                     */

                    pendulumAngleAtCapture =
                        pendulumAngle;

                    /*
                     * Dibujamos el péndulo sobre la foto.
                     */

                    dibujarPenduloEnFoto(
                        ctx,
                        canvas.width,
                        canvas.height,
                        pendulumAngleAtCapture
                    );

                    /*
                     * Estampado ÚNICO.
                     */

                    dibujarEstampado(
                        ctx,
                        canvas.width,
                        canvas.height,
                        [
                            `PLOMADO: ${Math.abs(pendulumAngleAtCapture).toFixed(2)}°`
                        ]
                    );

                    fotoBase =
                        canvas.toDataURL(
                            'image/jpeg',
                            .92
                        );

                    enviarFotoFinal(
                        fotoBase,
                        {
                            modo: 'plomado',

                            metadata: {

                                plomado: {

                                    grados:
                                        Number(
                                            Math.abs(
                                                pendulumAngleAtCapture
                                            ).toFixed(2)
                                        ),

                                    gradosFirmados:
                                        Number(
                                            pendulumAngleAtCapture.toFixed(2)
                                        ),

                                    referencia:
                                        'PENDULO_SENSOR'
                                }
                            }
                        }
                    );

                    return;
                }

                /*
                 * =================================================
                 * MEDIR POSTE
                 * =================================================
                 */

                if (modo === 'medir') {

                    /*
                     * Para medir se captura la foto limpia
                     * y el estampado se realiza una sola vez
                     * al finalizar los puntos.
                     */

                    const ctx =
                        capturaBase();

                    fotoBase =
                        canvas.toDataURL(
                            'image/jpeg',
                            .92
                        );

                    specialPanel.style.display =
                        'none';

                    abrirEditorPuntos(
                        'medir'
                    );

                    return;
                }

                /*
                 * =================================================
                 * NORMAL
                 * =================================================
                 */

                const ctx =
                    capturaBase();

                dibujarEstampado(
                    ctx,
                    canvas.width,
                    canvas.height
                );

                fotoBase =
                    canvas.toDataURL(
                        'image/jpeg',
                        .92
                    );

                if (
                    modo === 'normal' &&
                    modoSenalar
                ) {

                    abrirEditorFlecha();

                    return;
                }

                enviarFotoFinal(
                    fotoBase,
                    {
                        modo: 'normal'
                    }
                );

            } catch (e) {

                console.error(e);

                setStatus(
                    '❌ ERROR AL TOMAR FOTO\n' +
                    e.message
                );
            }
        }

        /* =====================================================
           EDITOR DE FLECHA
        ===================================================== */

        function abrirEditorFlecha() {

            crearEditorFlechaDOM();

            const im =
                new Image();

            im.onload = () => {

                arrowCanvas.width =
                    im.naturalWidth;

                arrowCanvas.height =
                    im.naturalHeight;

                ajustarCanvasFlecha();

                arrowEditor.style.display =
                    'block';

                dibujarFlecha();

                iniciarGestosFlecha();
            };

            im.src =
                fotoBase;
        }

        function crearEditorFlechaDOM() {

            if (arrowEditor) {
                return;
            }

            arrowEditor =
                document.createElement('div');

            arrowEditor.id =
                'arrowEditor';

            arrowEditor.style.cssText =
                [
                    'position:absolute',
                    'inset:0',
                    'z-index:25',
                    'background:#000',
                    'touch-action:none',
                    'overflow:hidden',
                    'overscroll-behavior:none',
                    'user-select:none',
                    '-webkit-user-select:none',
                    '-webkit-touch-callout:none'
                ].join(';');

            arrowCanvas =
                document.createElement('canvas');

            arrowCanvas.id =
                'arrowCanvas';

            arrowCanvas.style.cssText =
                [
                    'display:block',
                    'position:absolute',
                    'touch-action:none',
                    'user-select:none',
                    '-webkit-user-select:none',
                    '-webkit-touch-callout:none',
                    'margin:0',
                    'padding:0'
                ].join(';');

            arrowEditor.appendChild(
                arrowCanvas
            );

            document
                .getElementById('cameraContainer')
                .appendChild(
                    arrowEditor
                );

            [
                'gesturestart',
                'gesturechange',
                'gestureend'
            ].forEach(eventName => {

                arrowEditor.addEventListener(
                    eventName,
                    e => e.preventDefault(),
                    {
                        passive: false
                    }
                );
            });

            signalButton.style.display =
                'none';

            takeButton.style.display =
                'none';

            confirmButton.style.display =
                'inline-block';

            cancelSignalButton.style.display =
                'inline-block';

            cancelButton.style.display =
                'none';

            setStatus(
                '🎯 TOCA LA FOTO PARA colocar la flecha. Un dedo mueve; dos dedos giran/cambian tamaño.'
            );

            flechaX = null;
            flechaY = null;
            flechaAngulo = 0;
            flechaEscala = 1;
        }

        function ajustarCanvasFlecha() {

            if (
                !arrowCanvas ||
                !arrowCanvas.width ||
                !arrowCanvas.height
            ) {
                return;
            }

            const container =
                document.getElementById(
                    'cameraContainer'
                );

            const cw =
                container.clientWidth;

            const ch =
                container.clientHeight;

            const iw =
                arrowCanvas.width;

            const ih =
                arrowCanvas.height;

            const escala =
                Math.min(
                    cw / iw,
                    ch / ih
                );

            const displayW =
                iw * escala;

            const displayH =
                ih * escala;

            arrowCanvas.style.width =
                `${displayW}px`;

            arrowCanvas.style.height =
                `${displayH}px`;

            arrowCanvas.style.left =
                `${(cw - displayW) / 2}px`;

            arrowCanvas.style.top =
                `${(ch - displayH) / 2}px`;
        }

        function puntoArrow(e) {

            const r =
                arrowCanvas.getBoundingClientRect();

            const p =
                e.touches
                    ? e.touches[0]
                    : e;

            return {

                x:
                    (p.clientX - r.left) *
                    arrowCanvas.width /
                    r.width,

                y:
                    (p.clientY - r.top) *
                    arrowCanvas.height /
                    r.height
            };
        }

        function puntoRect(
            x,
            y,
            r
        ) {

            return (
                r &&
                x >= r.x &&
                x <= r.x + r.width &&
                y >= r.y &&
                y <= r.y + r.height
            );
        }

        function arrowBlocked(
            x,
            y,
            ang,
            scale
        ) {

            const f =
                Math.max(
                    arrowCanvas.width,
                    arrowCanvas.height
                ) / 1200;

            const len =
                150 *
                f *
                scale;

            const sx =
                x -
                len *
                Math.cos(
                    ang +
                    Math.PI / 4
                );

            const sy =
                y -
                len *
                Math.sin(
                    ang +
                    Math.PI / 4
                );

            for (
                let i = 0;
                i <= 18;
                i++
            ) {

                const t =
                    i / 18;

                const px =
                    sx +
                    (x - sx) *
                    t;

                const py =
                    sy +
                    (y - sy) *
                    t;

                if (
                    puntoRect(
                        px,
                        py,
                        zonaLogo
                    ) ||
                    puntoRect(
                        px,
                        py,
                        zonaEstampado
                    )
                ) {
                    return true;
                }
            }

            return false;
        }

        function dibujarFlecha() {

            if (!arrowCanvas) {
                return;
            }

            const im =
                new Image();

            im.onload = () => {

                const c =
                    arrowCanvas.getContext('2d');

                c.clearRect(
                    0,
                    0,
                    arrowCanvas.width,
                    arrowCanvas.height
                );

                c.drawImage(
                    im,
                    0,
                    0,
                    arrowCanvas.width,
                    arrowCanvas.height
                );

                if (flechaX == null) {
                    return;
                }

                const f =
                    Math.max(
                        arrowCanvas.width,
                        arrowCanvas.height
                    ) / 1200;

                const len =
                    150 *
                    f *
                    flechaEscala;

                const tip =
                    32 *
                    f *
                    flechaEscala;

                const sx =
                    flechaX -
                    len *
                    Math.cos(
                        flechaAngulo +
                        Math.PI / 4
                    );

                const sy =
                    flechaY -
                    len *
                    Math.sin(
                        flechaAngulo +
                        Math.PI / 4
                    );

                c.beginPath();

                c.moveTo(
                    sx,
                    sy
                );

                c.lineTo(
                    flechaX,
                    flechaY
                );

                c.strokeStyle =
                    '#000';

                c.lineWidth =
                    Math.max(
                        12,
                        13 *
                        f *
                        flechaEscala
                    );

                c.lineCap =
                    'round';

                c.stroke();

                c.beginPath();

                c.moveTo(
                    sx,
                    sy
                );

                c.lineTo(
                    flechaX,
                    flechaY
                );

                c.strokeStyle =
                    '#00ff00';

                c.lineWidth =
                    Math.max(
                        7,
                        9 *
                        f *
                        flechaEscala
                    );

                c.stroke();

                const a =
                    Math.atan2(
                        flechaY - sy,
                        flechaX - sx
                    );

                c.beginPath();

                c.moveTo(
                    flechaX,
                    flechaY
                );

                c.lineTo(
                    flechaX -
                    tip *
                    Math.cos(
                        a - Math.PI / 6
                    ),
                    flechaY -
                    tip *
                    Math.sin(
                        a - Math.PI / 6
                    )
                );

                c.lineTo(
                    flechaX -
                    tip *
                    Math.cos(
                        a + Math.PI / 6
                    ),
                    flechaY -
                    tip *
                    Math.sin(
                        a + Math.PI / 6
                    )
                );

                c.closePath();

                c.fillStyle =
                    '#00ff00';

                c.fill();

                c.strokeStyle =
                    '#000';

                c.lineWidth =
                    Math.max(
                        3,
                        4 *
                        f *
                        flechaEscala
                    );

                c.stroke();
            };

            im.src =
                fotoBase;
        }

        /* =====================================================
           GESTOS FLECHA
        ===================================================== */

        function iniciarGestosFlecha() {

            if (
                !arrowCanvas ||
                arrowCanvas.dataset.ready
            ) {
                return;
            }

            arrowCanvas.dataset.ready =
                '1';

            arrowCanvas.addEventListener(
                'touchstart',
                e => {

                    e.preventDefault();

                    ultimoToque =
                        Date.now();

                    if (
                        e.touches.length === 1
                    ) {

                        const p =
                            puntoArrow(e);

                        if (
                            flechaX == null
                        ) {

                            if (
                                arrowBlocked(
                                    p.x,
                                    p.y,
                                    0,
                                    1
                                )
                            ) {

                                return alert(
                                    '🚫 La flecha no puede cubrir el logo ni el estampado.'
                                );
                            }

                            flechaX =
                                p.x;

                            flechaY =
                                p.y;

                            dibujarFlecha();
                        }

                        gestoActivo =
                            true;

                        toqueInicial = {
                            tipo: 'move',
                            x: p.x,
                            y: p.y,
                            x0: flechaX,
                            y0: flechaY
                        };

                    } else if (
                        e.touches.length === 2 &&
                        flechaX != null
                    ) {

                        const a =
                            puntoArrow(
                                e.touches[0]
                            );

                        const b =
                            puntoArrow(
                                e.touches[1]
                            );

                        toqueInicial = {

                            tipo: 'transform',

                            cx:
                                (a.x + b.x) / 2,

                            cy:
                                (a.y + b.y) / 2,

                            dist:
                                Math.hypot(
                                    b.x - a.x,
                                    b.y - a.y
                                ),

                            ang:
                                Math.atan2(
                                    b.y - a.y,
                                    b.x - a.x
                                ),

                            x0:
                                flechaX,

                            y0:
                                flechaY,

                            s:
                                flechaEscala,

                            r:
                                flechaAngulo
                        };

                        gestoActivo =
                            true;
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'touchmove',
                e => {

                    e.preventDefault();

                    if (!gestoActivo) {
                        return;
                    }

                    if (
                        e.touches.length === 1 &&
                        toqueInicial?.tipo === 'move'
                    ) {

                        const p =
                            puntoArrow(e);

                        const nx =
                            toqueInicial.x0 +
                            p.x -
                            toqueInicial.x;

                        const ny =
                            toqueInicial.y0 +
                            p.y -
                            toqueInicial.y;

                        if (
                            !arrowBlocked(
                                nx,
                                ny,
                                flechaAngulo,
                                flechaEscala
                            )
                        ) {

                            flechaX =
                                nx;

                            flechaY =
                                ny;

                            dibujarFlecha();
                        }

                    } else if (
                        e.touches.length === 2 &&
                        toqueInicial?.tipo === 'transform'
                    ) {

                        const a =
                            puntoArrow(
                                e.touches[0]
                            );

                        const b =
                            puntoArrow(
                                e.touches[1]
                            );

                        const dist =
                            Math.hypot(
                                b.x - a.x,
                                b.y - a.y
                            );

                        const ang =
                            Math.atan2(
                                b.y - a.y,
                                b.x - a.x
                            );

                        const s =
                            clamp(
                                toqueInicial.s *
                                dist /
                                toqueInicial.dist,
                                .35,
                                3
                            );

                        const r =
                            toqueInicial.r +
                            ang -
                            toqueInicial.ang;

                        if (
                            !arrowBlocked(
                                toqueInicial.x0,
                                toqueInicial.y0,
                                r,
                                s
                            )
                        ) {

                            flechaEscala =
                                s;

                            flechaAngulo =
                                r;

                            dibujarFlecha();
                        }
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'touchend',
                e => {

                    if (
                        !e.touches.length
                    ) {

                        gestoActivo =
                            false;

                        toqueInicial =
                            null;
                    }
                },
                {
                    passive: false
                }
            );

            arrowCanvas.addEventListener(
                'click',
                e => {

                    if (
                        Date.now() -
                        ultimoToque <
                        500
                    ) {
                        return;
                    }

                    const p =
                        puntoArrow(e);

                    if (
                        flechaX == null &&
                        !arrowBlocked(
                            p.x,
                            p.y,
                            0,
                            1
                        )
                    ) {

                        flechaX =
                            p.x;

                        flechaY =
                            p.y;

                        dibujarFlecha();
                    }
                }
            );
        }

        /* =====================================================
           CERRAR EDITOR FLECHA
        ===================================================== */

        function cerrarEditorFlecha() {

            if (arrowEditor) {

                arrowEditor.remove();

                arrowEditor =
                    null;

                arrowCanvas =
                    null;
            }

            confirmButton.style.display =
                'none';

            cancelSignalButton.style.display =
                'none';

            takeButton.style.display =
                'inline-block';

            cancelButton.style.display =
                'inline-block';

            signalButton.style.display =
                modo === 'normal'
                    ? 'inline-block'
                    : 'none';
        }

        /* =====================================================
           EDITOR DE PUNTOS
           SOLO MEDIR
        ===================================================== */

        function abrirEditorPuntos(m) {

            /*
             * Seguridad:
             * este editor solamente debe abrirse para MEDIR.
             */

            if (m !== 'medir') {
                return;
            }

            pointEditor.style.display =
                'block';

            pointCanvas.width =
                video.videoWidth;

            pointCanvas.height =
                video.videoHeight;

            const c =
                pointCanvas.getContext('2d');

            const im =
                new Image();

            im.onload = () => {

                c.drawImage(
                    im,
                    0,
                    0
                );

                pointImage =
                    im;
            };

            im.src =
                fotoBase;

            points = [];

            moverPuntosActivo =
                false;

            puntoSeleccionado =
                -1;

            puntoArrastrando =
                false;

            pointMove.textContent =
                '🔧 MOVER PUNTOS';

            setStatus(
                '📏 Marca R1 y R2 en la referencia. Después BASE y PUNTA del POSTE. Puedes activar MOVER PUNTOS para corregirlos.'
            );
        }

        function puntoDesdeEvento(e) {

            const r =
                pointCanvas.getBoundingClientRect();

            const t =
                e.touches &&
                e.touches.length
                    ? e.touches[0]
                    : e;

            return {

                x:
                    (t.clientX - r.left) *
                    pointCanvas.width /
                    r.width,

                y:
                    (t.clientY - r.top) *
                    pointCanvas.height /
                    r.height
            };
        }

        function indicePuntoCercano(p) {

            let mejor = -1;

            let dist = Infinity;

            points.forEach((q, i) => {

                const d =
                    Math.hypot(
                        q.x - p.x,
                        q.y - p.y
                    );

                if (d < dist) {

                    dist = d;

                    mejor = i;
                }
            });

            return dist <=
                Math.max(
                    28,
                    pointCanvas.width / 45
                )
                ? mejor
                : -1;
        }

        function agregarPunto(p) {

            if (moverPuntosActivo) {
                return false;
            }

            if (
                points.length >= 4
            ) {
                return false;
            }

            points.push(p);

            dibujarPuntos();

            return true;
        }

        pointCanvas.addEventListener(
            'click',
            e => {

                if (
                    !pointEditor.style.display ||
                    pointEditor.style.display ===
                    'none'
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                if (moverPuntosActivo) {
                    return;
                }

                agregarPunto(p);
            }
        );

        pointCanvas.addEventListener(
            'pointerdown',
            e => {

                if (
                    !moverPuntosActivo ||
                    !points.length
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                const i =
                    indicePuntoCercano(p);

                if (i < 0) {
                    return;
                }

                puntoSeleccionado =
                    i;

                puntoArrastrando =
                    true;

                pointCanvas
                    .setPointerCapture?.(
                        e.pointerId
                    );

                e.preventDefault();
            }
        );

        pointCanvas.addEventListener(
            'pointermove',
            e => {

                if (
                    !moverPuntosActivo ||
                    !puntoArrastrando ||
                    puntoSeleccionado < 0
                ) {
                    return;
                }

                const p =
                    puntoDesdeEvento(e);

                points[puntoSeleccionado] = {

                    x: Math.max(
                        0,
                        Math.min(
                            pointCanvas.width,
                            p.x
                        )
                    ),

                    y: Math.max(
                        0,
                        Math.min(
                            pointCanvas.height,
                            p.y
                        )
                    )
                };

                dibujarPuntos();

                e.preventDefault();
            }
        );

        pointCanvas.addEventListener(
            'pointerup',
            e => {

                puntoArrastrando =
                    false;

                puntoSeleccionado =
                    -1;

                try {

                    pointCanvas
                        .releasePointerCapture?.(
                            e.pointerId
                        );

                } catch (_) {}
            }
        );

        /* =====================================================
           DIBUJAR PUNTOS
        ===================================================== */

        function dibujarPuntos() {

            if (!pointImage) {
                return;
            }

            const c =
                pointCanvas.getContext('2d');

            c.drawImage(
                pointImage,
                0,
                0
            );

            c.lineWidth =
                Math.max(
                    5,
                    pointCanvas.width / 400
                );

            c.strokeStyle =
                '#00ff00';

            c.fillStyle =
                '#00ff00';

            const labels = [
                'R1',
                'R2',
                'BASE',
                'PUNTA'
            ];

            points.forEach((p, i) => {

                c.beginPath();

                c.arc(
                    p.x,
                    p.y,
                    10,
                    0,
                    Math.PI * 2
                );

                c.fill();

                c.fillStyle =
                    '#fff';

                c.font =
                    'bold 24px Arial';

                c.fillText(
                    labels[i] ||
                    String(i + 1),
                    p.x + 14,
                    p.y - 14
                );

                c.fillStyle =
                    '#00ff00';
            });

            const pairs = [
                [0, 1],
                [2, 3]
            ];

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });
        }

        pointMove.addEventListener(
            'click',
            () => {

                moverPuntosActivo =
                    !moverPuntosActivo;

                pointMove.textContent =
                    moverPuntosActivo
                        ? '🖐️ MODO MOVER ACTIVO'
                        : '🔧 MOVER PUNTOS';

                setStatus(
                    moverPuntosActivo
                        ? '🖐️ MODO MOVER: arrastra BASE, PUNTA, R1 o R2 para corregir su posición.'
                        : '📍 MODO COLOCAR: toca la imagen para agregar el siguiente punto.'
                );
            }
        );

        pointUndo.addEventListener(
            'click',
            () => {

                if (!points.length) {
                    return;
                }

                points.pop();

                dibujarPuntos();

                setStatus(
                    '↩️ Se quitó el último punto. Puedes colocarlo nuevamente.'
                );
            }
        );

        /* =====================================================
           CÁLCULOS MEDICIÓN
        ===================================================== */

        function distancia(a, b) {

            return Math.hypot(
                b.x - a.x,
                b.y - a.y
            );
        }

        /* =====================================================
           CONFIRMAR MEDICIÓN
        ===================================================== */

        function confirmarPuntos() {

            if (modo !== 'medir') {
                return;
            }

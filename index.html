            if (
                points.length !== 4
            ) {

                return alert(
                    'Debes marcar exactamente 4 puntos: R1, R2, BASE y PUNTA.'
                );
            }

            const refPx =
                distancia(
                    points[0],
                    points[1]
                );

            const postPx =
                distancia(
                    points[2],
                    points[3]
                );

            if (refPx < 2) {

                return alert(
                    'La línea de referencia es demasiado corta.'
                );
            }

            const h =
                referenceReal *
                postPx /
                refPx;

            specialResult = {

                referenceReal,

                referencePixels:
                    refPx,

                postPixels:
                    postPx,

                height:
                    h
            };

            finalizarEspecial(
                [
                    `REF: ${referenceReal.toFixed(3)} m`,
                    `ALTURA POSTE: ${h.toFixed(3)} m`
                ],
                {
                    medicion:
                        specialResult
                }
            );
        }

        /* =====================================================
           ANOTACIONES FINALES DE MEDICIÓN
        ===================================================== */

        function dibujarAnotacionesFinales(
            c,
            w,
            h
        ) {

            const labels = [
                'R1',
                'R2',
                'BASE',
                'PUNTA'
            ];

            const pairs = [
                [0, 1],
                [2, 3]
            ];

            const lineW =
                Math.max(
                    5,
                    w / 520
                );

            const radius =
                Math.max(
                    16,
                    w / 70
                );

            const fs =
                Math.max(
                    28,
                    w / 48
                );

            const off =
                Math.max(
                    22,
                    w / 65
                );

            c.save();

            c.lineCap =
                'round';

            c.lineJoin =
                'round';

            /*
             * Línea exterior.
             */

            c.strokeStyle =
                '#000';

            c.lineWidth =
                lineW +
                Math.max(
                    6,
                    w / 700
                );

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });

            /*
             * Línea verde.
             */

            c.strokeStyle =
                '#00ff66';

            c.lineWidth =
                lineW;

            pairs.forEach(([a, b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    c.beginPath();

                    c.moveTo(
                        points[a].x,
                        points[a].y
                    );

                    c.lineTo(
                        points[b].x,
                        points[b].y
                    );

                    c.stroke();
                }
            });

            /*
             * Puntos.
             */

            c.font =
                `bold ${fs}px Arial`;

            c.textBaseline =
                'middle';

            points.forEach((p, i) => {

                c.beginPath();

                c.fillStyle =
                    '#000';

                c.arc(
                    p.x,
                    p.y,
                    radius +
                    Math.max(
                        4,
                        w / 500
                    ),
                    0,
                    Math.PI * 2
                );

                c.fill();

                c.beginPath();

                c.fillStyle =
                    '#00ff66';

                c.arc(
                    p.x,
                    p.y,
                    radius,
                    0,
                    Math.PI * 2
                );

                c.fill();

                const label =
                    labels[i] ||
                    String(i + 1);

                const tx =
                    p.x + off;

                const ty =
                    p.y - off;

                const box =
                    c.measureText(
                        label
                    );

                c.fillStyle =
                    'rgba(0,0,0,.82)';

                c.fillRect(
                    tx - 8,
                    ty - fs * .58,
                    box.width + 16,
                    fs * 1.16
                );

                c.fillStyle =
                    '#fff';

                c.fillText(
                    label,
                    tx,
                    ty
                );
            });

            c.restore();
        }

        /* =====================================================
           FINALIZAR MEDICIÓN
        ===================================================== */

        function finalizarEspecial(
            extra,
            meta
        ) {

            pointEditor.style.display =
                'none';

            canvas.width =
                pointCanvas.width;

            canvas.height =
                pointCanvas.height;

            const c =
                canvas.getContext('2d');

            c.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            c.drawImage(
                pointImage,
                0,
                0,
                canvas.width,
                canvas.height
            );

            dibujarAnotacionesFinales(
                c,
                canvas.width,
                canvas.height
            );

            /*
             * ÚNICO estampado para medición.
             */

            dibujarEstampado(
                c,
                canvas.width,
                canvas.height,
                extra
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            enviarFotoFinal(
                fotoBase,
                meta
            );
        }

        /* =====================================================
           MEDIDA REAL
        ===================================================== */

        measureStart.addEventListener(
            'click',
            () => {

                const v =
                    Number(
                        knownMeasure.value
                    );

                if (
                    !Number.isFinite(v) ||
                    v <= 0
                ) {

                    return alert(
                        'Captura una medida real mayor que cero.'
                    );
                }

                referenceReal =
                    v;

                specialPanel.style.display =
                    'none';

                setStatus(
                    'Medida guardada: ' +
                    v +
                    ' m. Ahora toma la fotografía.'
                );

                takeButton.disabled =
                    false;
            }
        );

        /* =====================================================
           ENVÍO FOTO
        ===================================================== */

        function enviarFotoFinal(
            dataURL,
            extra = {}
        ) {

            preview.src =
                dataURL;

            preview.style.display =
                'block';

            const mensaje = {

                type:
                    'CAMERA_STAMP_PHOTO',

                tipo:
                    String(tipo || '')
                        .trim(),

                fileName:
                    crearNombreFoto(
                        tipo,
                        fechaFoto ||
                        new Date()
                    ),

                mimeType:
                    'image/jpeg',

                data:
                    dataURL,

                latitud:
                    gpsActual
                        ? gpsActual.lat
                        : null,

                longitud:
                    gpsActual
                        ? gpsActual.lng
                        : null,

                modo,

                metadata: {

                    proyecto,

                    tipoProyecto,

                    hub,

                    rama,

                    tipoFoto:
                        nombreTipo(tipo),

                    fecha:
                        (
                            fechaFoto ||
                            new Date()
                        ).toISOString(),

                    gps:
                        gpsActual
                },

                ...extra
            };

            let confirmado =
                false;

            const cerrarTrasAck =
                e => {

                    if (
                        !e ||
                        !e.data ||
                        e.data.type !==
                        'CAMERA_STAMP_ACK'
                    ) {
                        return;
                    }

                    if (
                        e.data.fileName &&
                        e.data.fileName !==
                        mensaje.fileName
                    ) {
                        return;
                    }

                    confirmado =
                        true;

                    window.removeEventListener(
                        'message',
                        cerrarTrasAck
                    );

                    setStatus(
                        '✅ FOTO RECIBIDA POR EL FORMULARIO.'
                    );

                    detenerCamara();

                    setTimeout(
                        () => {

                            try {

                                if (
                                    window.opener &&
                                    !window.opener.closed
                                ) {

                                    window.opener.focus();
                                }

                                window.close();

                            } catch (_) {}

                        },
                        150
                    );
                };

            window.addEventListener(
                'message',
                cerrarTrasAck
            );

            if (
                window.opener &&
                !window.opener.closed
            ) {

                window.opener.postMessage(
                    mensaje,
                    '*'
                );

                setStatus(
                    '📤 Enviando fotografía al formulario…'
                );

            } else {

                window.removeEventListener(
                    'message',
                    cerrarTrasAck
                );

                setStatus(
                    '❌ No se encontró el formulario que abrió la cámara.'
                );

                return;
            }

            setTimeout(
                () => {

                    if (confirmado) {
                        return;
                    }

                    window.removeEventListener(
                        'message',
                        cerrarTrasAck
                    );

                    setStatus(
                        '✅ FOTO ENVIADA AL FORMULARIO.'
                    );

                    detenerCamara();

                    try {

                        if (
                            window.opener &&
                            !window.opener.closed
                        ) {

                            window.opener.focus();
                        }

                        window.close();

                    } catch (_) {}

                },
                2500
            );
        }

        /* =====================================================
           DETENER CÁMARA
        ===================================================== */

        function detenerCamara() {

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(
                        t => t.stop()
                    );

                cameraStream =
                    null;
            }

            video.srcObject =
                null;

            takeButton.disabled =
                true;

            if (motionHandler) {

                window.removeEventListener(
                    'devicemotion',
                    motionHandler
                );
            }

            if (orientationHandler) {

                window.removeEventListener(
                    'deviceorientation',
                    orientationHandler
                );
            }
        }

        /* =====================================================
           INICIO
        ===================================================== */

        window.addEventListener(
            'load',
            async () => {

                /*
                 * Creamos y cerramos el editor de flecha
                 * para mantener la lógica original.
                 */

                crearEditorFlechaDOM();

                cerrarEditorFlecha();

                modeBadge.textContent =
                    modo === 'medir'
                        ? '📏 MEDIR POSTE'
                        : modo === 'plomado'
                            ? '📐 PLOMADO POSTE'
                            : '📷 ' +
                              nombreTipo(tipo);

                if (modo === 'medir') {

                    specialPanel.style.display =
                        'block';

                    specialHelp.textContent =
                        'Captura la medida real del objeto conocido. La referencia y el poste deben estar aproximadamente a la misma distancia/plano para reducir error de perspectiva.';

                    pendulumHud.style.display =
                        'none';
                }

                if (modo === 'plomado') {

                    pendulumHud.style.display =
                        'block';
                }

                setStatus(
                    'Abriendo cámara…'
                );

                await iniciarCamara();
            }
        );

    </script>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <title>PETES CAMERA STAMP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            height: 100dvh;
            max-width: 900px;
            margin: auto;
            background: #000;
            overflow: hidden;
        }

        #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        #canvas,
        #workCanvas {
            display: none;
        }

        /* =========================================================
           HUD
        ========================================================= */

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 8px;
            pointer-events: none;
        }

        #modeBadge {
            display: inline-block;
            background: rgba(0, 0, 0, .72);
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        #sensorHud {
            margin-top: 6px;
            display: inline-block;
            background: rgba(0, 0, 0, .62);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* =========================================================
           PÉNDULO / TRANSPORTADOR
        ========================================================= */

        #plomadoOverlay {
            position: absolute;
            z-index: 18;
            inset: 0;
            pointer-events: none;
            display: none;
        }

        #plomadoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #plomadoReading {
            position: absolute;
            z-index: 19;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .72);
            border: 2px solid rgba(255, 255, 255, .75);
            border-radius: 12px;
            padding: 8px 15px;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            text-align: center;
        }

        #plomadoHelp {
            position: absolute;
            z-index: 19;
            top: 37%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .58);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            white-space: nowrap;
        }

        /* =========================================================
           CONTROLES
        ========================================================= */

        #controls {
            position: absolute;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 9px 7px calc(9px + env(safe-area-inset-bottom));
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, .96)
            );
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 13px;
            min-height: 46px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .45;
        }

        #takeButton {
            background: #4caf50;
            color: #fff;
        }

        #signalButton {
            background: #ff9800;
            color: #fff;
        }

        #confirmButton {
            background: #4caf50;
            color: #fff;
            display: none;
        }

        #cancelSignalButton {
            background: #f44336;
            color: #fff;
            display: none;
        }

        #cancelButton {
            background: #b71c1c;
            color: #fff;
        }

        /* =========================================================
           PANEL MEDICIÓN
        ========================================================= */

        #specialPanel {
            position: absolute;
            z-index: 40;
            left: 8px;
            right: 8px;
            top: 76px;
            background: rgba(0, 0, 0, .82);
            padding: 12px;
            border-radius: 10px;
            display: none;
            pointer-events: auto;
        }

        #specialPanel label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #knownMeasure {
            width: 100%;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid #777;
            background: #fff;
            color: #000;
            font-size: 17px;
            margin-bottom: 7px;
        }

        #specialHelp {
            font-size: 13px;
            line-height: 1.35;
        }

        #measureStart {
            margin-top: 8px;
            background: #1565c0;
            color: #fff;
            width: 100%;
        }

        /* =========================================================
           EDITOR DE FLECHA
        ========================================================= */

        #arrowEditor {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: #000;
            touch-action: none;
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* =========================================================
           STATUS
        ========================================================= */

        #status {
            position: absolute;
            z-index: 60;
            left: 8px;
            right: 8px;
            bottom: 88px;
            background: rgba(0, 0, 0, .7);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            white-space: pre-line;
            pointer-events: none;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
        }

        @media (max-width: 420px) {

            button {
                padding: 10px 9px;
                font-size: 12px;
                min-height: 45px;
            }

            #specialPanel {
                top: 68px;
            }

            #plomadoReading {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div id="cameraContainer">

    <video
        id="video"
        autoplay
        playsinline
        muted
    ></video>

    <canvas id="canvas"></canvas>
    <canvas id="workCanvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div id="modeBadge">
            📷 CÁMARA
        </div>

        <br>

        <div id="sensorHud">
            Sensores: esperando…
        </div>

    </div>

    <!-- =========================================================
         PÉNDULO
         ========================================================= -->

    <div id="plomadoOverlay">

        <canvas id="plomadoCanvas"></canvas>

        <div id="plomadoReading">
            PLOMADO: 0.00°
        </div>

        <div id="plomadoHelp">
            Alinea el poste con el péndulo
        </div>

    </div>

    <!-- =========================================================
         PANEL MEDICIÓN
         ========================================================= -->

    <div id="specialPanel">

        <label for="knownMeasure">
            MEDIDA REAL DEL OBJETO DE REFERENCIA
        </label>

        <input
            id="knownMeasure"
            type="number"
            step="0.001"
            min="0.001"
            placeholder="Ejemplo: 2.00 metros"
        >

        <div id="specialHelp"></div>

        <button id="measureStart">
            CONTINUAR
        </button>

    </div>

    <div id="status">
        Abriendo cámara…
    </div>

    <!-- =========================================================
         CONTROLES
         ========================================================= -->

    <div id="controls">

        <button id="signalButton">
            🎯 SEÑALAR
        </button>

        <button id="takeButton" disabled>
            📸 FOTO
        </button>

        <button id="confirmButton">
            ✅ USAR
        </button>

        <button id="cancelSignalButton">
            ❌ CANCELAR
        </button>

        <button id="cancelButton">
            ✕ SALIR
        </button>

    </div>

</div>

<img id="preview">

<script>
'use strict';

/* =========================================================
   PARÁMETROS
   ========================================================= */

const params =
    new URLSearchParams(location.search);

const tipo =
    params.get('tipo') || 'poste';

let modo =
    params.get('modo') || 'normal';

if (
    String(tipo).trim().toUpperCase() ===
    'MEDIR POSTE'
) {
    modo = 'medir';
}

if (
    String(tipo).trim().toUpperCase() ===
    'PLOMADO POSTE'
) {
    modo = 'plomado';
}

const proyecto =
    params.get('proyecto') || '';

const tipoProyecto =
    params.get('tipoProyecto') || '';

const hub =
    params.get('hub') || '';

const rama =
    params.get('rama') || '';

/* =========================================================
   LOGO
   ========================================================= */

const LOGO_DRIVE_ID =
    '12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP';

const LOGO_URL =
    'https://lh3.googleusercontent.com/d/' +
    LOGO_DRIVE_ID;

const LOGO_URL_ALTERNATIVO =
    'https://drive.google.com/uc?export=view&id=' +
    LOGO_DRIVE_ID;

/* =========================================================
   DOM
   ========================================================= */

const video =
    document.getElementById('video');

const canvas =
    document.getElementById('canvas');

const workCanvas =
    document.getElementById('workCanvas');

const takeButton =
    document.getElementById('takeButton');

const signalButton =
    document.getElementById('signalButton');

const confirmButton =
    document.getElementById('confirmButton');

const cancelSignalButton =
    document.getElementById('cancelSignalButton');

const cancelButton =
    document.getElementById('cancelButton');

const status =
    document.getElementById('status');

const preview =
    document.getElementById('preview');

const modeBadge =
    document.getElementById('modeBadge');

const sensorHud =
    document.getElementById('sensorHud');

const specialPanel =
    document.getElementById('specialPanel');

const knownMeasure =
    document.getElementById('knownMeasure');

const specialHelp =
    document.getElementById('specialHelp');

const measureStart =
    document.getElementById('measureStart');

const plomadoOverlay =
    document.getElementById('plomadoOverlay');

const plomadoCanvas =
    document.getElementById('plomadoCanvas');

const plomadoReading =
    document.getElementById('plomadoReading');

const plomadoHelp =
    document.getElementById('plomadoHelp');

/* =========================================================
   ESTADO
   ========================================================= */

let cameraStream = null;

let gpsActual = null;

let fechaFoto = null;

let logoImagen = null;

let logoListo = false;

let zonaLogo = null;

let zonaEstampado = null;

let modoSenalar = false;

let fotoBase = null;

/* Flecha */

let flechaX = null;
let flechaY = null;
let flechaAngulo = 0;
let flechaEscala = 1;

let gestoActivo = false;
let toqueInicial = null;
let ultimoToque = 0;

/* Sensores */

let motionHandler = null;
let orientationHandler = null;

let gravity = {
    x: 0,
    y: -1,
    z: 0
};

let gravityReady = false;

/* Plomado */

let plomadoGrados = 0;

let plomadoActivo = false;

/* Medición */

let referenceReal = null;

let specialResult = null;

/* =========================================================
   GENERALES
   ========================================================= */

function setStatus(text) {
    status.textContent = text;
}

function nombreTipo(t) {

    if (t === 'poste') {
        return 'POSTE';
    }

    if (t === 'carriers') {
        return 'CAJAS CARRIERS';
    }

    return String(t).toUpperCase();
}

function formatDate(d) {

    const p =
        n => String(n).padStart(2, '0');

    return (
        d.getFullYear() +
        p(d.getMonth() + 1) +
        p(d.getDate()) +
        '_' +
        p(d.getHours()) +
        p(d.getMinutes()) +
        p(d.getSeconds())
    );
}

function crearNombreFoto(t, d) {

    return (
        'STAMPED_' +
        nombreTipo(t).replace(/\s+/g, '_') +
        '_' +
        formatDate(d) +
        '.jpg'
    );
}

function clamp(v, a, b) {

    return Math.max(
        a,
        Math.min(b, v)
    );
}

/* =========================================================
   LOGO
   ========================================================= */

function cargarLogo() {

    logoListo = false;

    logoImagen = new Image();

    logoImagen.crossOrigin =
        'anonymous';

    logoImagen.onload = () => {
        logoListo = true;
    };

    logoImagen.onerror = () => {

        const im = new Image();

        im.crossOrigin =
            'anonymous';

        im.onload = () => {

            logoImagen = im;
            logoListo = true;
        };

        im.src =
            LOGO_URL_ALTERNATIVO;
    };

    logoImagen.src =
        LOGO_URL;
}

function dibujarLogo(ctx, w, h) {

    zonaLogo = null;

    if (
        !logoListo ||
        !logoImagen
    ) {
        return;
    }

    const maxW =
        w * .18;

    const maxH =
        h * .14;

    const s =
        Math.min(
            maxW / logoImagen.width,
            maxH / logoImagen.height
        );

    const lw =
        logoImagen.width * s;

    const lh =
        logoImagen.height * s;

    const m =
        Math.max(
            20,
            w * .025
        );

    const x =
        w - lw - m;

    const y =
        m;

    const b =
        Math.max(
            15,
            w * .012
        );

    zonaLogo = {
        x: x - b,
        y: y - b,
        width: lw + b * 2,
        height: lh + b * 2
    };

    ctx.save();

    ctx.fillStyle =
        'rgba(0,0,0,.2)';

    ctx.fillRect(
        x - 5,
        y - 5,
        lw + 10,
        lh + 10
    );

    ctx.drawImage(
        logoImagen,
        x,
        y,
        lw,
        lh
    );

    ctx.restore();
}

/* =========================================================
   ESTAMPADO
   ========================================================= */

function dibujarEstampado(
    ctx,
    w,
    h,
    extra = []
) {

    const s =
        Math.max(w, h) / 1200;

    const pad =
        Math.round(16 * s);

    const font =
        Math.max(
            16,
            Math.round(20 * s)
        );

    const line =
        27 * s;

    const pos =
        gpsActual;

    const d =
        fechaFoto || new Date();

    const base = [
        `PROYECTO: ${proyecto || 'SIN PROYECTO'}`,
        `TIPO PROYECTO: ${tipoProyecto || 'SIN TIPO'}`,
        `HUB: ${hub || '-'}  RAMA: ${rama || '-'}`,
        `TIPO FOTO: ${nombreTipo(tipo)}`,
        `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
        pos
            ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
            : 'GPS: SIN UBICACIÓN',
        ...extra
    ];

    ctx.font =
        `bold ${font}px Arial`;

    let tw = 0;

    base.forEach(text => {

        tw = Math.max(
            tw,
            ctx.measureText(text).width
        );
    });

    const bw =
        tw + pad * 2;

    const bh =
        base.length * line +
        pad * 2;

    const x =
        pad;

    const y =
        h - bh - pad;

    zonaEstampado = {
        x: x - 18,
        y: y - 18,
        width: bw + 36,
        height: bh + 36
    };

    ctx.fillStyle =
        'rgba(0,0,0,.48)';

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        bw,
        bh,
        10 * s
    );

    ctx.fill();

    ctx.fillStyle =
        'rgba(255,255,255,.96)';

    ctx.textBaseline =
        'top';

    base.forEach((text, i) => {

        ctx.fillText(
            text,
            x + pad,
            y + pad + i * line
        );
    });

    dibujarLogo(
        ctx,
        w,
        h
    );
}

/* =========================================================
   SENSORES
   ========================================================= */

async function iniciarSensores() {

    try {

        if (
            typeof DeviceMotionEvent !==
            'undefined' &&
            typeof DeviceMotionEvent.requestPermission ===
            'function'
        ) {

            const p =
                await DeviceMotionEvent
                    .requestPermission();

            if (p !== 'granted') {

                throw new Error(
                    'Permiso de movimiento no concedido'
                );
            }
        }

        motionHandler = e => {

            const a =
                e.accelerationIncludingGravity ||
                e.acceleration ||
                {};

            if (
                Number.isFinite(a.x) &&
                Number.isFinite(a.y)
            ) {

                gravity = {
                    x: a.x,
                    y: a.y,
                    z: a.z || 0
                };

                gravityReady = true;

                actualizarPlomado();
            }
        };

        window.addEventListener(
            'devicemotion',
            motionHandler,
            {
                passive: true
            }
        );

        if (
            typeof DeviceOrientationEvent !==
            'undefined' &&
            typeof DeviceOrientationEvent.requestPermission ===
            'function'
        ) {

            const p =
                await DeviceOrientationEvent
                    .requestPermission();

            if (p !== 'granted') {

                throw new Error(
                    'Permiso de orientación no concedido'
                );
            }
        }

        orientationHandler = () => {

            actualizarPlomado();
        };

        window.addEventListener(
            'deviceorientation',
            orientationHandler,
            {
                passive: true
            }
        );

        sensorHud.textContent =
            'Sensores: ACTIVOS';

    } catch (e) {

        sensorHud.textContent =
            'Sensores: no disponibles';

        console.warn(e);
    }
}

/* =========================================================
   GRAVEDAD CORREGIDA POR ORIENTACIÓN
   ========================================================= */

function screenGravity() {

    let x = gravity.x;
    let y = gravity.y;

    const a =
        (
            (
                screen.orientation &&
                screen.orientation.angle
            ) || 0
        ) % 360;

    if (a === 90) {

        const q = x;

        x = y;
        y = -q;

    } else if (a === 180) {

        x = -x;
        y = -y;

    } else if (a === 270) {

        const q = x;

        x = -y;
        y = q;
    }

    return {
        x,
        y
    };
}

/* =========================================================
   CÁLCULO DEL PÉNDULO
   =========================================================

   IMPORTANTE:

   0 grados = péndulo completamente vertical hacia abajo.

   Positivo = derecha.
   Negativo = izquierda.

   Esta misma convención se utiliza para dibujar
   el transportador y para estampar la fotografía.
   ========================================================= */

function calcularAnguloPendulo() {

    const g =
        screenGravity();

    if (
        !Number.isFinite(g.x) ||
        !Number.isFinite(g.y)
    ) {
        return 0;
    }

    const magnitude =
        Math.hypot(
            g.x,
            g.y
        );

    if (magnitude < 0.1) {
        return 0;
    }

    /*
     * La gravedad apunta hacia abajo.
     *
     * atan2(x, -y):
     *
     *  0° = abajo
     * + = derecha
     * - = izquierda
     */

    let ang =
        Math.atan2(
            g.x,
            -g.y
        ) *
        180 /
        Math.PI;

    /*
     * Normalizamos a -180 / +180.
     */

    while (ang > 180) {
        ang -= 360;
    }

    while (ang < -180) {
        ang += 360;
    }

    /*
     * Para un plomado práctico no necesitamos
     * representar más de 90° hacia cada lado.
     */

    return clamp(
        ang,
        -90,
        90
    );
}

/* =========================================================
   DIBUJAR TRANSPORTADOR
   ========================================================= */

function dibujarTransportador() {

    if (
        !plomadoCanvas ||
        !plomadoOverlay
    ) {
        return;
    }

    const w =
        plomadoOverlay.clientWidth;

    const h =
        plomadoOverlay.clientHeight;

    if (!w || !h) {
        return;
    }

    const dpr =
        window.devicePixelRatio || 1;

    const realW =
        Math.round(w * dpr);

    const realH =
        Math.round(h * dpr);

    if (
        plomadoCanvas.width !== realW ||
        plomadoCanvas.height !== realH
    ) {

        plomadoCanvas.width =
            realW;

        plomadoCanvas.height =
            realH;
    }

    const c =
        plomadoCanvas.getContext('2d');

    c.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    c.clearRect(
        0,
        0,
        w,
        h
    );

    /*
     * El transportador se coloca arriba.
     *
     * El centro es el punto de giro.
     */

    const cx =
        w / 2;

    const cy =
        Math.max(
            105,
            h * .18
        );

    const radius =
        Math.min(
            w * .40,
            h * .24
        );

    /* =====================================================
       ARCO PRINCIPAL
       ===================================================== */

    c.save();

    c.strokeStyle =
        'rgba(255,255,255,.92)';

    c.lineWidth =
        3;

    c.beginPath();

    /*
     * Ángulo matemático:
     *
     * 0 grados de nuestra escala = abajo.
     *
     * El arco se dibuja desde izquierda
     * hasta derecha pasando por arriba.
     */

    const pasos = 180;

    for (
        let i = 0;
        i <= pasos;
        i++
    ) {

        const deg =
            -90 + i;

        const rad =
            deg *
            Math.PI /
            180;

        /*
         * Conversión:
         *
         * 0° de la escala está abajo.
         *
         * Para el arco superior:
         * x = sin(deg)
         * y = -cos(deg)
         */

        const x =
            cx +
            radius *
            Math.sin(
                rad
            );

        const y =
            cy -
            radius *
            Math.cos(
                rad
            );

        if (i === 0) {
            c.moveTo(x, y);
        } else {
            c.lineTo(x, y);
        }
    }

    c.stroke();

    /* =====================================================
       MARCAS CADA 1 GRADO
       ===================================================== */

    for (
        let deg = -90;
        deg <= 90;
        deg++
    ) {

        const rad =
            deg *
            Math.PI /
            180;

        const x1 =
            cx +
            radius *
            Math.sin(rad);

        const y1 =
            cy -
            radius *
            Math.cos(rad);

        let largo = 9;

        if (
            deg % 10 === 0
        ) {

            largo = 27;

        } else if (
            deg % 5 === 0
        ) {

            largo = 18;
        }

        const x2 =
            cx +
            (radius - largo) *
            Math.sin(rad);

        const y2 =
            cy -
            (radius - largo) *
            Math.cos(rad);

        c.beginPath();

        c.moveTo(
            x1,
            y1
        );

        c.lineTo(
            x2,
            y2
        );

        c.strokeStyle =
            deg === 0
                ? '#00ff00'
                : 'rgba(255,255,255,.88)';

        c.lineWidth =
            deg === 0
                ? 4
                : deg % 10 === 0
                    ? 3
                    : 1.5;

        c.stroke();
    }

    /* =====================================================
       NÚMEROS
       ===================================================== */

    c.textAlign =
        'center';

    c.textBaseline =
        'middle';

    c.font =
        'bold 13px Arial';

    for (
        let deg = -90;
        deg <= 90;
        deg += 10
    ) {

        const rad =
            deg *
            Math.PI /
            180;

        const textRadius =
            radius - 43;

        const tx =
            cx +
            textRadius *
            Math.sin(rad);

        const ty =
            cy -
            textRadius *
            Math.cos(rad);

        c.fillStyle =
            deg === 0
                ? '#00ff00'
                : '#ffffff';

        c.fillText(
            `${deg}°`,
            tx,
            ty
        );
    }

    /* =====================================================
       PUNTO DE GIRO
       ===================================================== */

    c.beginPath();

    c.arc(
        cx,
        cy,
        9,
        0,
        Math.PI * 2
    );

    c.fillStyle =
        '#ff3b30';

    c.fill();

    c.strokeStyle =
        '#ffffff';

    c.lineWidth =
        2;

    c.stroke();

    /* =====================================================
       PÉNDULO
       ===================================================== */

    const ang =
        plomadoGrados *
        Math.PI /
        180;

    /*
     * El péndulo siempre parte del centro.
     */

    const longitud =
        Math.min(
            h * .52,
            w * .52
        );

    const px =
        cx +
        longitud *
        Math.sin(ang);

    const py =
        cy +
        longitud *
        Math.cos(ang);

    /* Sombra / contorno */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle =
        'rgba(0,0,0,.85)';

    c.lineWidth =
        10;

    c.lineCap =
        'round';

    c.stroke();

    /* Línea principal roja */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        px,
        py
    );

    c.strokeStyle =
        '#ff3030';

    c.lineWidth =
        5;

    c.lineCap =
        'round';

    c.stroke();

    /* Peso del péndulo */

    c.beginPath();

    c.arc(
        px,
        py,
        11,
        0,
        Math.PI * 2
    );

    c.fillStyle =
        '#ff3030';

    c.fill();

    c.strokeStyle =
        '#ffffff';

    c.lineWidth =
        2;

    c.stroke();

    /*
     * Línea vertical de referencia.
     * Azul para diferenciarla del péndulo.
     */

    c.beginPath();

    c.moveTo(
        cx,
        cy
    );

    c.lineTo(
        cx,
        Math.min(
            h,
            cy + longitud
        )
    );

    c.strokeStyle =
        'rgba(0,150,255,.72)';

    c.lineWidth =
        2;

    c.setLineDash([
        8,
        8
    ]);

    c.stroke();

    c.setLineDash([]);

    c.restore();

    /* =====================================================
       LECTURA
       ===================================================== */

    plomadoReading.textContent =
        `PLOMADO: ${Math.abs(plomadoGrados).toFixed(2)}°`;

    /*
     * Mostramos también el sentido.
     */

    const sentido =
        Math.abs(plomadoGrados) < 0.005
            ? 'CENTRADO'
            : plomadoGrados > 0
                ? 'DERECHA'
                : 'IZQUIERDA';

    plomadoHelp.textContent =
        `Péndulo: ${Math.abs(plomadoGrados).toFixed(2)}° ${sentido}`;
}

/* =========================================================
   ACTUALIZAR PLOMADO
   ========================================================= */

function actualizarPlomado() {

    if (
        modo !== 'plomado'
    ) {
        return;
    }

    plomadoGrados =
        calcularAnguloPendulo();

    sensorHud.textContent =
        gravityReady
            ? `Sensores: ACTIVOS | péndulo ${plomadoGrados.toFixed(2)}°`
            : 'Sensores: esperando…';

    if (plomadoActivo) {
        dibujarTransportador();
    }
}

/* =========================================================
   ACTIVAR PLOMADO
   ========================================================= */

function activarPlomadoVisual() {

    if (
        modo !== 'plomado'
    ) {
        return;
    }

    plomadoActivo =
        true;

    plomadoOverlay.style.display =
        'block';

    dibujarTransportador();
}

/* =========================================================
   CÁMARA
   ========================================================= */

async function iniciarCamara() {

    try {

        if (cameraStream) {
            detenerCamara();
        }

        setStatus(
            'Solicitando permiso de cámara…'
        );

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: 'environment'
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }
                    },

                    audio: false
                });

        video.srcObject =
            cameraStream;

        await video.play();

        takeButton.disabled =
            false;

        cargarLogo();

        await iniciarSensores();

        configurarModo();

        setStatus(
            modo === 'medir'
                ? '📏 MEDIR POSTE: captura la foto y marca R1, R2, BASE y PUNTA.'
                : modo === 'plomado'
                    ? '📐 PLOMADO: alinea el poste con el péndulo y utiliza la lectura del arco.'
                    : '✅ Cámara lista.'
        );

    } catch (e) {

        console.error(e);

        setStatus(
            '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n' +
            (e.name || '') +
            '\n' +
            (e.message || e)
        );

        takeButton.disabled =
            true;
    }
}

/* =========================================================
   CONFIGURAR MODO
   ========================================================= */

function configurarModo() {

    modeBadge.textContent =
        modo === 'medir'
            ? '📏 MEDIR POSTE'
            : modo === 'plomado'
                ? '📐 PLOMADO POSTE'
                : '📷 ' +
                  nombreTipo(tipo);

    signalButton.style.display =
        modo === 'normal'
            ? 'inline-block'
            : 'none';

    if (modo === 'medir') {

        specialPanel.style.display =
            'block';

        specialHelp.textContent =
            'Escribe la medida real del objeto sólido conocido. Luego toma la foto.';
    }

    if (modo === 'plomado') {

        activarPlomadoVisual();
    }
}

/* =========================================================
   GPS
   ========================================================= */

function obtenerGPS() {

    return new Promise(resolve => {

        if (!navigator.geolocation) {
            return resolve(null);
        }

        navigator.geolocation.getCurrentPosition(
            p => resolve({

                lat:
                    p.coords.latitude,

                lng:
                    p.coords.longitude,

                accuracy:
                    p.coords.accuracy
            }),

            () => resolve(null),

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
}

/* =========================================================
   CAPTURA BASE
   ========================================================= */

function capturaBase() {

    const w =
        video.videoWidth;

    const h =
        video.videoHeight;

    if (!w || !h) {

        throw new Error(
            'La cámara todavía no está lista.'
        );
    }

    canvas.width =
        w;

    canvas.height =
        h;

    const ctx =
        canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    return ctx;
}

/* =========================================================
   TOMAR FOTO
   ========================================================= */

async function tomarFoto() {

    try {

        if (!cameraStream) {

            throw new Error(
                'La cámara no está iniciada.'
            );
        }

        gpsActual =
            await obtenerGPS();

        fechaFoto =
            new Date();

        const ctx =
            capturaBase();

        /*
         * NORMAL
         */

        if (
            modo === 'normal'
        ) {

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            if (modoSenalar) {

                abrirEditorFlecha();

                return;
            }

            enviarFotoFinal(
                fotoBase,
                {
                    modo: 'normal'
                }
            );

            return;
        }

        /*
         * MEDIR
         */

        if (
            modo === 'medir'
        ) {

            specialPanel.style.display =
                'none';

            dibujarEstampado(
                ctx,
                canvas.width,
                canvas.height
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            abrirEditorMedicion();

            return;
        }

        /*
         * PLOMADO
         *
         * IMPORTANTE:
         *
         * NO se dibuja aquí el estampado normal.
         *
         * El estampado se realiza UNA SOLA VEZ
         * después de tomar la lectura final.
         */

        if (
            modo === 'plomado'
        ) {

            plomadoGrados =
                calcularAnguloPendulo();

            setStatus(
                `📐 Lectura capturada: ${Math.abs(plomadoGrados).toFixed(2)}°. Presiona USAR para guardar.`
            );

            fotoBase =
                canvas.toDataURL(
                    'image/jpeg',
                    .92
                );

            confirmarPlomado();

            return;
        }

    } catch (e) {

        console.error(e);

        setStatus(
            '❌ ERROR AL TOMAR FOTO\n' +
            e.message
        );
    }
}

/* =========================================================
   EDITOR DE MEDICIÓN
   ========================================================= */

let measureEditor = null;

function abrirEditorMedicion() {

    /*
     * Esta versión mantiene la medición simple.
     * Se utiliza el canvas original de la fotografía.
     */

    if (!measureEditor) {

        measureEditor =
            document.createElement('div');

        measureEditor.style.cssText =
            `
            position:absolute;
            inset:0;
            z-index:25;
            background:#000;
            overflow:hidden;
            touch-action:none;
            `;
    }

    measureEditor.innerHTML = '';

    const c =
        document.createElement('canvas');

    c.width =
        canvas.width;

    c.height =
        canvas.height;

    c.style.cssText =
        `
        position:absolute;
        max-width:100%;
        max-height:100%;
        width:100%;
        height:100%;
        object-fit:contain;
        left:0;
        top:0;
        `;

    const ctx =
        c.getContext('2d');

    const im =
        new Image();

    im.onload = () => {

        ctx.drawImage(
            im,
            0,
            0,
            c.width,
            c.height
        );

        measureEditor.appendChild(c);

        document
            .getElementById('cameraContainer')
            .appendChild(measureEditor);

        setStatus(
            '📏 En esta versión conserva el flujo de medición del poste.'
        );
    };

    im.src =
        fotoBase;
}

/* =========================================================
   PLOMADO
   ========================================================= */

function confirmarPlomado() {

    /*
     * Ocultamos el overlay para que el arco NO se queme
     * dentro de la fotografía final.
     *
     * El valor sí se conserva.
     */

    plomadoOverlay.style.display =
        'none';

    plomadoActivo =
        false;

    const grados =
        Math.abs(
            plomadoGrados
        );

    const direccion =
        Math.abs(plomadoGrados) < .005
            ? 'CENTRADO'
            : plomadoGrados > 0
                ? 'DERECHA'
                : 'IZQUIERDA';

    /*
     * Volvemos a generar la foto desde la cámara
     * para evitar capturar controles.
     */

    const ctx =
        capturaBase();

    /*
     * UN SOLO ESTAMPADO.
     */

    dibujarEstampado(
        ctx,
        canvas.width,
        canvas.height,
        [
            `PLOMADO: ${grados.toFixed(2)}°`,
            `DIRECCIÓN: ${direccion}`
        ]
    );

    fotoBase =
        canvas.toDataURL(
            'image/jpeg',
            .92
        );

    enviarFotoFinal(
        fotoBase,
        {
            modo: 'plomado',

            plomado: {

                grados:
                    Number(
                        grados.toFixed(2)
                    ),

                direccion,

                anguloFirmado:
                    Number(
                        plomadoGrados.toFixed(2)
                    )
            }
        }
    );
}

/* =========================================================
   FLECHA
   ========================================================= */

let arrowEditor = null;
let arrowCanvas = null;

function abrirEditorFlecha() {

    crearEditorFlechaDOM();

    const im =
        new Image();

    im.onload = () => {

        arrowCanvas.width =
            im.naturalWidth;

        arrowCanvas.height =
            im.naturalHeight;

        ajustarCanvasFlecha();

        arrowEditor.style.display =
            'block';

        dibujarFlecha();

        iniciarGestosFlecha();
    };

    im.src =
        fotoBase;
}

function crearEditorFlechaDOM() {

    if (arrowEditor) {
        return;
    }

    arrowEditor =
        document.createElement('div');

    arrowEditor.id =
        'arrowEditor';

    arrowEditor.style.cssText =
        `
        position:absolute;
        inset:0;
        z-index:25;
        background:#000;
        touch-action:none;
        overflow:hidden;
        overscroll-behavior:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
        `;

    arrowCanvas =
        document.createElement('canvas');

    arrowCanvas.id =
        'arrowCanvas';

    arrowCanvas.style.cssText =
        `
        display:block;
        position:absolute;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
        margin:0;
        padding:0;
        `;

    arrowEditor.appendChild(
        arrowCanvas
    );

    document
        .getElementById('cameraContainer')
        .appendChild(
            arrowEditor
        );

    [
        'gesturestart',
        'gesturechange',
        'gestureend'
    ].forEach(eventName => {

        arrowEditor.addEventListener(
            eventName,
            e => e.preventDefault(),
            {
                passive: false
            }
        );
    });

    signalButton.style.display =
        'none';

    takeButton.style.display =
        'none';

    confirmButton.style.display =
        'inline-block';

    cancelSignalButton.style.display =
        'inline-block';

    cancelButton.style.display =
        'none';

    setStatus(
        '🎯 Toca la foto para colocar la flecha. Un dedo mueve; dos dedos giran/cambian tamaño.'
    );

    flechaX = null;
    flechaY = null;
    flechaAngulo = 0;
    flechaEscala = 1;
}

function ajustarCanvasFlecha() {

    if (
        !arrowCanvas ||
        !arrowCanvas.width ||
        !arrowCanvas.height
    ) {
        return;
    }

    const container =
        document.getElementById(
            'cameraContainer'
        );

    const cw =
        container.clientWidth;

    const ch =
        container.clientHeight;

    const iw =
        arrowCanvas.width;

    const ih =
        arrowCanvas.height;

    const escala =
        Math.min(
            cw / iw,
            ch / ih
        );

    const displayW =
        iw * escala;

    const displayH =
        ih * escala;

    arrowCanvas.style.width =
        `${displayW}px`;

    arrowCanvas.style.height =
        `${displayH}px`;

    arrowCanvas.style.left =
        `${(cw - displayW) / 2}px`;

    arrowCanvas.style.top =
        `${(ch - displayH) / 2}px`;
}

function puntoArrow(e) {

    const r =
        arrowCanvas.getBoundingClientRect();

    const p =
        e.touches
            ? e.touches[0]
            : e;

    return {

        x:
            (p.clientX - r.left) *
            arrowCanvas.width /
            r.width,

        y:
            (p.clientY - r.top) *
            arrowCanvas.height /
            r.height
    };
}

function puntoRect(
    x,
    y,
    r
) {

    return (
        r &&
        x >= r.x &&
        x <= r.x + r.width &&
        y >= r.y &&
        y <= r.y + r.height
    );
}

function arrowBlocked(
    x,
    y,
    ang,
    scale
) {

    const f =
        Math.max(
            arrowCanvas.width,
            arrowCanvas.height
        ) / 1200;

    const len =
        150 *
        f *
        scale;

    const sx =
        x -
        len *
        Math.cos(
            ang +
            Math.PI / 4
        );

    const sy =
        y -
        len *
        Math.sin(
            ang +
            Math.PI / 4
        );

    for (
        let i = 0;
        i <= 18;
        i++
    ) {

        const t =
            i / 18;

        const px =
            sx +
            (x - sx) *
            t;

        const py =
            sy +
            (y - sy) *
            t;

        if (
            puntoRect(
                px,
                py,
                zonaLogo
            ) ||
            puntoRect(
                px,
                py,
                zonaEstampado
            )
        ) {
            return true;
        }
    }

    return false;
}

function dibujarFlecha() {

    if (!arrowCanvas) {
        return;
    }

    const im =
        new Image();

    im.onload = () => {

        const c =
            arrowCanvas.getContext('2d');

        c.clearRect(
            0,
            0,
            arrowCanvas.width,
            arrowCanvas.height
        );

        c.drawImage(
            im,
            0,
            0,
            arrowCanvas.width,
            arrowCanvas.height
        );

        if (flechaX == null) {
            return;
        }

        const f =
            Math.max(
                arrowCanvas.width,
                arrowCanvas.height
            ) / 1200;

        const len =
            150 *
            f *
            flechaEscala;

        const tip =
            32 *
            f *
            flechaEscala;

        const sx =
            flechaX -
            len *
            Math.cos(
                flechaAngulo +
                Math.PI / 4
            );

        const sy =
            flechaY -
            len *
            Math.sin(
                flechaAngulo +
                Math.PI / 4
            );

        c.beginPath();

        c.moveTo(
            sx,
            sy
        );

        c.lineTo(
            flechaX,
            flechaY
        );

        c.strokeStyle =
            '#000';

        c.lineWidth =
            Math.max(
                12,
                13 *
                f *
                flechaEscala
            );

        c.lineCap =
            'round';

        c.stroke();

        c.beginPath();

        c.moveTo(
            sx,
            sy
        );

        c.lineTo(
            flechaX,
            flechaY
        );

        c.strokeStyle =
            '#00ff00';

        c.lineWidth =
            Math.max(
                7,
                9 *
                f *
                flechaEscala
            );

        c.stroke();

        const a =
            Math.atan2(
                flechaY - sy,
                flechaX - sx
            );

        c.beginPath();

        c.moveTo(
            flechaX,
            flechaY
        );

        c.lineTo(
            flechaX -
            tip *
            Math.cos(
                a - Math.PI / 6
            ),
            flechaY -
            tip *
            Math.sin(
                a - Math.PI / 6
            )
        );

        c.lineTo(
            flechaX -
            tip *
            Math.cos(
                a + Math.PI / 6
            ),
            flechaY -
            tip *
            Math.sin(
                a + Math.PI / 6
            )
        );

        c.closePath();

        c.fillStyle =
            '#00ff00';

        c.fill();

        c.strokeStyle =
            '#000';

        c.lineWidth =
            Math.max(
                3,
                4 *
                f *
                flechaEscala
            );

        c.stroke();
    };

    im.src =
        fotoBase;
}

/* =========================================================
   GESTOS DE FLECHA
   ========================================================= */

function iniciarGestosFlecha() {

    if (
        !arrowCanvas ||
        arrowCanvas.dataset.ready
    ) {
        return;
    }

    arrowCanvas.dataset.ready =
        '1';

    arrowCanvas.addEventListener(
        'touchstart',
        e => {

            e.preventDefault();

            ultimoToque =
                Date.now();

            if (
                e.touches.length === 1
            ) {

                const p =
                    puntoArrow(e);

                if (
                    flechaX == null
                ) {

                    if (
                        arrowBlocked(
                            p.x,
                            p.y,
                            0,
                            1
                        )
                    ) {

                        return alert(
                            '🚫 La flecha no puede cubrir el logo ni el estampado.'
                        );
                    }

                    flechaX =
                        p.x;

                    flechaY =
                        p.y;

                    dibujarFlecha();
                }

                gestoActivo =
                    true;

                toqueInicial = {
                    tipo: 'move',
                    x: p.x,
                    y: p.y,
                    x0: flechaX,
                    y0: flechaY
                };

            } else if (
                e.touches.length === 2 &&
                flechaX != null
            ) {

                const a =
                    puntoArrow(
                        e.touches[0]
                    );

                const b =
                    puntoArrow(
                        e.touches[1]
                    );

                toqueInicial = {

                    tipo: 'transform',

                    dist:
                        Math.hypot(
                            b.x - a.x,
                            b.y - a.y
                        ),

                    ang:
                        Math.atan2(
                            b.y - a.y,
                            b.x - a.x
                        ),

                    x0:
                        flechaX,

                    y0:
                        flechaY,

                    s:
                        flechaEscala,

                    r:
                        flechaAngulo
                };

                gestoActivo =
                    true;
            }
        },
        {
            passive: false
        }
    );

    arrowCanvas.addEventListener(
        'touchmove',
        e => {

            e.preventDefault();

            if (!gestoActivo) {
                return;
            }

            if (
                e.touches.length === 1 &&
                toqueInicial?.tipo === 'move'
            ) {

                const p =
                    puntoArrow(e);

                const nx =
                    toqueInicial.x0 +
                    p.x -
                    toqueInicial.x;

                const ny =
                    toqueInicial.y0 +
                    p.y -
                    toqueInicial.y;

                if (
                    !arrowBlocked(
                        nx,
                        ny,
                        flechaAngulo,
                        flechaEscala
                    )
                ) {

                    flechaX =
                        nx;

                    flechaY =
                        ny;

                    dibujarFlecha();
                }

            } else if (
                e.touches.length === 2 &&
                toqueInicial?.tipo === 'transform'
            ) {

                const a =
                    puntoArrow(
                        e.touches[0]
                    );

                const b =
                    puntoArrow(
                        e.touches[1]
                    );

                const dist =
                    Math.hypot(
                        b.x - a.x,
                        b.y - a.y
                    );

                const ang =
                    Math.atan2(
                        b.y - a.y,
                        b.x - a.x
                    );

                const s =
                    clamp(
                        toqueInicial.s *
                        dist /
                        toqueInicial.dist,
                        .35,
                        3
                    );

                const r =
                    toqueInicial.r +
                    ang -
                    toqueInicial.ang;

                if (
                    !arrowBlocked(
                        toqueInicial.x0,
                        toqueInicial.y0,
                        r,
                        s
                    )
                ) {

                    flechaEscala =
                        s;

                    flechaAngulo =
                        r;

                    dibujarFlecha();
                }
            }
        },
        {
            passive: false
        }
    );

    arrowCanvas.addEventListener(
        'touchend',
        e => {

            if (!e.touches.length) {

                gestoActivo =
                    false;

                toqueInicial =
                    null;
            }
        },
        {
            passive: false
        }
    );
}

/* =========================================================
   CERRAR FLECHA
   ========================================================= */

function cerrarEditorFlecha() {

    if (arrowEditor) {

        arrowEditor.remove();

        arrowEditor =
            null;

        arrowCanvas =
            null;
    }

    confirmButton.style.display =
        'none';

    cancelSignalButton.style.display =
        'none';

    takeButton.style.display =
        'inline-block';

    cancelButton.style.display =
        'inline-block';

    signalButton.style.display =
        'inline-block';
}

/* =========================================================
   MEDIDA REAL
   ========================================================= */

measureStart.addEventListener(
    'click',
    () => {

        const v =
            Number(
                knownMeasure.value
            );

        if (
            !Number.isFinite(v) ||
            v <= 0
        ) {

            return alert(
                'Captura una medida real mayor que cero.'
            );
        }

        referenceReal =
            v;

        specialPanel.style.display =
            'none';

        setStatus(
            'Medida guardada: ' +
            v +
            ' m. Ahora toma la fotografía.'
        );

        takeButton.disabled =
            false;
    }
);

/* =========================================================
   ENVÍO
   ========================================================= */

function enviarFotoFinal(
    dataURL,
    extra = {}
) {

    preview.src =
        dataURL;

    preview.style.display =
        'block';

    const mensaje = {

        type:
            'CAMERA_STAMP_PHOTO',

        tipo:
            String(tipo || '')
                .trim(),

        fileName:
            crearNombreFoto(
                tipo,
                fechaFoto ||
                new Date()
            ),

        mimeType:
            'image/jpeg',

        data:
            dataURL,

        latitud:
            gpsActual
                ? gpsActual.lat
                : null,

        longitud:
            gpsActual
                ? gpsActual.lng
                : null,

        modo,

        metadata: {

            proyecto,

            tipoProyecto,

            hub,

            rama,

            tipoFoto:
                nombreTipo(tipo),

            fecha:
                (
                    fechaFoto ||
                    new Date()
                ).toISOString(),

            gps:
                gpsActual
        },

        ...extra
    };

    let confirmado =
        false;

    const cerrarTrasAck =
        e => {

            if (
                !e ||
                !e.data ||
                e.data.type !==
                'CAMERA_STAMP_ACK'
            ) {
                return;
            }

            if (
                e.data.fileName &&
                e.data.fileName !==
                mensaje.fileName
            ) {
                return;
            }

            confirmado =
                true;

            window.removeEventListener(
                'message',
                cerrarTrasAck
            );

            setStatus(
                '✅ FOTO RECIBIDA POR EL FORMULARIO.'
            );

            detenerCamara();

            setTimeout(
                () => {

                    try {

                        if (
                            window.opener &&
                            !window.opener.closed
                        ) {

                            window.opener.focus();
                        }

                        window.close();

                    } catch (_) {}

                },
                150
            );
        };

    window.addEventListener(
        'message',
        cerrarTrasAck
    );

    if (
        window.opener &&
        !window.opener.closed
    ) {

        window.opener.postMessage(
            mensaje,
            '*'
        );

        setStatus(
            '📤 Enviando fotografía al formulario…'
        );

    } else {

        window.removeEventListener(
            'message',
            cerrarTrasAck
        );

        setStatus(
            '❌ No se encontró el formulario que abrió la cámara.'
        );

        return;
    }

    setTimeout(
        () => {

            if (confirmado) {
                return;
            }

            window.removeEventListener(
                'message',
                cerrarTrasAck
            );

            setStatus(
                '✅ FOTO ENVIADA AL FORMULARIO.'
            );

            detenerCamara();

            try {

                if (
                    window.opener &&
                    !window.opener.closed
                ) {

                    window.opener.focus();
                }

                window.close();

            } catch (_) {}

        },
        2500
    );
}

/* =========================================================
   DETENER CÁMARA
   ========================================================= */

function detenerCamara() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                t => t.stop()
            );

        cameraStream =
            null;
    }

    video.srcObject =
        null;

    takeButton.disabled =
        true;

    if (motionHandler) {

        window.removeEventListener(
            'devicemotion',
            motionHandler
        );

        motionHandler =
            null;
    }

    if (orientationHandler) {

        window.removeEventListener(
            'deviceorientation',
            orientationHandler
        );

        orientationHandler =
            null;
    }
}

/* =========================================================
   SEÑALAR
   ========================================================= */

signalButton.addEventListener(
    'click',
    () => {

        modoSenalar =
            !modoSenalar;

        signalButton.textContent =
            modoSenalar
                ? '🎯 ACTIVO'
                : '🎯 SEÑALAR';

        setStatus(
            modoSenalar
                ? '🎯 SEÑALAR ACTIVADO. Toma la fotografía.'
                : 'Señalar desactivado.'
        );
    }
);

/* =========================================================
   FOTO
   ========================================================= */

takeButton.addEventListener(
    'click',
    tomarFoto
);

/* =========================================================
   SALIR
   ========================================================= */

cancelButton.addEventListener(
    'click',
    () => {

        detenerCamara();

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.close();
        }
    }
);

/* =========================================================
   CONFIRMAR FLECHA
   ========================================================= */

confirmButton.addEventListener(
    'click',
    () => {

        if (flechaX == null) {

            return alert(
                'Primero toca la imagen para colocar la flecha.'
            );
        }

        const data =
            arrowCanvas.toDataURL(
                'image/jpeg',
                .92
            );

        cerrarEditorFlecha();

        enviarFotoFinal(
            data,
            {
                modo: 'normal',

                metadata: {

                    flecha: {

                        x:
                            flechaX,

                        y:
                            flechaY,

                        angulo:
                            flechaAngulo,

                        escala:
                            flechaEscala
                    }
                }
            }
        );
    }
);

/* =========================================================
   CANCELAR FLECHA
   ========================================================= */

cancelSignalButton.addEventListener(
    'click',
    () => {

        cerrarEditorFlecha();

        fotoBase =
            null;

        setStatus(
            'Se canceló el señalamiento. Puedes tomar otra fotografía.'
        );
    }
);

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    'resize',
    () => {

        if (
            arrowEditor &&
            arrowCanvas
        ) {

            ajustarCanvasFlecha();
        }

        if (
            modo === 'plomado'
        ) {

            dibujarTransportador();
        }
    }
);

/* =========================================================
   INICIO
   ========================================================= */

window.addEventListener(
    'load',
    async () => {

        modeBadge.textContent =
            modo === 'medir'
                ? '📏 MEDIR POSTE'
                : modo === 'plomado'
                    ? '📐 PLOMADO POSTE'
                    : '📷 ' +
                      nombreTipo(tipo);

        if (modo === 'medir') {

            specialPanel.style.display =
                'block';

            specialHelp.textContent =
                'Captura la medida real del objeto conocido. La referencia y el poste deben estar aproximadamente a la misma distancia/plano para reducir error de perspectiva.';
        }

        if (modo === 'plomado') {

            plomadoOverlay.style.display =
                'block';

            plomadoActivo =
                true;

            dibujarTransportador();
        }

        setStatus(
            'Abriendo cámara…'
        );

        await iniciarCamara();
    }
);

</script>

</body>
</html>
